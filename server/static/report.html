<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо-2 · результаты</title>
<link rel="stylesheet" href="/ui.css">
<style>
/* Результаты экспериментов планшетки: «что влияет» — каждый параметр опыта при прочих равных и сводная
   таблица; ниже все опыты программы с параметрами и итогами — по агентам простые и температура, статика,
   аномалии, разведка (scan). Второе окно к /plan. */
.wrap { padding:8px 10px; }
.sel { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
table.t td, table.t th { padding:3px 6px; vertical-align:top; }
.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
tr.ctl td { background:repeating-linear-gradient(135deg, transparent 0 6px, rgba(128,128,128,.10) 6px 12px); }
tr.spoiled td { opacity:.6; }
.sum { margin:8px 0; }
details { margin-top:8px; }
.lay { color:var(--mut); font-size:.85em; }
.ana { margin:4px 0 12px; display:flex; flex-direction:column; gap:6px; }
.ana table.t { width:auto; min-width:min(100%, 760px); }
.ana tr.axh td { background:var(--idle-bg); }
.ana .piv td.c { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.ana select { font:inherit; }
</style>
</head>
<body>
<div class="top"><div class="row"><b>Колесо-2 · результаты</b><span id="conn" class="small"></span><span id="nav"></span><span class="sp"></span></div></div>
<div class="wrap">
  <div class="sel"><label>программа <select id="pSel"></select></label><button class="btn" id="bCsv">⇩ CSV</button><span class="small mut" id="pInfo"></span></div>
  <div class="sum" id="sum"></div>
  <section class="ana" id="ana"></section>
  <div class="small mut">все опыты программы по порядку:</div>
  <div style="overflow:auto"><table class="t" id="tbl"></table></div>
  <details><summary>по агентам: простых в секунду и температура в каждом опыте</summary><div style="overflow:auto" id="agt"></div></details>
  <details><summary>Аномалии, проверки и разведка</summary><div id="anom"></div></details>
</div>
<div class="foot" id="foot"><span class="mut">…</span></div>
<script src="/ui.js"></script>
<script src="/nav.js"></script>
<script>
"use strict";
let list = [], cur = null, curId = null;
const roleIcon = r => ICONS[r] || ICONS.idle;
const wayShort = w => ({ solo: "эгоист.", cascade: "каскад", one: "одно число", relay: "эстафета", same: "одинак.", all: "все со всеми", pair: "1:1" })[w] || w || "";
function layText(L, coil) {
  if (!L) return "";
  return `${L.rot ? esc(L.rot === "стоят" ? "без вращения" : L.rot) + " | " : ""}К1 ${roleIcon(L.w1.role)}${L.w1.way ? " " + wayShort(L.w1.way) : ""}${L.w1.noise ? " · " + esc(L.w1.noise) : ""} | К2 ${roleIcon(L.w2.role)}${L.w2.way ? " " + wayShort(L.w2.way) : ""}${L.w2.noise ? " · " + esc(L.w2.noise) : ""}${coil ? ` | поле ${esc(coil["1"])} ${esc(coil["2"])}` : ""}`;
}
// ---------- протокол опыта: итог, главное статики, аномалия ----------
// Главное статики за опыт — по каждому датчику: шум (СКО по трём осям, мg), насколько он отличается от шума того
// же датчика в своих контрольных опытах (control_for; нет — во всех контрольных) и самое большое отклонение от
// эталона без известной причины (max z, static_watch); рядом — вывод датчика словом.
const noiseOf = m => m && m.sd_x != null ? Math.sqrt(((m.sd_x || 0) ** 2 + (m.sd_y || 0) ** 2 + (m.sd_z || 0) ** 2) / 3) : null;   // мкg
function ctlNoise(x, r, mac) {
  const cs = (x.runs || []).filter(c => c.control && !c.spoiled && c !== r && (!r.control_for || c.name === r.control_for));
  const v = cs.map(c => noiseOf((c.static || {})[mac])).filter(q => q != null);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
const VW = { ok: ["✓", "ok", "как эталон"], check: ["⚠", "warn", "отклонение"], repeat: ["↻", "warn", "помеха"], nobase: ["◌", "mut", "нет эталона"], nodata: ["○", "mut", "нет данных"] };

  return mac.startsWith("gen:") ? mac.slice(4) : mac.slice(-5);
}
function statRows(x, r) {
  return Object.entries(r.static || {}).filter(([, m]) => m).map(([mac, m]) => {
    const nz = noiseOf(m), c = r.control ? null : ctlNoise(x, r, mac), ws = ((r.watch || {}).sensors || {})[mac] || {};
    return { mac, name: sname(x, mac), nz, d: nz != null && c ? (nz / c - 1) * 100 : null, z: ws.zmax, v: ws.verdict, why: (ws.reasons || [])[0] };
  });
}
function statMain(x, r) {
  const S = statRows(x, r);
  if (!S.length) return `<span class="mut">—</span>`;
  return S.slice(0, 2).map(q => {
    const vw = VW[q.v];
    return `<div><b>${esc(q.name)}</b> шум ${q.nz != null ? fmt(q.nz / 1000, 3) + " мg" : "—"}${q.d != null ? ` <span class="${Math.abs(q.d) >= 5 ? "warn" : "mut"}">(${q.d >= 0 ? "+" : "−"}${fmt(Math.abs(q.d), 1)} % к контролю)</span>` : r.control ? ` <span class="mut">(контроль)</span>` : ""}
      · <span title="самое большое отклонение от эталона за опыт без известной причины, в σ">max z ${q.z != null ? fmt(q.z, 1) : "—"}</span>${vw ? ` · <span class="${vw[1]}" title="${esc(q.why || "")}">${vw[0]} ${vw[2]}</span>` : ""}</div>`;
  }).join("") + (S.length > 2 ? `<div class="small mut">ещё ${S.length - 2} — в CSV</div>` : "");

// Итог опыта одним словом: испорчен · аномалия (подтвердилась / нет / проверяется) · отклонение статики · как контроль
function runVerdict(x, r, i) {
  const an = (x.anomalies || {})[String(i)], vd = (x.verdicts || {})[String(i)];

function anomOf(x, r, i) {
  const an = (x.anomalies || {})[String(i)], sc = (r.scan || [])[0];

  if (!curId) curId = active || (list[0] && list[0].id);

}
async function loadProg() {

}
function agentsOf(x) {
  const ids = new Set();

}
// Поле за шаг: по каждому магнитометру — |B| среднее ± СКО; эксцесс > 1 — «толчки поля» (переключения, железо рядом)

  return Object.values(f || {}).sort((a, b) => (a.id || 0) - (b.id || 0)).map(x => {
    const b = (x.stats || {})["|B|"] || {};
    return `№${x.id || "?"} ${fmt(b.mean, 1)} ± ${fmt(b.sd, 2)}${b.kurt > 1 ? " ◐ толчки" : ""}${x.part ? " (часть)" : ""}`;

function render() {
  const x = cur, prog = x.program || {}, steps = prog.steps || [], runs = x.runs || [], plan = x.plan || [];

  const ok = runs.filter(r => !r.spoiled);
  const ctl = ok.filter(r => r.control).length;
  $("sum").innerHTML = `выполнено <b>${runs.length}</b> · испорчено <b>${runs.filter(r => r.spoiled).length}</b> · контрольных <b>${ctl}</b> · аномалий <b>${Object.keys(x.anomalies || {}).length}</b> · подтвердилось <b>${Object.values(x.verdicts || {}).filter(v => v.confirmed).length}</b> · простых всего <b>${fmt(Math.round(ok.reduce((s, r) => s + ((((r.gen || {})["все"] || {}).pr_s || 0) * (r.t1 - r.t0)), 0)))}</b> за <b>${fmt(runs.reduce((s, r) => s + (r.t1 - r.t0), 0) / 60, 0)}</b> мин счёта${x.state === "running" ? ` · <span class="ok">идёт</span>` : ""}`;
  // протокол: по каждому опыту — параметры, итог, главное статики, аномалия, простые, температура, поле
  const head = `<tr><th>№</th><th>опыт · параметры</th><th>итог</th><th>статика: главное</th><th>аномалия</th><th class="num">простых</th><th class="num">пр/с</th><th class="num">°C</th><th>поле |B|<br><span class="small mut">мкТл ± СКО</span></th></tr>`;
  const rows = runs.map((r, i) => {

    const marks = [r.control ? "контроль" : "", r.confirm ? "проверка аномалии" : "", it.redo ? `передел ${it.redo}` : "", it.repeat ? `повторение ${it.repeat}` : "", it.again ? `↻ повтор ${it.why === "оператор" ? "по просьбе" : "после отклонения"}` : ""].filter(Boolean);
    const temps = Object.entries(g).filter(([k, m]) => k !== "все" && m && m.temp != null).map(([, m]) => m.temp);
    return `<tr class="${r.control ? "ctl" : ""} ${r.spoiled ? "spoiled" : ""}"><td>${i + 1}</td>
      <td>${esc(r.name)}${marks.length ? ` <span class='small mut'>(${marks.join(" · ")})</span>` : ""}<div class="lay">${new Date(r.t0 * 1000).toLocaleTimeString("ru-RU")} · ${fmt((r.t1 - r.t0) / 60, 1)} мин${r.rig && r.rig.gap_cm != null ? ` · между колёсами ${fmt(r.rig.gap_cm, 1)} см` : ""} · ${layText(st.layers || r.layers, st.coil || r.coil)}</div></td>

  // по агентам: простых в секунду и температура в каждом опыте
  $("agt").innerHTML = `<table class="t"><tr><th>№</th><th>опыт</th>${ags.map(a => `<th>${esc(a)}<br><span class="small mut">пр/с · °C</span></th>`).join("")}</tr>${runs.map((r, i) =>
    `<tr class="${r.control ? "ctl" : ""} ${r.spoiled ? "spoiled" : ""}"><td>${i + 1}</td><td class="small">${esc(r.name)}</td>${ags.map(a => { const m = (r.gen || {})[a] || {}; return `<td class="num">${m.pr_s != null ? fmt(m.pr_s, 1) : "—"}${m.temp != null ? ` · ${fmt(m.temp, 0)}°` : ""}</td>`; }).join("")}</tr>`).join("")}</table>`;
  renderAna(x);
  const an = Object.entries(x.anomalies || {});
  $("anom").innerHTML = an.length ? an.map(([i, hits]) => `<div><b>шаг ${+i + 1}</b>: ${hits.map(h => `${esc(h.mac)}/${esc(h.metric)} t ${fmtZ(h.z)} (p_adj ${esc(h.p_adj)}, n ${h.n})`).join("; ")}${(x.verdicts || {})[i] ? ` → ${(x.verdicts || {})[i].confirmed ? "<b>подтвердилась</b>" : "не подтвердилась"} (${(x.verdicts || {})[i].same} из ${(x.verdicts || {})[i].of})` : ""}</div>`).join("")
    : `<div class="mut small">аномалий по критерию не найдено; в колонке «разведка» — самый большой t каждого опытного шага</div>`;
}
// ---------- что влияет: параметры опыта против результата ----------
// Опыт с конструктора эксперимента несёт свои параметры (step.set): вращение, скорость, поле, излучение/поглощение,
// совместная работа, шум. Влияние параметра — «при прочих равных»: каждый опыт со значением v сравнивается с
// опытами, где этот параметр — опора (первое значение: колёса стоят, поле выкл …), а все остальные параметры те же.
// Среднее отношение (или разность) по таким парам и его стандартная ошибка — Δ ± SE; |Δ| / SE ≥ 3 — заметно,

const MET = {
  pr: { name: "простых в секунду, все", rel: true, d: 1, get: r => ((r.gen || {})["все"] || {}).pr_s },
  cand: { name: "кандидатов в секунду, все", rel: true, d: 0, get: r => ((r.gen || {})["все"] || {}).cand_s },
  temp: { name: "температура агентов, °C", rel: false, unit: "°C", d: 1, get: r => avgOf(Object.entries(r.gen || {}).filter(([k, m]) => k !== "все" && m && m.temp != null).map(([, m]) => m.temp)) },
  field: { name: "|B| магнитометров, мкТл", rel: false, unit: "мкТл", d: 1, get: r => avgOf(Object.values(r.field || {}).map(x => ((x.stats || {})["|B|"] || {}).mean).filter(v => v != null)) },
  stat: { name: "статика: доля опытов «⚠ проверить», %", rel: false, unit: "п.п.", d: 0, scale: 100, get: r => r.watch ? (r.watch.verdict === "check" ? 1 : 0) : null },

let anaMet = "pr", anaRow = null, anaCol = null, anaMode = "val";
const setOf = (x, r) => r.set || (((x.program || {}).steps || [])[r.step] || {}).set || null;

function axesOf(x, rows) {
