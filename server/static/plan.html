<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо-2 · планшетка</title>
<link rel="stylesheet" href="/ui.css">
<style>
/* Планшетка (docs/how_it_works.md, «Основной экран»): одно главное окно на весь экран, без прокрутки —
   слева крупно схема установки (всё живое: агенты, обороты, поле, аккумуляторы, потоки), справа «сейчас»,
   статика и строка эксперимента, внизу лента опытов. Всё, что настраивается подробно (эксперимент, состав и
   назначения, агент, диагностика, прошивка), — во всплывающих окнах; результаты — отдельным окном (/report).
   Цвет никогда не единственный признак: у каждого состояния значок и слово (Okabe-Ito в ui.css). */
/* настройка с нуля: шаги до запуска справа */
.setup { border:1px solid var(--on); border-radius:9px; padding:8px 10px; background:var(--card); display:flex; flex-direction:column; gap:7px; }
.setup .it { display:grid; grid-template-columns:1.4em minmax(0, 1fr) auto; gap:2px 8px; align-items:start; border-top:1px solid var(--line); padding-top:5px; }
.setup .it .ic { font-size:1.15em; font-weight:700; line-height:1.2; }
.setup .it .ac { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; max-width:15em; }
/* плашка «сейчас»: часы · что идёт · таймер */
.info { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:4px 14px; align-items:center; border:1px solid var(--line); border-radius:9px; padding:6px 10px; background:var(--card); }
.info .clk { display:flex; flex-direction:column; align-items:center; line-height:1.05; }
.info .clk b { font-size:1.75em; font-variant-numeric:tabular-nums; letter-spacing:.01em; }
.info .cur { font-size:1.08em; font-weight:700; }
.info .ist { min-width:0; }
.info .ist .row { flex-wrap:nowrap; }
.info .tmr { font-size:1.6em; font-variant-numeric:tabular-nums; line-height:1; }
.info .bar { margin:3px 0 1px; }
.info .ist .small { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fon { color:var(--on); font-weight:700; }
.stat { border:1px solid var(--line); border-radius:9px; padding:6px 10px; display:grid; grid-template-columns:minmax(240px, 1fr) minmax(0, 2.1fr); gap:4px 12px; align-items:start; }
.stat .stl, .stat .str { display:flex; flex-direction:column; gap:3px; min-width:0; }
.stat .ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media (max-width: 1100px) { .stat { grid-template-columns:minmax(0, 1fr); } }
/* фазы опыта значками (старт · подготовка · проверка · исполнение · итоги · отдых) — в таблице опытов */
.ph { position:relative; overflow:hidden; display:inline-flex; gap:4px; align-items:center; padding:2px 9px; border:1.5px solid var(--line2); border-radius:14px; font-size:.86em; color:var(--mut); background:var(--card); white-space:nowrap; }
.ph > i { position:absolute; left:0; top:0; bottom:0; background:currentColor; opacity:.16; }
.ph.done { color:var(--ink); border-color:var(--line); opacity:.75; }
.ph.now { font-weight:700; border-width:2px; }
.ph.now.ph-start, .ph.now.ph-up { color:var(--on); border-color:var(--on); }
.ph.now.ph-prep { color:var(--w-sta); border-color:var(--w-sta); background:color-mix(in srgb, var(--sta) 18%, var(--card)); }
.ph.now.ph-test { color:var(--w-sky); border-color:var(--w-sky); background:color-mix(in srgb, #56B4E9 16%, var(--card)); }
.ph.now.ph-run { color:var(--w-gen); border-color:var(--w-gen); background:color-mix(in srgb, var(--gen) 18%, var(--card)); }
.ph.now.ph-rest { color:var(--mut); border-color:var(--mut); }
.ph.now.ph-pause { color:var(--w-bad); border-color:var(--w-bad); }
.ph-ar { color:var(--mut); font-size:.8em; }
/* опыты таблицей из значков */
.rt { width:100%; border-collapse:collapse; font-size:.84em; }
.rt th { color:var(--mut); font-weight:500; text-align:center; padding:1px 3px; position:sticky; top:0; background:var(--card); }
.rt td { text-align:center; padding:2px 3px; border-top:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums; }
.rt tr { cursor:pointer; }
.rt tr.cur td { background:var(--on-bg); border-top:1.5px solid var(--on); border-bottom:1.5px solid var(--on); font-weight:700; }
.rt tr.next td:first-child { color:var(--on); font-weight:700; }
.rt tr.wait td { opacity:.6; }
.rt tr.ctl td { background-image:repeating-linear-gradient(135deg, transparent 0 6px, rgba(128,128,128,.10) 6px 12px); }
.stat .tm2 { font-size:1.3em; font-weight:700; line-height:1.15; }
.stat .ask { background:var(--on-bg); border-radius:7px; padding:3px 8px; }
.btn.halt { background:var(--bad); border-color:var(--bad); color:var(--on-ink); }
.btn.halt:hover { filter:brightness(1.1); }
.lh { color:var(--mut); font-size:.82em; padding-top:3px; white-space:nowrap; }
.opts { display:flex; flex-wrap:wrap; gap:3px; }
.opt { border:1px solid var(--line); border-radius:6px; padding:1px 7px; cursor:pointer; user-select:none; font-size:.86em; background:var(--card); }
.opt.on { border-color:var(--on); background:var(--on-bg); font-weight:600; }
.opt.on::before { content:"✓ "; }
.opt.dis { opacity:.5; cursor:not-allowed; text-decoration:line-through; }
/* окно «серия»: уровни-вложенность, перетаскивание за ⠿ */
.sopt { border:1px solid var(--line); border-radius:6px; padding:1px 7px; cursor:pointer; user-select:none; font-size:.86em; background:var(--card); }
.sopt.on { border-color:var(--on); background:var(--on-bg); font-weight:600; }
.sopt.on::before { content:"✓ "; }
.sopt.dis { opacity:.5; cursor:not-allowed; text-decoration:line-through; }
.sergrid { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:5px 12px; align-items:center; }
.serlev { display:flex; flex-direction:column; gap:4px; }
.slev { display:flex; gap:8px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:5px 8px; background:var(--card); }
.slev .sbody { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.slev.dragging { outline:2px dashed var(--on); opacity:.75; }
.sdrag { cursor:grab; touch-action:none; font-size:1.3em; line-height:1; padding:2px 4px; color:var(--mut); user-select:none; }
.snum { font-size:1.1em; min-width:1.2em; text-align:center; padding-top:1px; }
.sersum { margin-top:6px; }
.sheet.wide { width:min(1760px, 97vw); max-height:96vh; }
/* окно «эксперимент»: слева параметры (порядок — вложенность), справа список опытов; ниже — настройки */
.xbar { position:sticky; top:0; z-index:5; background:var(--card); display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:6px 2px; margin:-4px 0 8px; border-bottom:1px solid var(--line); }
.askbg { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:60; }
.askbox { background:var(--card); color:var(--ink); border:1px solid var(--line2); border-radius:10px; padding:16px 18px; max-width:min(560px, 92vw); box-shadow:0 10px 32px rgba(0,0,0,.3); }
.askin { width:100%; box-sizing:border-box; margin-top:10px; font:inherit; padding:6px 8px; }
.expgrid { display:grid; grid-template-columns:minmax(0, .85fr) minmax(0, 1.45fr); gap:14px; align-items:start; }
.expcol { display:flex; flex-direction:column; gap:6px; min-width:0; }
.exph { margin:0; font-size:1.02em; }
.slev.const { border-style:dashed; }
.g3w { display:flex; flex-wrap:wrap; gap:4px 14px; align-items:flex-end; }
.g3 { border-collapse:separate; border-spacing:3px; }
.g3 th { font-weight:400; font-size:.8em; color:var(--mut); text-align:center; white-space:nowrap; padding:0 3px; }
.g3 tr th:first-child { text-align:right; }
.g3c { min-width:88px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink); padding:2px 6px; cursor:pointer; font:inherit; font-size:.92em; line-height:1.15; display:flex; flex-direction:column; align-items:center; }
.g3c small { color:var(--mut); font-size:.78em; }
.tk { margin:6px 0; } .tk > .small { margin:2px 0 0 24px; max-width:70em; }
.xtab th.res { border-left:2px solid var(--line2); } .xtab th.res ~ th.res { border-left:none; }
.g3c.on { border-color:var(--on); background:var(--on-bg); font-weight:600; }
.xlist { max-height:50vh; overflow:auto; border:1px solid var(--line); border-radius:8px; }
.xtab { width:100%; }
.xtab thead th { position:sticky; top:0; background:var(--card); z-index:1; }
.xtab tr.xoff td { color:var(--mut); text-decoration:line-through; }
.xtab tr.ctl td { background:repeating-linear-gradient(135deg, transparent 0 6px, rgba(128,128,128,.12) 6px 12px); }
.xsets { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(640px, 100%), 1fr)); gap:8px; margin-top:10px; align-items:start; }
.xsets .seg button { white-space:nowrap; }
.xsets details summary, .expcol details summary { cursor:pointer; color:var(--mut); }
@media (max-width: 1100px) { .expgrid { grid-template-columns:minmax(0, 1fr); } }
/* живая статика на карточке: Гаусс, спектр, колебания — нажатие открывает окно «вживую» */
.stat .baserow { flex-wrap:nowrap; }
.stat .baserow .bl { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stat .baserow .seg, .stat .baserow > .small { flex:none; }
.svgrid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; cursor:pointer; border-radius:7px; }
.svgrid:hover { outline:1px solid var(--line2); }
.svgrid svg { background:var(--bg); border-radius:6px; }
.dlgframe { width:100%; height:calc(96vh - 110px); border:1px solid var(--line); border-radius:8px; background:var(--bg); display:block; }
.morelist { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:8px; }
.morelist .btn { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:8px 10px; white-space:normal; }
.dim { opacity:.45; }
.setline { font-size:.92em; border:1px solid var(--line); border-radius:9px; padding:6px 10px; }
.setline .ell { min-width:0; flex:1 1 220px; }
.setline > .mut { white-space:nowrap; flex:none; }
.ribbon { max-height:24vh; }
/* опыты — колонкой справа: текущий рамкой, выше — сделанные с итогами, ниже — следующие */
.runs { border:1px solid var(--line); border-radius:9px; padding:6px 8px; }
.runs .rh { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:4px; }
.runs .rl { max-height:44vh; overflow:auto; position:relative; }
.runs .rr { display:grid; grid-template-columns:1.6em 2.2em minmax(0, 1fr); gap:0 6px; padding:3px 4px; border-bottom:1px solid var(--line); font-size:.86em; cursor:pointer; }
.runs .rr .ic { text-align:center; }
.runs .rr .nn { font-weight:700; color:var(--mut); }
.runs .rr .pp { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.runs .rr .res { grid-column:3; font-size:.95em; }
.runs .rr.cur { background:var(--on-bg); border:1.5px solid var(--on); border-radius:6px; }
.runs .rr.ctl { background-image:repeating-linear-gradient(135deg, transparent 0 6px, rgba(128,128,128,.10) 6px 12px); }
.runs .rr.wait { opacity:.62; }
.runs .rr.bad { border-left:3px solid var(--bad); }
.steps { display:flex; gap:4px; overflow-x:auto; padding:2px 0 4px; }
.step { min-width:118px; max-width:170px; border:1px solid var(--line); border-radius:8px; padding:3px 6px; font-size:.8em; flex:0 0 auto; background:var(--card); cursor:pointer; }
.step.ctl { background:repeating-linear-gradient(135deg, transparent 0 6px, rgba(128,128,128,.12) 6px 12px); }
.step.cur { border:2px solid var(--on); }
.step.spoiled { border-style:dashed; }
.step.plan { border-style:dotted; }
.step .n { font-weight:700; }
.step .bar { height:4px; margin-top:3px; }
.step .bar i { height:4px; }
.foot { display:flex; gap:14px; flex-wrap:wrap; font-size:.86em; padding:0 4px; align-items:center; }
.dlg-h { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:1.05em; }
.kv2 { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:center; }
.rcgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:10px 18px; margin-top:6px; }
.rcgrid > section { min-width:0; display:flex; flex-direction:column; gap:4px; }
.rch { font-weight:600; font-size:13px; }
.rct { border-collapse:collapse; font-variant-numeric:tabular-nums; }
.rct td, .rct th { padding:2px 8px 2px 0; text-align:left; font-weight:normal; }
.rct th { color:var(--mut); font-size:12px; }
.kv2 > span:nth-child(odd) { color:var(--mut); }
.btn.sm { padding:.12em .55em; font-size:.88em; }
.btn.tiny { padding:0 .4em; font-size:.82em; border-radius:6px; }
label.inl { display:inline-flex; align-items:center; gap:4px; margin:2px 10px 2px 0; }
[hidden] { display:none !important; }          /* поля отдыха в окне «опыт» прятались атрибутом hidden, а display:inline-flex его перебивал */
.dlgmsg:empty { display:none; }
.dlgmsg { margin:0 0 8px; padding:4px 8px; border-radius:7px; background:var(--on-bg); }
.seg button.sel::before { content:"✓ "; }       /* выбранное в сегменте — не только заливкой */
.fs { border:1px solid var(--line); border-radius:9px; padding:6px 10px; margin:0 0 8px; }
.fs legend { color:var(--mut); font-size:.85em; padding:0 4px; }
/* ===== главный экран v3: колёса крупно, шапка в одну строку, мини-карточка слева сверху, статика колонкой справа,
   окошки при наведении, полупрозрачность. Токены — только этой страницы (окна-iframe — свои документы). ===== */
:root {
  --glass:rgb(255 255 255 / .80); --glass-solid:rgb(255 255 255 / .95); --glass-line:rgb(29 34 40 / .14);
  --glass-hi:inset 0 1px 0 rgb(255 255 255 / .7); --glass-shadow:0 6px 24px rgb(20 23 27 / .16); --glass-fx:blur(10px) saturate(140%);
  --tint:color-mix(in srgb, var(--card) 82%, transparent);
  --mut-glass:#565d68; --on-ink:#fff; --halo:rgb(255 255 255 / .92); --stage-a:#ffffff; --stage-b:#e9e7e1;
  /* штрихи схемы: не меньше 4:1 на светлом фоне; заливки — сами цвета Okabe-Ito (--gen, --abs…) только через прозрачность */
  --w-gen:#007A5E; --w-abs:#A8457F; --w-sta:#9A6400; --w-sky:#1F6E9E; --w-yel:#7A7100; --w-blue:#0072B2; --w-int:#4a525d; --w-bad:#B84F00;
  --disc-a:.16; --cell-a:.14; --u-a:.16; --node-mix:24%;
  /* шумы: цвет помогает, узнаётся источник по значку, штриху и месту дорожки (порядок SOURCES) */
  --n-rng:var(--w-int); --n-jit:var(--w-int); --n-adc:var(--w-yel); --n-csi:var(--w-sky); --n-csip:var(--w-sky);
  --n-acc:var(--w-sta); --n-mag:var(--w-blue); --n-bc:var(--w-abs);
  --d-rng:none; --d-jit:5 3; --d-adc:2 3; --d-csi:1 4; --d-csip:6 3 1 3; --d-acc:9 4; --d-mag:12 3 3 3; --d-bc:1 7;
  --e-out:cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --glass:rgb(29 33 39 / .80); --glass-solid:rgb(29 33 39 / .95); --glass-line:rgb(232 234 237 / .14);
  --glass-hi:inset 0 1px 0 rgb(255 255 255 / .06); --glass-shadow:0 8px 28px rgb(0 0 0 / .45);
  --mut-glass:#b0b6bf; --on-ink:#14171b; --halo:rgb(16 19 23 / .88); --stage-a:#262b33; --stage-b:#101317;
  --w-gen:#2DB88E; --w-abs:#DA92BB; --w-sta:#E69F00; --w-sky:#56B4E9; --w-yel:#F0E442; --w-blue:#1f84c6; --w-int:#c3c8cf; --w-bad:#ff8a4c;
  --disc-a:.26; --cell-a:.20; --u-a:.38; --node-mix:30%; } }
:root[data-theme="dark"] {
  --glass:rgb(29 33 39 / .80); --glass-solid:rgb(29 33 39 / .95); --glass-line:rgb(232 234 237 / .14);
  --glass-hi:inset 0 1px 0 rgb(255 255 255 / .06); --glass-shadow:0 8px 28px rgb(0 0 0 / .45);
  --mut-glass:#b0b6bf; --on-ink:#14171b; --halo:rgb(16 19 23 / .88); --stage-a:#262b33; --stage-b:#101317;
  --w-gen:#2DB88E; --w-abs:#DA92BB; --w-sta:#E69F00; --w-sky:#56B4E9; --w-yel:#F0E442; --w-blue:#1f84c6; --w-int:#c3c8cf; --w-bad:#ff8a4c;
  --disc-a:.26; --cell-a:.20; --u-a:.38; --node-mix:30%; }
/* та же специфичность, что у тёмных блоков, и после них — действуют в обеих темах */
@media (hover: none) and (pointer: coarse) { :root:root { --glass-fx:blur(6px); } }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { :root:root { --glass:var(--glass-solid); } }
:root[data-glass="off"] { --glass:var(--glass-solid); --glass-fx:none; --tint:var(--card); }
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  :root:root { --glass:var(--glass-solid); --glass-fx:none; --glass-line:var(--line2); --tint:var(--card); } }
/* контраст: белое на #56B4E9 / #ff8a4c в тёмной теме ≈ 2,3:1 — только на этой странице */
.btn.sel, .seg button.sel { color:var(--on-ink); }
.screen.plan { height:100vh; height:100dvh; grid-template-rows:auto minmax(0, 1fr); gap:6px; padding:6px;
  background:radial-gradient(130% 100% at 35% 45%, var(--stage-a), var(--bg) 75%); }
.screen.plan .panel { background:var(--tint); border-color:var(--glass-line); }
.glass { background:var(--glass); border:1px solid var(--glass-line); border-radius:12px; box-shadow:var(--glass-shadow), var(--glass-hi); color:var(--ink); }
.glass .mut { color:var(--mut-glass); }
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass.float { -webkit-backdrop-filter:var(--glass-fx); backdrop-filter:var(--glass-fx); } }
@media (forced-colors: active) { .glass { background:Canvas; color:CanvasText; border:1px solid CanvasText; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; } }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
/* шапка — один ряд */
.topbar { flex-direction:row; align-items:center; gap:8px; row-gap:4px; padding:4px 8px; min-height:52px; overflow:visible; position:relative; z-index:9; flex-wrap:wrap; }
.topbar .btn { padding:.3em .75em; }
.topbar .pill { max-width:15em; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; }
.topbar #conn { white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.topbar .clk { display:flex; align-items:baseline; gap:5px; white-space:nowrap; } .topbar .clk b { font-size:1.15em; font-variant-numeric:tabular-nums; }
.modes { display:flex; gap:6px; }
.runcap { display:flex; gap:6px; align-items:center; flex:none; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }   /* не влезает — вся группа на вторую строку */
.runcap .btn { min-height:40px; }
.runcap .btn.halt { font-weight:700; padding:.4em 1.2em; }
@media (max-width: 1400px) { #day, #conn .mut { display:none; } .runcap .btn { padding:.3em .6em; } }
/* меню ☰ */
.menu { position:relative; flex:none; }
.mbtn b { font-weight:700; }
.menup { position:absolute; left:0; top:calc(100% + 6px); z-index:9; width:min(620px, 94vw); padding:8px; display:flex; flex-direction:column; gap:6px;
  visibility:hidden; opacity:0; transform:translateY(-4px); transition:opacity .14s, transform .14s, visibility .14s; }
.menu.open .menup { visibility:visible; opacity:1; transform:none; }
.menup .mgrid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:3px; }
.menup .mi { display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left; border:1px solid transparent; background:transparent;
  color:var(--ink); border-radius:8px; padding:6px 8px; font:inherit; cursor:pointer; }
.menup .mi:hover, .menup .mi:focus-visible { border-color:var(--on); background:color-mix(in srgb, var(--on) 10%, transparent); }
.menup .mi span { font-size:.84em; color:var(--mut-glass); }
.menup .mview { display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-top:1px solid var(--glass-line); padding-top:6px; }
/* сцена: схема на всё место, карточка и кнопки — поверх */
.stage { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:6px; min-height:0; position:relative; }
.picp { position:relative; padding:0; }
.picp > .pic { flex:1 1 auto; min-height:240px; }
.mc { position:absolute; left:8px; top:8px; z-index:3; max-width:var(--hudw, 380px); max-height:var(--hudh, 150px); overflow:hidden;
  padding:6px 10px; display:flex; flex-direction:column; gap:2px; font-size:.92em; line-height:1.3;
  transition:max-height .18s var(--e-out), max-width .18s var(--e-out); }
.mc:hover, .mc:focus-within { max-height:70vh; max-width:min(580px, 60vw); z-index:4; }
.mc .l { display:flex; gap:6px; align-items:center; min-width:0; white-space:nowrap; }
.mc .l > * { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.mc .t1 { font-size:1.06em; } .mc .nm { font-weight:600; } .mc .tmr { font-size:1.35em; margin-left:auto; flex:none; }
.mc .k, .mc .pict { flex:none; } .mc .pict { display:inline-flex; color:var(--ink); }
.mc .src { margin-left:auto; flex:none; font-size:.8em; color:var(--mut-glass); border:1px solid var(--glass-line); border-radius:6px; padding:0 .4em; }
.mc .l:focus-visible { outline:2px solid var(--on); outline-offset:1px; border-radius:6px; }
.pstrip { display:flex; gap:2px; }
.pstrip i { position:relative; overflow:hidden; flex:1 1 0; min-width:1.7em; text-align:center; font-style:normal; font-size:.82em; line-height:1.5;
  border:1.5px solid var(--line2); border-radius:9px; color:var(--mut-glass); }
.pstrip i u { position:absolute; inset:0 auto 0 0; width:var(--f, 0%); background:currentColor; opacity:.18; }
.pstrip i.done { color:var(--ink); opacity:.75; } .pstrip i.now { font-weight:700; border-width:2px; }
.pstrip i.now.ph-start, .pstrip i.now.ph-up { color:var(--on); border-color:var(--on); }
.pstrip i.now.ph-prep { color:var(--w-sta); border-color:var(--w-sta); } .pstrip i.now.ph-test { color:var(--w-sky); border-color:var(--w-sky); }
.pstrip i.now.ph-run { color:var(--w-gen); border-color:var(--w-gen); } .pstrip i.now.ph-rest { color:var(--mut); border-color:var(--mut); }
.pstrip i.now.ph-pause { color:var(--w-bad); border-color:var(--w-bad); }
.pichead { position:absolute; right:8px; top:8px; z-index:3; padding:3px 6px; gap:6px; flex-wrap:nowrap; font-size:.9em; }
.pichead.wide { left:calc(var(--hudw, 380px) + 16px); flex-wrap:wrap; }
.pichead .small { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* сообщения — всплывают над схемой и тают (низ экрана свободен) */
.toasts { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); z-index:5; display:flex; flex-direction:column-reverse; gap:4px;
  align-items:center; pointer-events:none; width:max-content; max-width:min(680px, 70%); }
.toast { pointer-events:auto; padding:4px 12px; border-radius:10px; font-size:.9em; line-height:1.35; animation:toastin .22s var(--e-out); }
@keyframes toastin { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
/* подвал предупреждений: отклонения статики строками внизу — ничего не закрывают; подробно — по нажатию */
.warnbar { display:flex; flex-direction:column; gap:2px; padding:4px 8px; max-height:5.6em; overflow-y:auto; font-size:.88em; }
.warnbar .wl { display:flex; gap:8px; align-items:center; min-width:0; }
.warnbar .wl .why { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.warnbar .wl.fresh .why { font-weight:600; }
.warnbar .whead { display:flex; gap:8px; align-items:center; }
/* правая колонка: статика (датчики друг под другом), опыты, эксперимент; свёрнута — полоска, при наведении выезжает */
.dock { position:relative; display:flex; flex-direction:row-reverse; gap:6px; min-height:0; z-index:7; }
.rail { display:none; width:56px; flex-direction:column; gap:6px; padding:6px 4px; border:1px solid var(--glass-line); border-radius:10px; background:var(--tint); }
.dock:not([data-state="pin"]) .rail { display:flex; }
.rail .rb { display:flex; flex-direction:column; align-items:center; gap:1px; border:1px solid transparent; border-radius:8px; background:transparent;
  color:var(--ink); font:inherit; font-size:.8em; padding:5px 2px; cursor:pointer; text-align:center; }
.rail .rb b { font-size:1.35em; line-height:1; } .rail .rb small { font-variant-numeric:tabular-nums; color:var(--mut); }
.rail .rb:hover, .rail .rb[aria-expanded="true"] { border-color:var(--on); }
.side { width:clamp(300px, 25vw, 460px); display:flex; flex-direction:column; gap:6px; min-height:0; overflow-y:auto; }
.dock:not([data-state="pin"]) .side { position:absolute; right:calc(100% + 6px); top:0; bottom:0; padding:6px; border-radius:12px; border:1px solid var(--glass-line);
  background:var(--glass-solid); box-shadow:var(--glass-shadow); visibility:hidden; opacity:0; transform:translateX(10px);
  transition:opacity .16s, transform .16s, visibility .16s; }
.dock[data-state="peek"] .side { visibility:visible; opacity:1; transform:none; }
#info:empty { display:none; }
.sstat { padding:6px 8px; gap:4px; flex:none; overflow:visible; }
.sstat .shd { display:flex; gap:6px; align-items:center; min-width:0; }
.sstat .shd .tm2 { font-size:1.15em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.sstat .ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sstat .ctl { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.sens { border-top:1px solid var(--glass-line); padding-top:4px; display:flex; flex-direction:column; gap:2px; cursor:pointer; border-radius:6px; }
.sens .sl { display:flex; gap:6px; align-items:baseline; font-size:.86em; min-width:0; white-space:nowrap; overflow:hidden; }
.sens .sl > * { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.sens svg { display:block; width:100%; height:auto; background:var(--bg); border-radius:6px; }
.sens svg + svg { margin-top:3px; }
.sens:hover svg { outline:1px solid var(--line2); }
.sstat .baserow { display:flex; gap:6px; align-items:center; flex-wrap:nowrap; font-size:.86em; min-width:0; }
.sstat .baserow .bl { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 auto; }
.side .runs { flex:1 1 auto; min-height:120px; display:flex; flex-direction:column; }
.side .runs .rl { flex:1 1 auto; min-height:0; max-height:none; }
.side .setline { flex:none; }
/* окошко при наведении — одно на страницу */
#hpop { position:fixed; left:0; top:0; z-index:35; width:min(340px, calc(100vw - 16px)); padding:8px 11px; font-size:.92em; line-height:1.4;
  visibility:hidden; opacity:0; transform:translateY(4px); transition:opacity .12s, transform .12s, visibility .12s; pointer-events:none; }
#hpop.on { visibility:visible; opacity:1; transform:none; pointer-events:auto; }
#hpop.wide { width:min(440px, calc(100vw - 16px)); }
#hpop.xwide { width:min(720px, calc(100vw - 16px)); }
#hpop .hh { font-weight:700; margin-bottom:3px; } #hpop .hn { margin-top:5px; font-size:.9em; color:var(--mut-glass); }
#hpop .ha { display:flex; gap:6px; margin-top:7px; align-items:center; }
#hpop .hk { display:grid; grid-template-columns:1.6em minmax(0, 1fr); gap:3px 8px; align-items:baseline; }
#hpop .hk > span { text-align:center; color:var(--mut-glass); }
#hpop .nsh { display:grid; grid-template-columns:7.5em 1fr 3.4em; gap:6px; align-items:center; }
#hpop .nsh .bar { height:6px; } #hpop .nsh b { text-align:right; font-variant-numeric:tabular-nums; }
#hpop .nsh .warn { grid-column:1 / -1; }
#hpop table { border-collapse:collapse; font-size:.9em; } #hpop td, #hpop th { padding:0 4px; text-align:right; font-variant-numeric:tabular-nums; }
#hpop .g3 { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; }
#hpop .g3 svg { background:var(--bg); border-radius:6px; }
#hpop .lg { display:grid; grid-template-columns:4.2em minmax(0, 1fr); gap:4px 10px; align-items:center; }
#hpop .lg svg { display:block; }
#hpop .lm > span { display:block; margin:2px 0; }
.hp-on:not(svg *) { outline:2px solid var(--on); outline-offset:2px; }
/* схема: петли с фазой от часов страницы, разовые события, движение по выбору */
#pic > svg { width:100%; height:100%; display:block; }
#pic > svg text { paint-order:stroke fill; stroke:var(--halo); stroke-width:3px; stroke-linejoin:round; }
#pic > svg text.nh { stroke:none; }          /* надпись на залитой кнопке — без ореола */
#pic svg [data-act] { cursor:pointer; }
#pic svg .u { fill:none; stroke-opacity:var(--u-a); stroke-linecap:round; }
#pic svg .cell { fill-opacity:var(--cell-a); }
#pic svg .hit { fill:transparent; stroke:none; }
#pic svg .hits { fill:none; stroke:transparent; pointer-events:stroke; }
#pic svg .fx, #pic svg .fx1, #pic svg .l9 { pointer-events:none; }
#pic svg [tabindex]:focus { outline:none; }
#pic svg [tabindex]:focus-visible > .pa, #pic svg .hp-on > .pa, #pic svg .hl-on > .pa { stroke:var(--on); stroke-width:5; }
#pic.dimrest svg [data-way]:not(.hl-on) { opacity:.28; }
#pic svg .fx { animation-timing-function:linear; animation-iteration-count:infinite; animation-delay:calc((var(--t, 0) + var(--o, 0)) * -1s); }
#pic svg .fx.flow { animation-name:fxflow; }
#pic svg .fx.rev { animation-direction:reverse; }
#pic svg .fx.run { animation-name:fxrun; }
#pic svg .fx.spin { animation-name:fxspin; transform-box:fill-box; transform-origin:center; }
#pic svg .fx.wave { animation-name:fxwave; animation-timing-function:ease-out; transform-box:fill-box; transform-origin:center; stroke-opacity:.6; }
#pic svg .fx.glow { animation-name:fxglow; animation-timing-function:ease-in-out; }
#pic svg .fx1 { animation-iteration-count:1; animation-fill-mode:both; animation-delay:calc((var(--e, 0) - var(--t, 0)) * 1s); }
#pic svg .fx1.flash { animation-name:fxflash1; animation-duration:1.4s; animation-timing-function:ease-out; transform-box:fill-box; transform-origin:center; }
#pic svg .fx1.rise { animation-name:fxrise1; animation-duration:1.6s; animation-timing-function:ease-out; }
#pic svg .fx1.pkt { animation-name:fxpkt; animation-duration:1.2s; animation-timing-function:linear; }
@keyframes fxspin { to { transform:rotate(360deg); } }
@keyframes fxflow { to { stroke-dashoffset:-20; } }
@keyframes fxrun { to { stroke-dashoffset:-100; } }
@keyframes fxwave { 0% { transform:scale(.8); opacity:.75; } 100% { transform:scale(1.7); opacity:0; } }
@keyframes fxglow { 0%, 100% { stroke-opacity:.10; } 50% { stroke-opacity:.34; } }
@keyframes fxflash1 { 0% { transform:scale(1); opacity:0; } 4% { opacity:.95; } 100% { transform:scale(1.9); opacity:0; } }
@keyframes fxrise1 { 0% { transform:translateY(0); opacity:0; } 4% { opacity:1; } 75% { opacity:1; } 100% { transform:translateY(-22px); opacity:0; } }
@keyframes fxpkt { 0% { stroke-dashoffset:0; opacity:0; } 3% { opacity:1; } 88% { opacity:1; } 100% { stroke-dashoffset:-100; opacity:0; } }
:root[data-motion="calm"] #pic svg .fx1.pkt, :root[data-motion="calm"] #pic svg .baton, :root[data-motion="calm"] #pic svg .wave2 { display:none; }
:root[data-motion="calm"] #pic svg .fx.flow, :root[data-motion="calm"] #pic svg .fx.run { animation-duration:4s !important; }
:root[data-motion="off"] #pic svg * { animation:none !important; }
:root[data-motion="off"] #pic svg .fx1.pkt, :root[data-motion="off"] #pic svg .fx1.flash, :root[data-motion="off"] #pic svg .baton,
:root[data-motion="off"] #pic svg .wave2 { display:none; }
@media (prefers-reduced-motion: reduce) { :root:not([data-motion]) #pic svg * { animation:none !important; } }
:root[data-dlg] #pic svg * { animation-play-state:paused; }
@media (prefers-reduced-motion: reduce) { .mc, .menup, .side, #hpop, .toast { transition:none !important; animation:none !important; transform:none !important; } }
:root[data-motion="off"] :is(.mc, .menup, .side, #hpop, .toast) { transition:none !important; animation:none !important; transform:none !important; }
@keyframes alarmpulse { 50% { background:var(--bad); color:var(--on-ink); } }
@media (prefers-reduced-motion: reduce) { .alarm.fresh { color:var(--on-ink); } }
:root[data-motion="off"] .alarm.fresh { animation:none; background:var(--bad); color:var(--on-ink); }
#hpop[role="tooltip"] { pointer-events:none; }         /* подсказка без кнопок не ловит нажатия соседних кнопок */
/* узко: одна колонка, страница прокручивается */
@media (max-width: 900px) {
  .screen.plan { height:auto; }
  .topbar { position:sticky; top:0; z-index:20; background:var(--card); }     /* «■ Всё стоп» не уезжает при прокрутке */
  .runcap { flex:1 1 100%; }
  #bHalt { order:-1; }
  .stage { display:flex; flex-direction:column; }
  .mc, .pichead { position:static; max-width:none; max-height:none; }
  .mc { order:-2; } .pichead { order:-1; }
  .picp > .pic { height:56vw; flex:none; min-height:0; }
  .rail { display:none !important; }
  .dock { display:block; }
  .side, .dock:not([data-state="pin"]) .side { position:static; visibility:visible; opacity:1; transform:none; width:auto; box-shadow:none; }
  .toasts { position:fixed; bottom:8px; }
}
</style>
</head>
<body>
<div class="screen plan">
  <header class="panel topbar" id="top">
    <div class="menu" id="menu">
      <button type="button" class="btn mbtn" id="bMenu" aria-expanded="false" aria-controls="menuP">☰ <b>Колесо-2</b></button>
      <div class="menup glass float" id="menuP" aria-label="разделы и окна">
        <div class="mnav"><span id="nav"></span></div>
        <div class="mgrid" id="menuItems"></div>
        <div class="mview" id="menuView" role="group" aria-label="вид"></div>
      </div>
    </div>
    <span id="conn" class="small"></span>
    <span id="modes" class="modes"></span>
    <span class="sp"></span>
    <span id="alarm"></span>
    <button class="btn sm" id="bSound" data-act="sound" data-tt="Звук тревоги статики: вкл / выкл (нажатие — проба звука)">🔔 звук</button>
    <button type="button" class="tip" data-tip="alarm" aria-label="что такое тревога статики">ⓘ</button>
    <span class="clk"><b id="clock" class="num"></b><span class="small mut" id="day"></span></span>
    <span class="runcap" role="group" aria-label="запуск и остановка">
      <button class="btn go" data-act="exp" data-tt="Эксперимент: что меняем (вращение, поле, роли, совместная работа, шум) и порядок вложенности → список опытов; длительность, отдых, повторы">✎ Эксперимент…</button>
      <button type="button" class="tip" data-tip="run" aria-label="что делают кнопки запуска">ⓘ</button>
      <button class="btn big go" id="bRun" data-tt="Запустить эксперимент: опыты — в колонке справа">▶ Запустить</button>
      <button class="btn big go" id="bCont" hidden data-tt="Продолжить остановленную или прерванную программу с первого невыполненного опыта: те же опыты и порядок, итоги — в ту же запись">↻ Продолжить</button>
      <button class="btn big" id="bPause" hidden data-tt="Пауза после текущего опыта: колёса и катушки встанут, агенты остынут — можно заменить аккумуляторы, потом «▶ Продолжить». Нажать ещё раз — отменить">⏸ Пауза</button>
      <button class="btn big go" id="bResume" hidden data-tt="Программа на паузе: продолжить с того же места">▶ Продолжить</button>
      <button class="btn big stop" id="bStop" data-tt="Остановить программу после текущего опыта; потом её можно продолжить («↻ Продолжить»)">⏹ Стоп после опыта</button>
      <button class="btn big halt" id="bHalt" data-tt="Всё стоп сразу: программа, счёт у всех агентов, моторы, катушки выкл">■ Всё стоп</button>
    </span>
  </header>
  <main class="stage" id="stage">
    <section class="panel picp" id="picp">
      <div class="pic" id="pic"></div>
      <div class="mc glass float" id="mc" role="group" aria-label="что идёт и в каком режиме колёса"></div>
      <div class="row pichead glass" id="pichead"></div>
      <div class="toasts" id="foot" aria-hidden="true"></div>
      <span id="mcLive" class="sr" aria-live="polite"></span><span id="noteLive" class="sr" aria-live="polite"></span>
    </section>
    <aside class="dock" id="dock" data-state="pin">
      <nav class="rail" id="rail" aria-label="статика и опыты"></nav>
      <section class="side" id="side">
        <div id="info"></div>
        <div id="stat"></div>
        <div id="runs" class="panel runs"></div>
        <div class="panel row setline" id="setline"></div>
      </section>
    </aside>
  </main>
  <section class="panel ribbon" id="ribbon" hidden></section>
  <footer class="panel warnbar" id="warns" aria-label="предупреждения статики" hidden></footer>
</div>

<script>
"use strict";
// ---------- пояснения ⓘ: что это и зачем — по нажатию (на планшете подсказки title не видны) ----------
const TIPS = {
  pic: ["Схема установки", "Всё вживую, по телеметрии. Внутри обода — откуда шум: дорожки источников к каждому агенту (⚄ ГСЧ, ≋ CSI, ⏚ АЦП, ⧖ RC, ↕ акселерометр, 🧲 магнитометр, ↺ обратный — у каждого свой штрих), толщина — доля бит, точки — темп. Эгоистичный — у агента своя замкнутая ячейка, агенты не связаны. Снаружи — куда уходит: каскад — двусторонняя шина, проверяют все (✓); эстафета — кольцо со стрелками и палочкой (темп показан медленнее); одно число — спицы к общему числу ① в середине. Агент: номер, значок дела, температура (дуга — от 40 °C до предела); вспышка и «+N» — найдены простые; волны — поглотитель выпускает кадры. Дуга сверху — простые к поглотителям другого колеса, снизу — обратный шум. Обод синий со стрелками — поле катушки; пунктир снаружи бежит — колесо крутится. В углах — агент катушки, кнопки поля и аккумуляторы. Наведите на что угодно — окошко с подробностями; нажатие — окно."],
  setup: ["Настройка установки", "Нажмите плату — она выделится синим кольцом, места подсветятся. Нажмите место: колесо 1 или 2 (генератор), катушку под колесом или моторы посередине внизу (агент роли M), измерители посередине (статика), «свободные» внизу (снять с колеса). Если роль меняется (генератор · моторы и катушки · измеритель), плата перезапустится ≈ 15 с — спросим. «◉ мигнуть» — найти выбранную плату по светодиоду. Новые платы — «⇪ прошить по USB» в шагах справа; после прошивки они появляются в «свободных». Справа — шаги с нуля до запуска с кнопками."],
  roles: ["Излучение / поглощение", "Что делает каждое колесо в опыте: строка — колесо 1, столбец — колесо 2. ▶ генерирует — агенты ищут простые из шума. ▼ поглощает — получает простые генераторов другого колеса и выпускает их в эфир, смешав со своим шумом; кто чьё и как — карточка «поглощение». ⏸ стоит — агенты не считают. ⏸⏸ «только статика» — никто не считает, а вращение и поле опыта идут: видно, что воздействие делает с датчиками само по себе. Поглощать нечего — клетки ▼▼, ▼⏸, ⏸▼ недоступны. Отмеченных клеток несколько — перебираются все."],
  ways: ["Совместная работа", "Как считают генераторы колеса (поглотители — карточка «поглощение»). Эгоистичный — каждый сам набирает шум, складывает число и проверяет. Каскад — числа из кусочков шума всех агентов колеса, проверяют все сразу. Одно число на всех — одно число на группу, его проверяют все (~10 простых/с). Эстафета — число из шума всех, проверяет один, ход по кругу."],

  absorb: ["Поглощение", "Кто чьё поглощает и как — для опытов, где одно колесо генерирует, а другое поглощает. Кто чьё: все со всеми — каждый поглотитель берёт все простые; пары 1:1 — у каждого поглотителя свой генератор (по номерам), генераторы без пары — контроль внутри опыта; все — одного — все поглощают простые одного генератора, остальные работают без поглощения; каждое — одному — генераторы поделены между поглотителями, каждое простое поглощается ровно один раз; половина колеса — первую половину генераторов поглощают все, вторую никто. Как: смешать целиком — каждый смешивает всё число со своим шумом и выпускает кадр; по кускам — каждый свой кусок числа; эстафетой — передают друг другу, в эфир один кадр; пустышка — тот же трафик без числа; только слушают — без трафика. Пустышка и «только слушают» — контроль: отделяют действие числа от действия радио. «Кто чьё» понимает новая прошивка; старая поглощает все простые."],

           baseline_min: P.baseline, repeat: P.repeat, shuffle: !!P.shuffle,
           settle_s: 10, ...restJSON(), z: 4, confirm: P.confirm, redo: 2, again: P.again || 0, metrics: ["pr_s", "cand_s"], targets: "all",
           pause_repeat: !!P.pauseRepeat && P.repeat > 1, pause_lost: P.pauseLost !== false,
           axes: { order: R.order, title: Object.fromEntries(R.order.map(k => [k, AXES[k].title])), icon: Object.fromEntries(R.order.map(k => [k, AXES[k].icon])), values, names },
           steps: steps.map(s => ({ ...s, minutes: (s.sec || E.sec) / 60, quiet: P.quiet, agent: !!P.agentStep,
                                    groups: s.groups.map(g => ({ ...g, cfg: { ...g.cfg, ...(g.cfg.run === 0 ? {} : { tmax: P.tmax, ro: P.agentStep && P.radioOff ? 1 : 0 }) } })) })) };

// Запуск эксперимента: проверка, подтверждение, программа серверу; true — запущена

// ---------- ❗ тревога статики: звук, «❗» в шапке, строка в подвале; окно с причиной — только по нажатию ----------
// Важное — вывод «⚠ проверить» (verdict "check"): отклонение от эталона держится несколько окон подряд без
// известной причины — то, что ищем. Источники: живой вывод (идущий шаг или последние 2 минуты) при переходе в
// «check» и итог шага программы на сервере (program.alerts растёт) — даже если планшетка была закрыта на шаге.
// Помеха (↻ толчок, сдвиг, сбой прибора) тревогой не считается: такой шаг программа и так повторяет сама.
const ALARM = { list: [], sel: 0, fresh: false, lastV: null, lastProg: null, lastAlerts: 0, first: true, tLive: 0 };
// Причины тревоги: сначала отклонения (линия, полоса, форма шума), помеха того же отрезка — после, с пометкой
const NOISE_R = /^(толчок|выбросы|сдвиг|квантование|пропуск|зашкал)/;
function alarmReasons(d, sv) {
  const all = Object.entries((sv && sv.sensors) || {}).flatMap(([m, p]) => (p.reasons || []).map(r => ({ who: nameOf(d, m), r })));
  return all.filter(x => !NOISE_R.test(x.r)).slice(0, 4).concat(all.filter(x => NOISE_R.test(x.r)).slice(0, 2).map(x => ({ ...x, r: "в том же отрезке помеха: " + x.r })));
}
function alarmCheck(d) {
  const sv = d.static_verdict || {}, v = sv.verdict, p = d.program, running = p && p.state === "running", now = Date.now() / 1000;
  if (ALARM.first) {                                    // открыли страницу: что было — запомнить без звона
    ALARM.first = false; ALARM.lastV = v; ALARM.lastProg = p && p.id; ALARM.lastAlerts = p ? p.alerts || 0 : 0;
    return;
  }
  // живой вывод перешёл в «проверить»; без программы окно скользящее — не чаще раза в минуту. В начале шага окно
  // одно, и вывод «проверить» даётся по одному окну — тревога только когда у датчика окон уже не меньше двух
  // held — отклонение держится не меньше 2 окон подряд; толчок в том же отрезке даёт вывод «повторить», но тревогу не гасит
  const held = Object.values(sv.sensors || {}).some(x => (x.held || 0) > 0 || (x.verdict === "check" && (x.windows || 0) >= 2));
  if (held && ALARM.lastV !== "check" && (running || now - ALARM.tLive > 60)) {
    ALARM.tLive = now;
    alarmRaise({ src: "live", t: now, what: sv.what || "", reasons: alarmReasons(d, sv), notes: sv.notes || [],
                 n: running && p.now ? p.now.n : null, step: running && p.now ? p.now.name : null, prog: running ? p.id : null });
  }
  ALARM.lastV = held ? "check" : v === "check" ? ALARM.lastV : v;   // «проверить» по одному окну — не перевзводить
  if (p) {
    if (p.id !== ALARM.lastProg) { ALARM.lastProg = p.id; ALARM.lastAlerts = 0; }
    if ((p.alerts || 0) > ALARM.lastAlerts && p.last_alert) {
      const a = p.last_alert;
      const dup = ALARM.list.find(x => x.prog === p.id && x.n === a.n);   // этот шаг уже звенел вживую — дописать итог
      if (dup) { dup.final = a; dup.auto = a.auto; dup.spoiled = a.spoiled; if (dlg && dlg.kind === "alarm") renderDlg(); }
      else alarmRaise({ src: "step", t: a.t, what: `итог шага ${a.n}`, reasons: (a.reasons || []).map(r => ({ who: "", r })), notes: [],

}

}

      ${row(sv(60, 30, `<path d="M 4 24 C 20 2, 40 2, 56 24" fill="none" style="stroke:var(--w-abs)" stroke-width="3" stroke-dasharray="0.01 6" stroke-linecap="round"/>`), "<b>▶→▼</b> простые генераторов → поглотителям другого колеса (сверху); <b>↺</b> обратный шум — кадры поглотителей в шум генераторов (снизу)")}
      ${row(sv(60, 30, `<circle cx="30" cy="15" r="11" style="fill:var(--card);stroke:var(--w-gen)" stroke-width="2.5"/><circle cx="30" cy="15" r="14" fill="none" style="stroke:var(--w-gen)" stroke-width="2"/>`), "вспышка и «+N» — найдены простые за 2 с; «▼+N» — поглотитель принял; дуга вокруг агента — температура от 40 °C до предела")}
      </div><div style="margin-top:6px"><b>∿ источники шума</b> — дорожки внутри обода к агенту, толщина — доля бит: ${lanes}</div>
      <div class="small mut" style="margin-top:4px">${ICONS.gen} считает · ${ICONS.abs} поглощает · ${ICONS.idle} не считает / отдых · ${ICONS.meas} меряет · ${ICONS.quiet} молчит · ${ICONS.radio} без радио · ${ICONS.done} сдал итоги · ${ICONS.hot} перегрев · ${ICONS.off} нет связи · А/М — акселерометр/магнитометр. Точки показывают темп, а не отдельные кадры.</div>` };
  },
};
// ---------- сообщения: всплывают над схемой и тают ----------
function renderFoot() {
  const items = notes.filter(n => Date.now() - n.t < 12000).slice(0, 4).map(n => `<div class="toast glass float"><span class="${n.cls || ""}">${esc(n.text)}</span></div>`);
  setHTML($("foot"), items.join(""));
}
menuBuild(); menuView(); viewApply(); $("conn").dataset.pop = "conn";
new ResizeObserver(() => hudFit()).observe($("pic"));
matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", viewApply);
{ const ck = clockText(); $("clock").textContent = ck.hm; $("day").textContent = ck.day; }
dockApply();
poll(refresh, 2000);
setInterval(() => { if (D && ((prog && prog.state === "running") || (diag && diag.state === "running") || D.static_rec)) { renderCard(D); renderInfo(D); renderRibbon(D); renderTop(D); renderStatic(D); renderFoot(); hpSoon(); if (dlg && dlg.kind === "diag") renderDlg(); } }, 1000);   // таймеры — каждую секунду
</script>
