<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо-2 · планшетка</title>
<link rel="stylesheet" href="/ui.css">
<style>
/* Планшетка (docs/how_it_works.md § 12): одно главное окно на весь экран, без прокрутки —
   колесо 1 · установка · колесо 2, внизу лента шагов. Всё, что настраивается подробно (состав и
   подгруппы, агент, шаги, опыт, диагностика, прошивка, откуда шумы), — во всплывающих окнах;
   отчёт — отдельным окном (/report). Опыт задаётся слоями: роль колеса, способ, шум, поле, шаг.
   Цвет никогда не единственный признак: у каждого состояния значок и слово (Okabe-Ito в ui.css). */
.plan { grid-template-rows:auto minmax(0, 1fr) auto auto; }
.topbar { padding:6px 10px; }
.topbar .row { gap:6px; }
.topbar .btn { padding:.3em .75em; }
.cols3 { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap:8px; min-height:0; }
.wbody { display:flex; flex-direction:column; gap:6px; overflow:auto; }
.grp { padding:5px 7px; gap:3px; }
.grp .chips { grid-template-columns:repeat(auto-fill, minmax(66px, 1fr)); gap:4px; }
/* фишка агента в три строки: значок + номер, слово состояния, скорость или температура (без связи — давность) */
.chip { padding:2px 3px 3px; }
.chip .h { display:flex; align-items:center; justify-content:center; gap:3px; }
.chip .q { position:static; font-size:.95em; }
.chip .n { font-size:1.08em; }
.chip .w { font-size:.76em; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip .r { font-size:.82em; }
.chip.off { opacity:1; border:1px dashed var(--bad); background:var(--idle-bg); }   /* без связи — читаемо, а не бледно */
.chip.off .q { color:var(--bad); }
.chip .t { height:4px; }
.chip .t i.hot { background:repeating-linear-gradient(90deg, var(--warn) 0 3px, transparent 3px 5px); }
.sub { text-transform:uppercase; letter-spacing:.05em; font-size:.74em; color:var(--mut); margin:2px 0 -2px; }
.stat { border:1px solid var(--line); border-radius:9px; padding:6px 10px; display:flex; flex-direction:column; gap:3px; }
.stat .tm2 { font-size:1.3em; font-weight:700; line-height:1.15; }
.stat .ask { background:var(--on-bg); border-radius:7px; padding:3px 8px; }
.btn.halt { background:var(--bad); border-color:var(--bad); color:#fff; }
.btn.halt:hover { filter:brightness(1.1); }
.plate { border:1px solid var(--on); background:var(--on-bg); border-radius:8px; padding:4px 8px; }
.layers { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:5px 8px; align-items:start; }
.lh { color:var(--mut); font-size:.82em; padding-top:3px; white-space:nowrap; }
.opts { display:flex; flex-wrap:wrap; gap:3px; }
.opt { border:1px solid var(--line); border-radius:6px; padding:1px 7px; cursor:pointer; user-select:none; font-size:.86em; background:var(--card); }
.opt.on { border-color:var(--on); background:var(--on-bg); font-weight:600; }
.opt.on::before { content:"✓ "; }
.opt.dis { opacity:.5; cursor:not-allowed; text-decoration:line-through; }
.dim { opacity:.45; }
.mid { gap:6px; }
.pic { flex:1 1 auto; min-height:140px; }
.pic svg { width:100%; height:100%; display:block; }
.pic svg [data-act] { cursor:pointer; }
.now { border:1px solid var(--line); border-radius:9px; padding:6px 10px; }
.now .tm { font-size:2em; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
.now .kv { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:.92em; }
.now .kv b { font-variant-numeric:tabular-nums; font-weight:600; }
.setline { font-size:.9em; }
.ribbon { max-height:24vh; }
.steps { display:flex; gap:4px; overflow-x:auto; padding:2px 0 4px; }
.step { min-width:118px; max-width:170px; border:1px solid var(--line); border-radius:8px; padding:3px 6px; font-size:.8em; flex:0 0 auto; background:var(--card); cursor:pointer; }
.step.ctl { background:repeating-linear-gradient(135deg, transparent 0 6px, rgba(128,128,128,.12) 6px 12px); }
.step.cur { border:2px solid var(--on); }
.step.spoiled { border-style:dashed; }
.step.plan { border-style:dotted; }
.step .n { font-weight:700; }
.step .bar { height:4px; margin-top:3px; }
.step .bar i { height:4px; }
.foot { display:flex; gap:14px; flex-wrap:wrap; font-size:.86em; padding:0 4px; align-items:center; }
.dlg-h { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:1.05em; }
.kv2 { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:center; }
.kv2 > span:nth-child(odd) { color:var(--mut); }
.btn.sm { padding:.12em .55em; font-size:.88em; }
.btn.tiny { padding:0 .4em; font-size:.82em; border-radius:6px; }
label.inl { display:inline-flex; align-items:center; gap:4px; margin:2px 10px 2px 0; }
[hidden] { display:none !important; }          /* поля отдыха в окне «опыт» прятались атрибутом hidden, а display:inline-flex его перебивал */
.dlgmsg:empty { display:none; }
.dlgmsg { margin:0 0 8px; padding:4px 8px; border-radius:7px; background:var(--on-bg); }
.seg button.sel::before { content:"✓ "; }       /* выбранное в сегменте — не только заливкой */
.fs { border:1px solid var(--line); border-radius:9px; padding:6px 10px; margin:0 0 8px; }
.fs legend { color:var(--mut); font-size:.85em; padding:0 4px; }
@media (max-width: 900px) {
  .cols3 { display:flex; flex-direction:column; }
  .pic { height:300px; flex:none; }
  .ribbon { max-height:none; }
}
</style>
</head>
<body>
<div class="screen plan">
  <header class="panel topbar"><div class="row">
    <b>Колесо-2</b><span id="nav"></span>
    <span class="sp"></span>
    <span id="alarm"></span>
    <button class="btn sm" id="bSound" data-act="sound" title="Звук тревоги статики: вкл / выкл (нажатие — проба звука)">🔔 звук</button>
    <button type="button" class="tip" data-tip="alarm" aria-label="что такое тревога статики">ⓘ</button>
  </div><div class="row">
    <span id="conn" class="small"></span>
    <span id="exp" class="small"></span>
    <span class="sp"></span>
    <button class="btn" id="bIdent" data-act="identmode" title="Режим «найти плату»: нажмите на агента — его светодиод замигает 20 с">◉ найти плату</button>
    <button class="btn" data-act="exper" title="Длительность шага, температура, отдых, повторы, контроль, повтор при отклонении">опыт…</button>
    <button class="btn" data-act="motor" title="Моторы колёс: стоит / ШИМ / обороты, направление, смена направления по таймеру">⟳ вращение…</button>
    <button class="btn" data-act="diag" title="Проверить установку: связь, слышимость, скорость, температура, память, датчики">диагностика…</button>
    <button class="btn" data-act="fw" title="Прошивка агентов: по Wi-Fi и новых плат по USB">прошивка…</button>
    <button type="button" class="tip" data-tip="run" aria-label="что делают кнопки запуска">ⓘ</button>
    <button class="btn big go" id="bRun" title="Запустить последовательность шагов (лента внизу)">▶ Запустить</button>
    <button class="btn big stop" id="bStop" title="Остановить программу после текущего шага (агенты доработают шаг)">⏹ Стоп после шага</button>
    <button class="btn big halt" id="bHalt" title="Всё стоп сразу: программа, счёт у всех агентов, моторы, катушки выкл">■ Всё стоп</button>
  </div></header>
  <main class="cols3">
    <section class="panel" id="w1"></section>
    <section class="panel mid" id="mid">
      <div class="pic" id="pic"></div>
      <div id="stat"></div>
      <div id="now"></div>
      <div class="row small"><span class="lh">4 · поле катушек (колесо 1, колесо 2) <button type="button" class="tip" data-tip="field" aria-label="что такое поле катушек">ⓘ</button></span><span id="fields"></span></div>
      <div class="row setline" id="setline"></div>
    </section>
    <section class="panel" id="w2"></section>
  </main>
  <section class="panel ribbon" id="ribbon"></section>
  <footer class="foot" id="foot"><span class="mut">…</span></footer>
</div>

<script src="/ui.js"></script>
<script src="/nav.js"></script>
<script>
"use strict";
// ---------- пояснения ⓘ: что это и зачем — по нажатию (на планшете подсказки title не видны) ----------
const TIPS = {
  nowplan: ["Сейчас и план", "«Сейчас» — что агенты колеса делают в эту секунду (по их телеметрии). «План опыта» — слои, отмеченные на планшетке: из них собираются шаги программы. Отмеченное в плане само ничего не запускает — только «▶ Запустить» или шаг программы."],
  chips: ["Фишка агента", "Строка 1 — значок состояния и номер платы, буквы А / М — акселерометр / магнитометр на плате. Строка 2 — что делает словом. Строка 3 — простых в секунду, пока считает; иначе температура («!» — у предела); у платы без связи — сколько молчит. Полоска внизу — температура до предела (штриховка — у предела). Нажатие — окно агента."],
  group: ["Подгруппа", "Сколько агентов в каком состоянии (▶ считают, ▼ поглощают, ⏸ стоят или отдыхают, ✗ нет связи) и что группа делает сообща: способ, простых в секунду, «круги из всех» — доля чисел, собранных из кусочков шума всех участников (остальное заменено своим шумом: кто-то не успел за срок ожидания)."],
  roles: ["1 · роль колеса", "Генерация — агенты ищут простые из шума. Поглощение — получают простые другого колеса и выпускают в эфир, смешав со своим шумом (рассеяние). Стоит — ничего не считают, остывают. Можно отметить несколько — матрица переберёт все сочетания."],
  ways: ["2 · способ генерации", "Эгоистичный — каждый агент сам набирает шум, складывает число и проверяет. Групповой (каскад) — числа складываются из кусочков шума всех агентов подгруппы, проверяют все сразу; это и есть «сообща». Срок ожидания кусочков — в «опыт…»."],
  abs: ["2 · способ поглощения", "Все со всеми — каждый поглотитель получает все простые своей группы генераторов. «Один к одному» появится с прошивкой."],
  field: ["4 · поле катушек", "Знаки — направление тока в катушке колеса 1 и колеса 2. Поле включают агенты катушек (⚙ в карточке колеса) в начале каждого шага; на отдыхе, в конце программы и по «Всё стоп» — выкл."],
  step: ["5 · шаг", "Сколько длится шаг, до какой температуры греться (регулятор держит на градус ниже), отдых перед шагом, повторы, порядок, контрольный шаг «все стоят» и что делать при отклонении статики. Изменить — «изменить…»."],
  static: ["Статика — главный измеритель", "Неподвижные акселерометры (№8 ADXL355, телефон) меряют вибрации и поле стола. Сервер сравнивает каждое окно 10 с с эталоном шума, записанным, пока все стоят. Вывод: ✓ как эталон — продолжать; ⚠ отклонение — проверить (держится без известной причины — то, что мы ищем); ↻ помеха или прибор — повторить (толчок, сдвиг, сбой — шаг испорчен, программа повторит сама); ◌ нет эталона; ○ нет данных."],
  base: ["Эталон шума", "Запись спокойного фона статических датчиков, пока генераторы стоят: с ним сравнивается каждый шаг. «✓ годен» — шум ровный и гауссов; «✗ не чистый» — во время записи кто-то считал; «⇄ для другого режима» — датчик переключили на другой диапазон или частоту. Переписывать, если сдвинули датчик или изменилась обстановка."],
  alarm: ["Тревога статики", "Когда статика показывает «⚠ отклонение — проверить» (отклонение от эталона держится несколько окон и не объясняется сетью, пингом, оборотами), планшетка звенит, в шапке загорается «❗», открывается окно: что за отклонение, на каком шаге, и кнопка «повторить этот шаг ещё раз» — те же настройки сразу после текущего, чтобы не пропустить эффект. В «опыт…» можно велеть повторять такой шаг автоматически (до 3 раз). Толчок в том же отрезке тревогу не гасит: отклонение, державшееся 2 окна подряд, звенит всё равно. Звук — кнопка «🔔»: браузер разрешает звук после первого нажатия на страницу."],
  run: ["Запуск и остановка", "«▶ Запустить» — лента шагов (план внизу) уходит серверу как программа; на кнопке — сколько шагов и примерно сколько времени. «⏹ Стоп после шага» — программа доработает текущий шаг и остановится. «■ Всё стоп» — сразу: программа, счёт у всех агентов, моторы, катушки."],
  spin: ["Вращение и невесомость", "По датчику на ободе: обороты сейчас и сколько нужно, чтобы наверху колеса была невесомость (k = ω²r/g = 1). Недобор — крутится медленнее, перебор — быстрее. Моторы — «⟳ вращение…»."],
  ribbon: ["Лента шагов", "«План» — что уйдёт по «Запустить»; «программа» — идущая или последняя: у каждого шага простые, темп и вывод статики словом. Штриховка — контрольный шаг; синяя рамка — идёт сейчас; пунктир — испорчен (повторится); ❗ — отклонение статики; «повтор» — шаг повторён после отклонения или по просьбе."],
};
const tipBtn = (k, what) => `<button type="button" class="tip" data-tip="${k}" aria-label="что это: ${esc(what || "")}">ⓘ</button>`;
// ---------- слои ----------
const ROLES_W = [["gen", "генерация"], ["abs", "поглощение"], ["idle", "стоит"]];
const WAYS_GEN = [["solo", "эгоистичный", "каждый из своего шума — своё простое"],
                  ["cascade", "групповой", "шум от всех в подгруппе, свои числа из общего шума (каскад)"],
                  ["same", "групповой · одинаковые числа", "все считают одно число — появится с прошивкой", true]];
const WAYS_ABS = [["all", "все со всеми", "каждый поглотитель получает все простые своей группы"],
                  ["pair", "один к одному", "агент i поглощает простые агента i — появится с прошивкой", true]];
// Шумы: [ключ, название, откуда берётся, ещё нельзя (зачёркнут), настройка агента]
const NOISES = [
  ["rng", "ГСЧ чипа", "Аппаратный генератор ESP32-S3 (esp_random). При включённом радио в него подмешивается шум приёмника Wi-Fi. ~44 800 слов/с. Без радио слабее.", false, { src: 1 }],
  ["all", "все доступные", "ГСЧ + CSI с пульса + АЦП + дрожание RC сразу, через хеш SHA-256: число случайно, даже если хорош только один из них.", false, { src: 15, ping: 0, hb: 10 }],
  ["csi", "CSI с пульса", "«Отпечаток» радиоканала: амплитуды и фазы 64 поднесущих в каждом принятом кадре. Меняются от отражений, движения, вращения, поля. Кадры — пульс соседних агентов (ESP-NOW, 10 в секунду от каждого), роутер не нужен.", false, { src: 2, ping: 0, hb: 10 }],
  ["csiping", "CSI с пинга роутера", "Тот же CSI, но кадры — ответы роутера на пинг 20 раз в секунду. На старом роутере пинг вызывал «зомби» (07.10) — до нового роутера осторожно.", false, { src: 2, ping: 20, hb: 1 }],
  ["csiair", "CSI со всего эфира", "CSI с любых чужих кадров вокруг (телефоны, соседские сети) — режим прослушки. Появится с прошивкой.", true, null],
  ["adc", "АЦП D0", "Ножка D0 висит в воздухе, подтянута к середине питания. АЦП ловит наводки (сеть 50 Гц, радио, провода рядом) и шум резисторов. ~21 000 отсчётов/с, засчитываем 1/4 бита на отсчёт. К D0 ничего не подключать.", false, { src: 4 }],
  ["jit", "дрожание RC", "Внутренняя частота: RC-генератор 136 кГц против кварца 40 МГц — сколько тактов кварца уложилось в 8 периодов RC. Разброс — тепловой шум RC-цепи; частота сильно зависит от температуры. ~16 000 отсчётов/с, 1/4 бита на отсчёт.", false, { src: 8 }],
  ["bc", "обратный шум (подмешать)", "ГСЧ + содержимое кадров, которые выпустили поглотители (их шум, смешанный с нашими простыми). Только в шаге, где другое колесо поглощает.", false, { src: 17 }],
  ["bconly", "обратный шум (только он)", "Число только из кадров поглотителей — петля через эфир. Только в шаге с поглощением.", false, { src: 16 }],
  ["acc", "акселерометр (только он)", "ICM-42688-P на ободе: младшие байты осей ускорения и гироскопа — собственный шум датчика, вибрации, вращение. 200 отсчётов/с, 1 бит на байт — медленно: число ждёт, пока наберётся шум. У агента без датчика — вместо него ГСЧ. Подмешать к другим шумам — галочка «+ акселерометр» ниже.", false, { src: 32 }],
  ["mag", "магнитометр (только он)", "MLX90393: младшие байты осей поля — шум датчика, поле катушки, поле Земли, наводки. 20 замеров/с — очень медленно. У агента без датчика — вместо него ГСЧ. Подмешать к другим шумам — галочка «+ магнитометр» ниже.", false, { src: 64 }],
  ["tmp", "температура кристалла", "Проверена 03.10 и отвергнута: датчик даёт шаг 1 °C и меняется раз в несколько секунд (за 4096 чтений — 2 значения), шума в нём нет. Тепловой шум уже входит в дрожание RC и АЦП; сама температура записывается в каждый шаг.", true, null]];
// Датчики на ободе — добавкой к любому выбранному шуму (в том числе к «все доступные»): накопленное подмешивается
// в каждый блок, счёт не медленнее; у агентов без датчика добавка пустая
const SENS_ADD = [["acc", "+ акселерометр", "Младшие байты осей ICM-42688 (обод) подмешиваются в шум — у агентов с этим датчиком.", false],
                  ["mag", "+ магнитометр", "Младшие байты осей MLX90393 подмешиваются в шум — у агентов с этим датчиком.", false]];
const sensBits = w => ((P["w" + w].sens || []).includes("acc") ? 32 : 0) | ((P["w" + w].sens || []).includes("mag") ? 64 : 0);
const sensWord = w => [(P["w" + w].sens || []).includes("acc") ? "+ акселерометр" : "", (P["w" + w].sens || []).includes("mag") ? "+ магнитометр" : ""].filter(Boolean).join(" ");
const FIELDS = [["off", "выкл"], ["pp", "+ +"], ["pm", "+ −"], ["mp", "− +"], ["mm", "− −"]];

// ---------- «сейчас»: таймер шага и живые итоги ----------

function primesInRun(r) { const g = (r.gen || {})["все"] || {}; return r.t1 && r.t0 && g.pr_s != null ? Math.round(g.pr_s * (r.t1 - r.t0)) : 0; }

function restWord() { return ({ none: "без отдыха", fixed: `отдых ${P.restMin} мин`, stable: "отдых до стабилизации", below: `отдых до ${P.restBelow} °C` })[P.restMode] || ""; }

// ---------- матрица → шаги ----------
function* product(lists) {
  if (!lists.length) { yield []; return; }
  for (const x of lists[0]) for (const rest of product(lists.slice(1))) yield [x, ...rest];
}
function noiseCfg(k) { const n = NOISES.find(x => x[0] === k); return n && n[4] ? { ...n[4] } : { src: 1 }; }
const avail = (list, sel) => sel.filter(k => { const it = list.find(x => x[0] === k); return it && !it[3] && (list !== NOISES || it[4]); });
// Группы шага: генераторы — каждая подгруппа колеса своей группой (или оба колеса одной, если «одна группа»);
// поглотители другого колеса — к группе с той же буквой, иначе по кругу между группами генераторов
function makeStep(d, r1, r2, w1, w2, n1, n2, f) {
  const G1 = wheelGroups(d, "1"), G2 = wheelGroups(d, "2");
  const nz = (n, w) => n ? [noiseName(n), sensWord(w)].filter(Boolean).join(" ") : "";
  const layers = { w1: { role: r1, way: w1 || "", noise: nz(n1, 1) }, w2: { role: r2, way: w2 || "", noise: nz(n2, 2) },
                   field: { "1": f === "off" ? "выкл" : f[0] === "p" ? "+" : "−", "2": f === "off" ? "выкл" : f[1] === "p" ? "+" : "−" } };
  const genGroup = (macs, way, noise, label, sb) => {
    const own = {};
    macs.forEach(m => own[m] = { role: 0 });
    const nc = noiseCfg(noise);
    nc.src = (nc.src || 1) | (sb || 0);                // датчики на ободе — добавкой
    return { targets: macs.slice(), cfg: { ...GEN_CFG[way], ...nc, pl: 1, tmax: P.tmax }, own, label };
  };
  const attachAbs = (GG, Gabs, absWay) => {
    const byLetter = Object.fromEntries(GG.map(g => [g.letter, g]));
    Gabs.forEach((s, j) => {
      const tgt = (GG.length > 1 && byLetter[s.letter]) || GG[j % GG.length];
      s.macs.forEach(m => { tgt.targets.push(m); tgt.own[m] = { role: 1 }; });
      Object.assign(tgt.cfg, ABS_CFG[absWay || "all"]);
    });
  };
  const genWheel = (w, G, way, noise) => G.map(g => ({ ...genGroup(g.macs, way, noise, `колесо ${w}${G.length > 1 ? " · группа " + g.letter : ""} · генерация`, sensBits(w)), letter: g.letter }));
  let groups = [];
  if (r1 === "gen" && r2 === "gen") {
    if (P.merge) groups = [genGroup(G1.concat(G2).flatMap(g => g.macs), w1, n1, "колёса 1+2 · генерация", sensBits(1) | sensBits(2))];
    else groups = genWheel(1, G1, w1, n1).concat(genWheel(2, G2, w2, n2));
  } else if (r1 === "gen") {
    groups = genWheel(1, G1, w1, n1);
    if (r2 === "abs") { attachAbs(groups, G2, w2); groups.forEach(g => g.label += ", колесо 2 поглощает"); }
  } else if (r2 === "gen") {
    groups = genWheel(2, G2, w2, n2);
    if (r1 === "abs") { attachAbs(groups, G1, w1); groups.forEach(g => g.label += ", колесо 1 поглощает"); }
  }
  groups = groups.filter(g => g.targets.length).map(g => ({ targets: g.targets, cfg: g.cfg, own: g.own, label: g.label }));
  // имя шага — по-русски, как на планшетке (латинские ключи остаются в layers/cfg): «К1 ▶ ген. каскад · ГСЧ чипа ×2 гр | К2 ▼ погл. все со всеми | поле + −»
  const gr = (r, G) => r === "gen" && G.length > 1 && !(P.merge && r1 === "gen" && r2 === "gen") ? ` ×${G.length} гр` : "";
  const sx = (n, w) => n && sensBits(w) ? " " + [(sensBits(w) & 32) ? "+акс" : "", (sensBits(w) & 64) ? "+магн" : ""].filter(Boolean).join(" ") : "";
  const half = (r, w, n, G, k) => `К${k} ${ROLE_SHORT[r]}${w ? " " + WAY_SHORT[w] : ""}${n ? " · " + noiseName(n) + sx(n, k) : ""}${gr(r, G)}`;
  const name = `${half(r1, w1, n1, G1, 1)} | ${half(r2, w2, n2, G2, 2)} | поле ${fieldName(f)}`;
  return { name, minutes: P.minutes, quiet: P.quiet, control: false, groups, layers, coil: layers.field };
}
function idleStep(d) {
  const m = wheelMacs(d, "1").concat(wheelMacs(d, "2"));
  return { name: "все стоят (контроль статики)", minutes: P.minutes, quiet: P.quiet, control: true,
           groups: [{ targets: m, cfg: { mode: 0, dc: 0, run: 0 }, own: {}, label: "все стоят" }],
           layers: { w1: { role: "idle", way: "", noise: "" }, w2: { role: "idle", way: "", noise: "" }, field: { "1": "выкл", "2": "выкл" } }, coil: { "1": "выкл", "2": "выкл" } };
}
function combos(d, first) {
  const roles1 = wheelMacs(d, "1").length ? P.w1.roles : ["idle"], roles2 = wheelMacs(d, "2").length ? P.w2.roles : ["idle"];
  const out = [], seen = new Set();
  const pick = l => first ? l.slice(0, 1) : l;
  for (const [r1, r2, f] of product([pick(roles1), pick(roles2), pick(P.fields.length ? P.fields : ["off"])])) {
    if (r1 === "idle" && r2 === "idle") continue;
    if ((r1 === "abs" && r2 !== "gen") || (r2 === "abs" && r1 !== "gen")) continue;   // поглощать нечего
    const ways1 = r1 === "gen" ? avail(WAYS_GEN, P.w1.ways) : r1 === "abs" ? avail(WAYS_ABS, P.w1.abs) : [""];
    const ways2 = r2 === "gen" ? avail(WAYS_GEN, P.w2.ways) : r2 === "abs" ? avail(WAYS_ABS, P.w2.abs) : [""];
    const noise1 = r1 === "gen" ? avail(NOISES, P.w1.noise) : [""], noise2 = r2 === "gen" ? avail(NOISES, P.w2.noise) : [""];
    for (const [w1, w2, n1, n2] of product([pick(ways1), pick(ways2), pick(noise1), pick(noise2)])) {
      if (!(r1 === "abs" || r2 === "abs") && ((n1 || "").startsWith("bc") || (n2 || "").startsWith("bc"))) continue;   // обратный шум — только с поглотителем
      if ((r1 === "gen" && (!w1 || !n1)) || (r2 === "gen" && (!w2 || !n2))) continue;
      const st = makeStep(d, r1, r2, w1, w2, n1, n2, f);
      if (!st.groups.length || seen.has(st.name)) continue;
      seen.add(st.name);
      out.push(st);
    }
  }

}
function markControls(steps) {
  const fieldVaries = new Set(steps.map(s => s.coil ? s.coil["1"] + s.coil["2"] : "")).size > 1;
  if (fieldVaries) for (const s of steps) if (s.coil && s.coil["1"] === "выкл" && s.coil["2"] === "выкл" && s.groups.length && !s.name.startsWith("все стоят")) s.control = true;

}
// Проверка групп шага: не больше MAX_GROUP в сете (предел прошивки), не больше 20 собеседников у агента (ESP-NOW)
function checkSteps(steps) {
  for (const s of steps) for (const g of s.groups) {
    if (g.targets.length > 20) return `«${g.label}»: ${g.targets.length} агентов — предел ESP-NOW 20 собеседников`;
    const gens = g.targets.filter(m => !(g.own[m] || {}).role).length, abs = g.targets.length - gens;
    if (gens > MAX_GROUP || abs > MAX_GROUP) return `«${g.label}»: ${Math.max(gens, abs)} в сете — предел прошивки ${MAX_GROUP}`;
  }

}
function addCurrent() {
  if (!D) return;
  const st = combos(D, true)[0];
  if (!st) { note("✗ из текущих настроек шаг не собирается (поглощению нужна генерация на другом колесе)", "bad"); return; }
  const bad = checkSteps([st]); if (bad) { note("✗ " + bad, "bad"); return; }
  P.seq.push(st); save(); ribbonMode = "plan"; renderAll(); note(`✓ шаг ${P.seq.length}: ${st.name}`, "ok");
}
function addMatrix() {
  if (!D) return;
  const steps = combos(D, false); if (P.idleStep) steps.push(idleStep(D)); markControls(steps);
  const bad = checkSteps(steps); if (bad) { note("✗ " + bad, "bad"); return; }
  P.seq = P.seq.concat(steps); save(); ribbonMode = "plan"; renderAll(); note(`✓ добавлено ${steps.length} шагов`, "ok");
}
function restSeconds() { return P.restMode === "fixed" ? P.restMin * 60 : P.restMode === "none" ? 0 : Math.min(P.restMax * 60, 180); }
function seqEstimate() { return P.seq.length * P.repeat * (P.minutes * 60 + 10 + restSeconds()) + P.baseline * 60; }

// ---------- лента шагов ----------
// Слои шага в три строки: колесо 1, колесо 2 (роль, способ, свой шум у каждого), поле
function layText(L, coil) {

  return `${one(1, L.w1)}<br>${one(2, L.w2)}<br><span class="mut">поле ${coil ? esc(coil["1"] + " " + coil["2"]) : "—"}</span>`;
}
async function loadProg(d) {
  const p = d.program;
  const id = p && p.id ? p.id : (prog && prog.id) || null;
  if (!id) { if (!prog) { try { const l = await getJSON("/api/programs"); if (l.list && l.list[0]) prog = await getJSON(`/api/program?id=${l.list[0].id}`); } catch (e) { /* нет */ } } return; }

function renderRibbon(d) {
  const running = prog && prog.state === "running";

  const nm = combos(d, false).length + (P.idleStep ? 1 : 0);
  let head = `<h2>Лента шагов ${tipBtn("ribbon", "лента шагов")} <span class="seg"><button class="${mode === "plan" ? "sel" : ""}" data-act="rmode" data-m="plan">план (${P.seq.length})</button><button class="${mode === "prog" ? "sel" : ""}" data-act="rmode" data-m="prog">${prog ? `программа №${prog.id}` : "программа"}</button></span>`;
  let body = "";
  if (mode === "plan") {
    head += `<span class="small mut">${P.seq.length ? `${P.seq.length} × повторов ${P.repeat} ≈ ${fmtDur(seqEstimate())} · не запущен` : "пусто — добавьте шаги"}</span>`;
    body = P.seq.map((s, i) => `<div class="step plan ${s.control ? "ctl" : ""}" data-act="seq" title="${esc(s.name)}"><div class="n">${i + 1}${s.control ? " · контроль" : ""}</div><div>${layText(s.layers, s.coil) || esc(s.name)}</div><div class="mut">${plural(s.groups.length, "группа", "группы", "групп")} · ${fmt(P.minutes, 1)} мин</div></div>`).join("")
      || `<span class="mut small">Отметьте слои на колёсах и нажмите «＋ шаг» или «⇊ вся матрица»; порядок и контроль — в «шаги…».</span>`;
  } else if (!prog) {
    body = `<span class="mut small">программа не запускалась</span>`;
  } else {
    const steps = (prog.program || {}).steps || [], plan = prog.plan || [], runs = prog.runs || [], now = prog.now;
    head += `<span class="small mut">«${esc((prog.program || {}).name || "")}» · ${stateWord(prog.state)} · ${runs.length} из ${plan.length} шагов · простых ${fmt(runs.reduce((s, r) => s + primesInRun(r), 0))} · аномалий ${Object.keys(prog.anomalies || {}).length}</span>`;
    body = plan.map((it, i) => {
      const st = steps[it.step] || {}, r = runs[i], cur = running && now && now.n - 1 === i;
      let res;

        const g = (r.gen || {})["все"] || {}, sv = r.watch && STATIC_VERDICT[r.watch.verdict];
        const why = sv && sv.cls !== "ok" && sv.cls !== "mut" ? Object.values(r.watch.sensors || {}).flatMap(p => (p.reasons || []).slice(0, 1))[0] : "";
        res = `<div>${r.alert ? `<b class="bad" title="отклонение статики на этом шаге">❗</b> ` : ""}${r.spoiled ? `<span class="bad">✗ испорчен: ${esc(r.spoiled_why || "")}</span>` : `<b>${fmt(primesInRun(r))}</b> пр · ${fmt(g.pr_s, 1)}/с`}${prog.anomalies && prog.anomalies[String(i)] ? ` <span class="bad">аномалия</span>` : ""}</div>
          ${sv ? `<div class="${sv.cls}" title="${esc(sv.word)}${why ? ": " + esc(why) : ""}">${sv.icon} ${sv.short}${why ? ` <span class="mut">· ${reasonHTML(why).replace(/^(\S+) /, "")}</span>` : ""}</div>` : ""}`;

    }).join("");
  }
  head += `<span class="sp"></span><button class="btn sm" data-act="qadd" title="Один шаг из первых отмеченных вариантов на каждом колесе">＋ шаг</button>
    <button class="btn sm" data-act="qmatrix" title="Все сочетания отмеченных вариантов${P.idleStep ? " и контрольный шаг «все стоят»" : ""}">⇊ вся матрица (${nm})</button>
    <button class="btn sm" data-act="seq">шаги…</button></h2>`;
  const el = $("ribbon"), html = head + `<div class="steps">${body}</div>`;
  if (el._h !== html) { el._h = html; el.innerHTML = html; const c = el.querySelector(".step.cur"); if (c) c.scrollIntoView({ inline: "center", block: "nearest" }); }
}

    ${cols.map(c => `<tr><td><b>${c}</b></td><td class="num">${fx(r.cur[c], 2)}</td><td class="num">${fx(st[c] && st[c].mean, 2)}</td><td class="num"><b>${fx(st[c] && st[c].sd, 3)}</b></td>
      <td class="num">${fx(st[c] && st[c].min, 2)}</td><td class="num">${fx(st[c] && st[c].max, 2)}</td><td class="num">${fx(st[c] && st[c].p2p, 2)}</td>
      <td class="num">${fx(st[c] && st[c].skew, 2)}</td><td class="num">${fx(st[c] && st[c].kurt, 2)}</td><td>${gaussWord(st[c])}</td>
      ${sn ? `<td class="num">${fx(sn[c] && sn[c].mean, 2)}</td><td class="num">${fx(sn[c] && sn[c].sd, 3)}</td><td class="num">${fx(sn[c] && sn[c].p2p, 2)}</td>` : ""}</tr>`).join("")}</table></div>
    <div class="small mut">${mag ? "мкТл — микротесла; |B| — модуль поля (Земля даёт 25–65, у компьютера и железа больше)." : "мg — тысячные доли g; |a| — модуль (у неподвижного ≈ 1000)."} Эксцесс > 1 — «хвосты»: толчки и выбросы; < −1 — шум ступенчатый или ровный сигнал. ${sn ? `«С ⟲» — с момента сброса, ${fmt(r.since_n)} отсчётов.` : ""}</div>`;
  const w = r.wave;
  h += `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px">`;
  for (const c of cols) {
    const mean = st[c] ? st[c].mean : 0, sd = st[c] ? st[c].sd : 0;
    h += `<div>${chart([{ x: w.t, y: w[c].m.map(v => v - mean), lo: w[c].lo.map(v => v - mean), hi: w[c].hi.map(v => v - mean), col: LCOL[c][0], dash: LCOL[c][1] }],
      { title: `${c}: отклонение от среднего, ${U} — последние ${fmt(-w.t[0] || 0, 0)} с (полоса — размах)`, xlabel: "с", sym: true, hlines: [{ y: 3 * sd, label: "+3σ" }, { y: -3 * sd, label: "−3σ" }] })}</div>`;
  }
  for (const c of cols) {
    const hs = r.hist[c], e = hs.edges, ctr = e.slice(0, -1).map((v, i) => (v + e[i + 1]) / 2), tot = hs.n.reduce((a, b) => a + b, 0) || 1, bw = e[1] - e[0];
    const sd = st[c] ? st[c].sd : 1, gx = [], gy = [];
    for (let k = 0; k <= 80; k++) { const xv = e[0] + (e[e.length - 1] - e[0]) * k / 80; gx.push(xv); gy.push(tot * bw * Math.exp(-xv * xv / (2 * sd * sd)) / (sd * Math.sqrt(2 * Math.PI))); }
    h += `<div>${chart([{ x: ctr, y: hs.n, col: LCOL[c][0], bars: true }, { x: gx, y: gy, col: "var(--ink)", dash: "4 3", wd: 1 }],
      { title: `${c}: распределение отклонений и гаусс (пунктир), ${U}`, xlabel: U })}</div>`;
  }
  h += `</div>`;
  if (r.spec) {
    const f = r.spec.f;
    h += chart(cols.map(c => ({ x: f, y: r.spec[c], col: LCOL[c][0], dash: LCOL[c][1] })),
      mag ? { title: "Спектр, нТл/√Гц — x сплошная, y штрих, z точки, |B| штрих-точка" + (r.mavg > 1
          ? ` · датчик сам усредняет по ${r.mavg} замера: провал на ${fx(r.hz / r.mavg, 0)} Гц, горб около ${fx(r.hz * 0.37, 0)} Гц и спад к ${fx(r.hz / 2, 0)} Гц — его фильтр, не поле` : ""),
          logx: true, logy: true, xlabel: "Гц", w: 1040, h: 200 }
          : [16000, 8000, 4000].includes(Math.round(r.lsb))   // ADXL355: 20 разрядов, сдвинутые в int16
            ? { title: "Спектр шума, мкg/√Гц — x сплошная, y штрих, z точки, |a| штрих-точка; паспорт ADXL355: 25 (x, y, z)", logx: true, logy: true, xlabel: "Гц", w: 1040, h: 200, hlines: [{ y: 25, label: "25" }] }
            : { title: "Спектр шума, мкg/√Гц — x сплошная, y штрих, z точки, |a| штрих-точка; паспорт TDK: 65 (x, y), 70 (z)", logx: true, logy: true, xlabel: "Гц", w: 1040, h: 200, hlines: [{ y: 65, label: "65" }, { y: 70, label: "70" }] });
  }
  if (r.secs.t.length) {
    h += chart(["x", "y", "z"].map(ax => ({ x: r.secs.t, y: r.secs[ax], col: LCOL[ax][0], dash: LCOL[ax][1] })).concat([{ x: r.secs.t, y: r.secs.peak, col: "var(--bad)", dash: "1 3", wd: 1 }]),
      { title: `Колебания по секундам: разброс за каждую секунду, ${U} (x, y, z) и наибольший выброс (точки)`, xlabel: "с назад", w: 1040, h: 160 });
  }
  const ev = [];
  for (const k of r.knocks) ev.push(`<span class="warn">◐ толчок по ${k.ax}: в ${fx(k.x, 1)} раза сильнее обычного, ${fx(-k.t, 0)} с назад</span>`);
  for (const sp of r.spikes) ev.push(`<span class="warn">◐ сплошные выбросы: ${sp.n} секунд из ${sp.of}</span>`);
  for (const c of r.conds) ev.push(`<span class="${c.known ? "mut" : "warn"}">◐ сейчас: ${esc(c.text || c.kind)}</span>`);
  for (const c of r.done) ev.push(`<span class="mut">было: ${esc(c.text || c.kind)}</span>`);
  for (const j of r.jumps || []) ev.push(`<span class="warn">◐ ступенька поля: |B| ${j.db > 0 ? "+" : ""}${fx(j.db, 2)} мкТл (x ${fx(j.d[0], 2)}, y ${fx(j.d[1], 2)}, z ${fx(j.d[2], 2)}), ${fx(-j.t, 0)} с назад</span>`);
  h += mag ? `<div class="small" style="margin-top:6px"><b>Ступеньки поля</b> (средние соседних двухсекундных отрезков разошлись больше чем на 0,5 мкТл — катушка, железо рядом, поворот платы): ${ev.length ? ev.join(" · ") : `<span class="ok">✓ нет</span>`}</div>`
    : `<div class="small" style="margin-top:6px"><b>Толчки и отклонения</b> (против ${r.base ? "эталона" : "последних минут — эталона нет"}): ${ev.length ? ev.join(" · ") : `<span class="ok">✓ нет</span>`}</div>`;
  return h;
}

  catch (er) { note("✗ " + er.message, "bad"); }
}

}

function restJSON() {
  const r = { rest: P.restMode === "fixed" ? P.restMin * 60 : P.restMode === "none" ? 0 : P.restMode, rest_max_s: P.restMax * 60 };
  if (P.restMode === "below") r.rest_below = P.restBelow;
  return r;
}
function programJSON(steps) {
  return { name: `планшетка ${new Date().toLocaleString("ru-RU")}`, baseline_min: P.baseline, repeat: P.repeat, shuffle: P.shuffle,
           settle_s: 10, ...restJSON(), z: 4, confirm: P.confirm, redo: 2, again: P.again || 0, metrics: ["pr_s", "cand_s"], targets: "all",
           steps: steps.map(s => ({ ...s, minutes: P.minutes, quiet: P.quiet, agent: !!P.agentStep,
                                    groups: s.groups.map(g => ({ ...g, cfg: { ...g.cfg, ...(g.cfg.run === 0 ? {} : { tmax: P.tmax, ro: P.agentStep && P.radioOff ? 1 : 0 }) } })) })) };
}
$("bRun").onclick = async () => {
  if (!P.seq.length) { note("✗ план пуст — добавьте шаги (＋ шаг или ⇊ вся матрица)", "bad"); return; }
  if (P.confirm && !P.seq.some(s => s.control)) { note("✗ для проверочных пар нужен хотя бы один контрольный шаг", "bad"); return; }
  const bad = checkSteps(P.seq); if (bad) { note("✗ " + bad, "bad"); return; }
  const n = P.seq.length * P.repeat;
  if (!confirm(`Запустить ${P.seq.length} шагов × ${P.repeat} повторов (${n} шагов по ${P.minutes} мин)${P.shuffle ? ", случайный порядок" : ""}, греться до ${P.tmax} °C${P.agentStep ? ", шаг на агенте" : ""}${P.agentStep && P.radioOff ? ", Wi-Fi выкл где эфир не нужен" : ""}?`)) return;
  try { const r = await postJSON("/api/program/start", { program: programJSON(P.seq) }); note(`✓ программа №${r.id} запущена: ${n} шагов`, "ok"); progT = 0; ribbonMode = "auto"; await refresh(); }
  catch (er) { note("✗ " + er.message, "bad"); }
};
$("bStop").onclick = async () => { try { await postJSON("/api/program/stop", {}); note("✓ программа остановится после шага", "ok"); } catch (e) { note("✗ " + e.message, "bad"); } };

// ---------- ❗ тревога статики: звук, «❗» в шапке, окно с причиной и «повторить шаг ещё раз» ----------
// Важное — вывод «⚠ проверить» (verdict "check"): отклонение от эталона держится несколько окон подряд без
// известной причины — то, что ищем. Источники: живой вывод (идущий шаг или последние 2 минуты) при переходе в
// «check» и итог шага программы на сервере (program.alerts растёт) — даже если планшетка была закрыта на шаге.
// Помеха (↻ толчок, сдвиг, сбой прибора) тревогой не считается: такой шаг программа и так повторяет сама.
const ALARM = { list: [], fresh: false, lastV: null, lastProg: null, lastAlerts: 0, first: true, tLive: 0 };
// Причины тревоги: сначала отклонения (линия, полоса, форма шума), помеха того же отрезка — после, с пометкой
const NOISE_R = /^(толчок|выбросы|сдвиг|квантование|пропуск|зашкал)/;
function alarmReasons(d, sv) {
  const all = Object.entries((sv && sv.sensors) || {}).flatMap(([m, p]) => (p.reasons || []).map(r => ({ who: nameOf(d, m), r })));
  return all.filter(x => !NOISE_R.test(x.r)).slice(0, 4).concat(all.filter(x => NOISE_R.test(x.r)).slice(0, 2).map(x => ({ ...x, r: "в том же отрезке помеха: " + x.r })));
}
function alarmCheck(d) {
  const sv = d.static_verdict || {}, v = sv.verdict, p = d.program, running = p && p.state === "running", now = Date.now() / 1000;
  if (ALARM.first) {                                    // открыли страницу: что было — запомнить без звона
    ALARM.first = false; ALARM.lastV = v; ALARM.lastProg = p && p.id; ALARM.lastAlerts = p ? p.alerts || 0 : 0;
    return;
  }
  // живой вывод перешёл в «проверить»; без программы окно скользящее — не чаще раза в минуту. В начале шага окно
  // одно, и вывод «проверить» даётся по одному окну — тревога только когда у датчика окон уже не меньше двух
  // held — отклонение держится не меньше 2 окон подряд; толчок в том же отрезке даёт вывод «повторить», но тревогу не гасит
  const held = Object.values(sv.sensors || {}).some(x => (x.held || 0) > 0 || (x.verdict === "check" && (x.windows || 0) >= 2));
  if (held && ALARM.lastV !== "check" && (running || now - ALARM.tLive > 60)) {
    ALARM.tLive = now;
    alarmRaise({ src: "live", t: now, what: sv.what || "", reasons: alarmReasons(d, sv), notes: sv.notes || [],
                 n: running && p.now ? p.now.n : null, step: running && p.now ? p.now.name : null, prog: running ? p.id : null });
  }
  ALARM.lastV = held ? "check" : v === "check" ? ALARM.lastV : v;   // «проверить» по одному окну — не перевзводить
  if (p) {
    if (p.id !== ALARM.lastProg) { ALARM.lastProg = p.id; ALARM.lastAlerts = 0; }
    if ((p.alerts || 0) > ALARM.lastAlerts && p.last_alert) {
      const a = p.last_alert;
      const dup = ALARM.list.find(x => x.prog === p.id && x.n === a.n);   // этот шаг уже звенел вживую — дописать итог
      if (dup) { dup.final = a; dup.auto = a.auto; dup.spoiled = a.spoiled; if (dlg && dlg.kind === "alarm") renderDlg(); }
      else alarmRaise({ src: "step", t: a.t, what: `итог шага ${a.n}`, reasons: (a.reasons || []).map(r => ({ who: "", r })), notes: [],
                        n: a.n, step: a.name, prog: p.id, auto: a.auto, spoiled: a.spoiled });
      ALARM.lastAlerts = p.alerts;
    }
  }
}
function alarmRaise(a) {
  ALARM.list.unshift(a); ALARM.list.length = Math.min(ALARM.list.length, 20); ALARM.fresh = true;
  if (P.sound && !beep(3)) note("🔕 звук тревоги заблокирован браузером — нажмите на страницу один раз", "warn");
  note(`❗ отклонение статики${a.step ? ` на шаге ${a.n}` : ""}`, "bad");
  if (!dlg || (dlg.kind !== "exper" && dlg.kind !== "alarm")) openDlg("alarm"); else if (dlg.kind === "alarm") renderDlg();
  renderAlarmTop();
}
function renderAlarmTop() {
  const el = $("alarm"), a = ALARM.list[0];
  if (el) setHTML(el, a ? `<button class="alarm ${ALARM.fresh ? "fresh" : ""}" data-act="alarm" title="что за отклонение; повторить шаг">❗ отклонение статики · ${new Date(a.t * 1000).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}${ALARM.list.length > 1 ? ` · ×${ALARM.list.length}` : ""}</button>` : "");
  const b = $("bSound");
  if (b) b.textContent = P.sound ? (audioReady() ? "🔔 звук" : "🔔 звук · нажмите на страницу") : "🔕 без звука";
}
function alarmHTML(d) {
  const a = ALARM.list[0], p = d.program, running = p && p.state === "running";
  if (!a) return `<div class="mut">Отклонений не было.</div>`;
  const when = t => new Date(t * 1000).toLocaleTimeString("ru-RU");
  const rs = a.final && (a.final.reasons || []).length ? a.final.reasons.map(r => ({ who: "", r })) : a.reasons;
  let act;
  if (running) {
    const n = a.prog === p.id && a.n ? a.n : p.now && p.now.n;
    act = `<div class="row"><button class="btn big go" data-act="again" data-n="${n}">↻ повторить шаг ${n} ещё раз</button><span class="small mut">те же настройки — сразу после текущего шага${p.again_wait ? ` · в очереди повторов: ${p.again_wait}` : ""}</span></div>
      <div class="row small" style="margin-top:6px">повторять сам при каждом отклонении: <span class="seg">${[0, 1, 2, 3].map(k => `<button class="${(p.again || 0) === k ? "sel" : ""}" data-act="againauto" data-k="${k}">${k ? k + " раз" : "нет"}</button>`).join("")}</span><span class="mut">— программа №${p.id}</span></div>`;
  } else {
    const it = a.prog && prog && prog.id === a.prog && a.n ? (prog.plan || [])[a.n - 1] : null;
    const last = prog && (prog.runs || []).slice(-1)[0];
    const si = it ? it.step : last ? last.step : null, st = si != null && prog ? ((prog.program || {}).steps || [])[si] : null;
    act = st ? `<div class="row"><button class="btn big go" data-act="againlast" data-step="${si}">▶ повторить шаг «${esc(st.name)}» ещё раз</button><span class="small mut">программа не идёт — запустится одним шагом с теми же настройками</span></div>`
      : `<div class="small mut">Программа не идёт, повторять нечего: отклонение на живых данных (${esc(a.what)}). Посмотрите датчик вживую.</div>`;
  }
  const hist = ALARM.list.slice(1, 8).map(x => `<div class="small">❗ ${when(x.t)} · ${esc(x.step ? `шаг ${x.n} «${x.step}»` : x.what)}${x.auto ? " · повторён сам" : ""}</div>`).join("");
  const first = staticList(d)[0];
  return `<div class="kv2"><span>когда</span><b>${when(a.t)}</b><span>отрезок</span><b>${esc(a.what || "—")}</b>
      ${a.step ? `<span>шаг</span><b>${a.n} «${esc(a.step)}»${a.auto ? " · <span class='ok'>программа уже повторяет его сама</span>" : ""}${a.spoiled ? " · <span class='warn'>в шаге была и помеха — он повторится сам</span>" : ""}</b>` : ""}
      <span>причина</span><div>${rs.length ? rs.map(x => `<div>${x.who ? `<b>${esc(x.who)}</b>: ` : ""}${reasonHTML(x.r)}</div>`).join("") : "<span class='mut'>—</span>"}${(a.notes || []).map(n => `<div class="warn">◐ ${esc(n)}</div>`).join("")}</div></div>
    <div style="margin:10px 0">${act}</div>
    <div class="row">${first ? `<button class="btn" data-act="live" data-mac="${first.mac}">∿ датчик вживую</button>` : ""}<a class="btn" href="/acc" target="acc">◆ статика подробно</a><span class="sp"></span>
      <button class="btn" data-act="alarmack" title="закрыть окно; «❗» в шапке остаётся, но не мигает">✓ понятно</button><button class="btn" data-act="alarmclear" title="убрать «❗» из шапки и забыть список">убрать «❗»</button></div>
    ${hist ? `<div style="margin-top:8px"><div class="small mut">раньше:</div>${hist}</div>` : ""}
    <div class="small mut" style="margin-top:8px">Отклонение — отличие от эталона держится несколько окон подряд и не объясняется известными линиями (сеть 50 Гц, пинг, обороты колеса). Повтор того же шага проверяет, держится ли эффект. Помеха (↻ толчок, сдвиг, сбой прибора) сама по себе тревогой не считается — такой шаг повторяется и так; но толчок не прячет отклонение, державшееся 2 окна подряд.</div>`;
}

// ---------- сообщения, верх, опрос ----------
const notes = [];
// Сообщение: в подвал и, если открыто окно, в его шапку (подвал под затемнением листа не виден)
function note(text, cls) {
  notes.unshift({ t: Date.now(), text, cls }); notes.length = Math.min(notes.length, 5); renderFoot();
  const m = dlg && dlg.el.querySelector("#dlgMsg");
  if (m) { m.innerHTML = `<span class="${cls || ""}">${esc(text)}</span>`; clearTimeout(m._t); m._t = setTimeout(() => { if (m.isConnected) m.innerHTML = ""; }, 8000); }
}
function renderFoot() {
  const items = notes.filter(n => Date.now() - n.t < 20000).map(n => `<span class="${n.cls}">${esc(n.text)}</span>`);
  if (D) {
    if (identMode) items.unshift(`<span class="warn">◉ режим «найти плату» включён: нажатие на агента мигает светодиодом, окно агента не откроется</span>`);
    for (const a of D.agents) { const v = a.values || {}; if (alive(a.status) && v.work != null && v.work < 50 && v.temp >= (v.tmax || 70) - 2) items.push(`<span class="warn">${ICONS.hot} ${nameOf(D, a.mac)} у предела ${fmt(v.temp, 1)} °C (работа ${fmt(v.work, 0)} %)</span>`); }
  }
  setHTML($("foot"), (items.slice(0, 5).join("") || `<span class="mut">сообщений нет</span>`)
    + `<span class="sp"></span><span class="mut">${ICONS.gen} считает · ${ICONS.abs} поглощает · ${ICONS.idle} стоит/отдых · ${ICONS.meas} меряет · ${ICONS.quiet} молчит · ${ICONS.radio} без радио · ${ICONS.done} сдал итоги · ${ICONS.hot} перегрев · ${ICONS.off} нет связи · А/М — акселерометр/магнитометр</span>`
);
}
function renderTop(d) {
  const all = d.agents.filter(a => a.status !== "never"), on = all.filter(a => alive(a.status)).length, quiet = d.agents.filter(a => a.status === "quiet").length;
  let conn;
  if (!on && d.udp_age != null && d.udp_age > 30) conn = `<span class="bad">✗ сервер не слышит плат ${agoShort(d.udp_age)}</span>`;
  else if (!on) conn = `<span class="bad">✗ платы молчат</span>`;
  else conn = `<span class="${on === all.length ? "ok" : "warn"}">● ${on} из ${all.length} на связи</span>`;
  if (d.replaying) conn += `<span class="mut"> · ⟲ сервер перечитывает сырьё</span>`;
  if (quiet) conn += `<span class="mut"> · ${ICONS.quiet} молчат ${quiet}</span>`;
  if (d.tele === 1) conn += `<span class="mut"> · телеметрия редкая</span>`; else if (d.tele === 2) conn += `<span class="warn"> · телеметрия: молчание</span>`;
  $("conn").innerHTML = conn;
  const p = d.program, n = p && p.now, running = p && p.state === "running";
  $("exp").innerHTML = running && n
    ? `<b>${p.id === P.diagId ? "диагностика" : "программа №" + p.id}</b> · шаг ${n.n}/${n.of}${n.rest ? ` · ${ICONS.rest} отдых` : n.t_meas ? ` · ${fmtDur(Math.max(0, (n.minutes || 0) * 60 - Math.max(0, Date.now() / 1000 - n.t_meas)))}` : " · установление"}`
    : `<span class="mut">программа не идёт</span>`;
  // кнопки — по состоянию: что именно запустится, можно ли; «Остановить» — только когда есть что
  const nSteps = P.seq.length * P.repeat, bRun = $("bRun"), bStop = $("bStop");
  bRun.textContent = running ? "▶ идёт программа" : P.seq.length ? `▶ Запустить ${plural(nSteps, "шаг", "шага", "шагов")} · ≈ ${fmtDur(seqEstimate())}` : "▶ Запустить";
  bRun.disabled = running || !P.seq.length;
  bRun.title = running ? `идёт программа №${p.id}` : P.seq.length ? "запустить ленту шагов (внизу)" : "план пуст — «＋ шаг» или «⇊ вся матрица»";
  bStop.disabled = !running;
  $("bIdent").textContent = identMode ? "◉ найти: ВКЛ — нажмите агента" : "◉ найти плату";
  renderAlarmTop();
}
function renderAll() {
  if (!D) return;
  renderWheel(D, "1"); renderWheel(D, "2"); renderPic(D); renderStatic(D); renderNow(D); renderMidRows(); renderRibbon(D); renderTop(D); renderFoot(); renderDlg();
}
async function refresh() {
  D = await getJSON("/api/dash?window=10");
  await loadProg(D);
  await loadDiag();
  alarmCheck(D);
  renderAll();
}
poll(refresh, 2000);
setInterval(() => { if (D && ((prog && prog.state === "running") || (diag && diag.state === "running") || D.static_rec)) { renderNow(D); renderRibbon(D); renderTop(D); renderStatic(D); if (dlg && dlg.kind === "diag") renderDlg(); } }, 1000);   // таймеры — каждую секунду
</script>
</body>
</html>
