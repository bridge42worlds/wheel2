<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо-2 · планшетка</title>
<link rel="stylesheet" href="/ui.css">
<style>
/* Планшетка (docs/how_it_works.md § 12): одно главное окно на весь экран, без прокрутки —
   колесо 1 · установка · колесо 2, внизу лента шагов. Всё, что настраивается подробно (состав и
   подгруппы, агент, шаги, опыт, диагностика, прошивка, откуда шумы), — во всплывающих окнах;
   отчёт — отдельным окном (/report). Опыт задаётся слоями: роль колеса, способ, шум, поле, шаг.
   Цвет никогда не единственный признак: у каждого состояния значок и слово (Okabe-Ito в ui.css). */
.plan { grid-template-rows:auto minmax(0, 1fr) auto auto; }
.topbar { padding:6px 10px; }
.topbar .row { gap:6px; }
.topbar .btn { padding:.3em .75em; }
.cols3 { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap:8px; min-height:0; }
.wbody { display:flex; flex-direction:column; gap:6px; overflow:auto; }
.grp { padding:5px 7px; gap:3px; }
.grp .chips { grid-template-columns:repeat(8, minmax(0, 1fr)); }
.layers { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:5px 8px; align-items:start; }
.lh { color:var(--mut); font-size:.82em; padding-top:3px; white-space:nowrap; }
.opts { display:flex; flex-wrap:wrap; gap:3px; }
.opt { border:1px solid var(--line); border-radius:6px; padding:1px 7px; cursor:pointer; user-select:none; font-size:.86em; background:var(--card); }
.opt.on { border-color:var(--on); background:var(--on-bg); font-weight:600; }
.opt.on::before { content:"✓ "; }
.opt.dis { opacity:.5; cursor:not-allowed; text-decoration:line-through; }
.dim { opacity:.45; }
.mid { gap:6px; }
.pic { flex:1 1 auto; min-height:140px; }
.pic svg { width:100%; height:100%; display:block; }
.pic svg [data-act] { cursor:pointer; }
.now { border:1px solid var(--line); border-radius:9px; padding:6px 10px; }
.now .tm { font-size:2em; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
.now .kv { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:.92em; }
.now .kv b { font-variant-numeric:tabular-nums; font-weight:600; }
.setline { font-size:.9em; }
.ribbon { max-height:24vh; }
.steps { display:flex; gap:4px; overflow-x:auto; padding:2px 0 4px; }
.step { min-width:118px; max-width:170px; border:1px solid var(--line); border-radius:8px; padding:3px 6px; font-size:.8em; flex:0 0 auto; background:var(--card); cursor:pointer; }
.step.ctl { background:repeating-linear-gradient(135deg, transparent 0 6px, rgba(128,128,128,.12) 6px 12px); }
.step.cur { border:2px solid var(--on); }
.step.spoiled { border-style:dashed; }
.step.plan { border-style:dotted; }
.step .n { font-weight:700; }
.step .bar { height:4px; margin-top:3px; }
.step .bar i { height:4px; }
.foot { display:flex; gap:14px; flex-wrap:wrap; font-size:.86em; padding:0 4px; align-items:center; }
.dlg-h { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:1.05em; }
.kv2 { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:center; }
.kv2 > span:nth-child(odd) { color:var(--mut); }
.btn.sm { padding:.12em .55em; font-size:.88em; }
.btn.tiny { padding:0 .4em; font-size:.82em; border-radius:6px; }
label.inl { display:inline-flex; align-items:center; gap:4px; margin:2px 10px 2px 0; }
.fs { border:1px solid var(--line); border-radius:9px; padding:6px 10px; margin:0 0 8px; }
.fs legend { color:var(--mut); font-size:.85em; padding:0 4px; }
@media (max-width: 900px) {
  .cols3 { display:flex; flex-direction:column; }
  .pic { height:300px; flex:none; }
  .ribbon { max-height:none; }
}
</style>
</head>
<body>
<div class="screen plan">
  <header class="panel topbar"><div class="row">
    <b>Колесо-2 · планшетка</b>
    <span id="conn" class="small"></span>
    <span id="exp" class="small"></span>
    <span class="sp"></span>
    <button class="btn" id="bIdent" data-act="identmode" title="Режим «найти плату»: нажмите на агента — его светодиод замигает 20 с">◉ найти плату</button>
    <button class="btn" data-act="compose" title="Какие агенты на каком колесе и в какой подгруппе">состав…</button>
    <button class="btn" data-act="seq" title="Последовательность шагов: добавить, переставить, убрать">шаги…</button>
    <button class="btn" data-act="exper" title="Длительность шага, температура, отдых, повторы, контроль">опыт…</button>
    <button class="btn" data-act="diag" title="Проверить установку: связь, слышимость, скорость, температура, память, датчики">диагностика…</button>
    <button class="btn" data-act="fw" title="Прошивка агентов: по Wi-Fi и новых плат по USB">прошивка…</button>
    <button class="btn" data-act="report" title="Отчёт по программам — отдельным окном">отчёт ↗</button>
    <button class="btn big go" id="bRun" title="Запустить последовательность шагов (лента внизу)">▶ Запустить</button>
    <button class="btn big stop" id="bStop" title="Остановить программу после текущего шага">⏹ Остановить</button>
    <button class="btn big stop" id="bHalt" title="Всё стоп сразу: программа, счёт у всех агентов, катушки выкл">■ Всё стоп</button>
  </div></header>
  <main class="cols3">
    <section class="panel" id="w1"></section>
    <section class="panel mid" id="mid">
      <div class="pic" id="pic"></div>
      <div id="now"></div>
      <div class="row small"><span class="lh">4 · поле катушек (колесо 1, колесо 2)</span><span id="fields"></span></div>
      <div class="row setline" id="setline"></div>
    </section>
    <section class="panel" id="w2"></section>
  </main>
  <section class="panel ribbon" id="ribbon"></section>
  <footer class="foot" id="foot"><span class="mut">…</span></footer>
</div>

<script src="/ui.js"></script>
<script>
"use strict";
// ---------- слои ----------
const ROLES_W = [["gen", "генерация"], ["abs", "поглощение"], ["idle", "стоит"]];
const WAYS_GEN = [["solo", "эгоистичный", "каждый из своего шума — своё простое"],
                  ["cascade", "групповой", "шум от всех в подгруппе, свои числа из общего шума (каскад)"],
                  ["same", "групповой · одинаковые числа", "все считают одно число — появится с прошивкой", true]];
const WAYS_ABS = [["all", "все со всеми", "каждый поглотитель получает все простые своей группы"],
                  ["pair", "один к одному", "агент i поглощает простые агента i — появится с прошивкой", true]];
// Шумы: [ключ, название, откуда берётся, ещё нельзя (зачёркнут), настройка агента]
const NOISES = [
  ["rng", "ГСЧ чипа", "Аппаратный генератор ESP32-S3 (esp_random). При включённом радио в него подмешивается шум приёмника Wi-Fi. ~44 800 слов/с. Без радио слабее.", false, { src: 1 }],
  ["all", "все доступные", "ГСЧ + CSI с пульса + АЦП + дрожание RC сразу, через хеш SHA-256: число случайно, даже если хорош только один из них.", false, { src: 15, ping: 0, hb: 10 }],
  ["csi", "CSI с пульса", "«Отпечаток» радиоканала: амплитуды и фазы 64 поднесущих в каждом принятом кадре. Меняются от отражений, движения, вращения, поля. Кадры — пульс соседних агентов (ESP-NOW, 10 в секунду от каждого), роутер не нужен.", false, { src: 2, ping: 0, hb: 10 }],
  ["csiping", "CSI с пинга роутера", "Тот же CSI, но кадры — ответы роутера на пинг 20 раз в секунду. На старом роутере пинг вызывал «зомби» (07.10) — до нового роутера осторожно.", false, { src: 2, ping: 20, hb: 1 }],
  ["csiair", "CSI со всего эфира", "CSI с любых чужих кадров вокруг (телефоны, соседские сети) — режим прослушки. Появится с прошивкой.", true, null],
  ["adc", "АЦП D0", "Ножка D0 висит в воздухе, подтянута к середине питания. АЦП ловит наводки (сеть 50 Гц, радио, провода рядом) и шум резисторов. ~21 000 отсчётов/с, засчитываем 1/4 бита на отсчёт. К D0 ничего не подключать.", false, { src: 4 }],
  ["jit", "дрожание RC", "Внутренняя частота: RC-генератор 136 кГц против кварца 40 МГц — сколько тактов кварца уложилось в 8 периодов RC. Разброс — тепловой шум RC-цепи; частота сильно зависит от температуры. ~16 000 отсчётов/с, 1/4 бита на отсчёт.", false, { src: 8 }],
  ["bc", "обратный шум (подмешать)", "ГСЧ + содержимое кадров, которые выпустили поглотители (их шум, смешанный с нашими простыми). Только в шаге, где другое колесо поглощает.", false, { src: 17 }],
  ["bconly", "обратный шум (только он)", "Число только из кадров поглотителей — петля через эфир. Только в шаге с поглощением.", false, { src: 16 }],
  ["acc", "акселерометр", "ICM-42688-P на ободе: младшие разряды осей — собственный шум датчика, вибрации, вращение. Появится с прошивкой и запаянным датчиком.", true, null],
  ["mag", "магнитометр", "MLX90393: младшие разряды поля — шум датчика, поле катушки, поле Земли, наводки. Появится с прошивкой и запаянным датчиком.", true, null],
  ["tmp", "температура кристалла", "Проверена 03.10 и отвергнута: датчик даёт шаг 1 °C и меняется раз в несколько секунд (за 4096 чтений — 2 значения), шума в нём нет. Тепловой шум уже входит в дрожание RC и АЦП; сама температура записывается в каждый шаг.", true, null]];
const FIELDS = [["off", "выкл"], ["pp", "+ +"], ["pm", "+ −"], ["mp", "− +"], ["mm", "− −"]];
const GEN_CFG = { solo: { mode: 0, dc: 1 }, cascade: { mode: 1, gv: 2, dc: 1, rk: 1, pw: 20 }, same: { mode: 1, gv: 2, dc: 1 } };
const ABS_CFG = { all: { sm: 1, sh: 0 }, pair: { sm: 1, sh: 0 } };
const WAY_SHORT = { solo: "эго", cascade: "групп", same: "одинак.", all: "все", pair: "1:1" };
const LETTERS = "абвгдежз";                 // подгруппы на колесе — как SUBGROUPS на сервере
const MAX_GROUP = 16;                       // предел участников группы в прошивке (MAX_GROUP)
const DEF = { w1: { roles: ["gen"], ways: ["solo"], abs: ["all"], noise: ["rng"] },
              w2: { roles: ["idle"], ways: ["solo"], abs: ["all"], noise: ["rng"] },
              fields: ["off"], merge: false, minutes: 1, quiet: false, repeat: 2, shuffle: true,
              restMode: "stable", restMin: 2, restBelow: 45, restMax: 6, tmax: 70, agentStep: false, radioOff: false,
              idleStep: true, baseline: 0, confirm: 0, seq: [], diagMin: 1, diagId: null };
let P = (() => { try { return { ...DEF, ...JSON.parse(localStorage.getItem("plan.v2") || "{}") }; } catch (e) { return { ...DEF }; } })();
P.w1 = { ...DEF.w1, ...(P.w1 || {}) }; P.w2 = { ...DEF.w2, ...(P.w2 || {}) }; P.seq = Array.isArray(P.seq) ? P.seq : [];
function save() { try { localStorage.setItem("plan.v2", JSON.stringify(P)); } catch (e) { /* без памяти */ } }
let D = null, prog = null, progT = 0, diag = null, diagT = 0, dlg = null, identMode = false, ribbonMode = "auto";

// ---------- данные ----------
const isStatic = (d, a) => a.kind === "S" || (d.compose.slot || {})[a.mac] === "S";
// агенты колеса — по составу на сервере, и те, что ещё не выходили на связь (видны как ✗)
function wheelMacs(d, w) { return d.agents.filter(a => (d.compose.wheels || {})[a.mac] === w && !isStatic(d, a)).map(a => a.mac); }
function staticList(d) { return d.agents.filter(a => isStatic(d, a)); }
function agentById(d, m) { return d.agents.find(a => a.mac === m) || {}; }
function nameOf(d, m) { const a = agentById(d, m); return a.id ? "№" + a.id : m.slice(-5); }
function subOf(d, m) { const s = (d.compose.sub || {})[m]; return s && LETTERS.includes(s) ? s : "а"; }
function byId(d) { return (p, q) => (agentById(d, p).id || 0) - (agentById(d, q).id || 0); }
// Подгруппы колеса по порядку букв: [{letter, macs}], агенты внутри — по номерам
function wheelGroups(d, w) {
  const by = {};
  for (const m of wheelMacs(d, w).sort(byId(d))) (by[subOf(d, m)] = by[subOf(d, m)] || []).push(m);
  return [...LETTERS].filter(l => by[l]).map(l => ({ letter: l, macs: by[l] }));
}
// Состояние агента — значок и слово: ▶ считает / ▼ поглощает / ⏸ стоит / ◇ молчит / ◌ без радио / ✔ сдал итоги / ✗ нет связи / ◆ меряет
function stateOf(d, a) {
  const g = d.gen[a.mac] || {}, p = d.program, now = p && p.state === "running" && p.now;
  // шаг без радио: агент молчит нарочно — Wi-Fi выключен до конца шага
  if (!alive(a.status) && now && now.ro && !now.rest && prog && (prog.targets || []).includes(a.mac) && !isStatic(d, a))
    return { icon: "◌", word: "считает без радио", cls: "mut", k: 0 };
  if (!alive(a.status)) return { icon: "✗", word: a.status === "never" ? "не выходил на связь" : "нет связи", cls: "bad", k: 3 };
  if (a.status === "quiet") return { icon: "◇", word: "молчит (считает)", cls: "mut", k: 0 };
  if (isStatic(d, a)) return { icon: "◆", word: "меряет", cls: "ok", k: 0 };
  if (!g.run && g.done && g.done === g.cid) return { icon: "✔", word: "сдал итоги", cls: "ok", k: 2 };
  if (g.run) return g.role === 1 ? { icon: "▼", word: "поглощает", cls: "ok", k: 1 } : { icon: "▶", word: g.mode === 1 ? "считает сообща" : "считает", cls: "ok", k: 0 };
  return { icon: "⏸", word: "стоит", cls: "mut", k: 2 };
}
function sensBadges(a) { const s = a.sens || 0; return (s & 1 ? ["А"] : []).concat(s & 2 ? ["М"] : []); }   // датчики: акселерометр, магнитометр
// Чем занята подгруппа — по большинству её агентов: ▲ генерация / ▼ поглощение / ○ стоят / ✗ нет связи
function groupState(d, macs) {
  const cnt = [0, 0, 0, 0];
  for (const m of macs) cnt[stateOf(d, agentById(d, m)).k]++;
  const k = cnt.indexOf(Math.max(...cnt));
  return { k, icon: ["▲", "▼", "○", "✗"][k], word: ["генерация", "поглощение", "стоят", "нет связи"][k] };
}
function plural(n, a, b, c) { const m = n % 10, h = n % 100; return `${n} ${h > 10 && h < 20 ? c : m === 1 ? a : m > 1 && m < 5 ? b : c}`; }
function wayName(k) { return ({ solo: "эгоистичный", cascade: "групповой (каскад)", same: "групповой · одинаковые числа", all: "все со всеми", pair: "один к одному" })[k] || ""; }
function noiseName(k) { const n = NOISES.find(x => x[0] === k); return n ? n[1] : ""; }
function fieldName(k) { return ({ off: "выкл", pp: "+ +", pm: "+ −", mp: "− +", mm: "− −" })[k] || k; }
function stateWord(s) { return ({ running: "идёт", done: "выполнена", stopped: "остановлена", error: "ошибка" })[s] || s; }
function setHTML(el, html) { if (el && el._h !== html) { el._h = html; el.innerHTML = html; } }
function optsHTML(scope, key, list, sel) {
  return `<div class="opts" data-scope="${scope}" data-key="${key}">${list.map(([v, name, note, dis]) =>
    `<span class="opt ${sel.includes(v) ? "on" : ""} ${dis ? "dis" : ""}" data-v="${v}" title="${esc(note || "")}">${esc(name)}</span>`).join("")}</div>`;
}

// ---------- колесо ----------
function chipHTML(d, m) {
  const a = agentById(d, m), st = stateOf(d, a), v = a.values || {}, g = d.gen[m] || {};
  let cls = "";
  if (st.icon === "✗") cls = "off";
  else if (st.icon === "◌" || a.status === "quiet") cls = "quiet " + (g.role === 1 ? "B" : "A");
  else if (g.run) cls = g.role === 1 ? "B" : "A";
  const tmax = v.tmax || P.tmax, tp = v.temp != null ? Math.max(0, Math.min(100, 100 * (v.temp - 40) / Math.max(1, tmax - 40))) : 0;
  const rate = g.run && (g.rate || {}).g_pr_s != null ? `, ${fmt(g.rate.g_pr_s, 1)} простых/с` : "";
  return `<div class="chip ${cls}" data-act="agent" data-mac="${m}" title="${esc(nameOf(d, m))} · группа ${subOf(d, m)}: ${esc(st.word)}${v.temp != null ? ", " + fmt(v.temp, 1) + " °C" : ""}${rate}${sensBadges(a).length ? ", датчики " + sensBadges(a).join(" ") : ""}">
    <span class="q">${st.icon}</span><span class="g">${sensBadges(a).join("")}</span><div class="n">${a.id || "?"}</div>
    <div class="r">${v.temp != null ? fmt(v.temp, 0) + "°" : "—"}</div><div class="t"><i class="${v.temp != null && v.temp >= tmax - 2 ? "hot" : ""}" style="width:${tp}%"></i></div></div>`;
}
function spinHTML(d, macs) {
  const rows = (d.wheel || []).filter(x => macs.includes(x.mac));
  return rows.map(x => {
    const r = (x.r_set || 450) / 1000, need = 60 / (2 * Math.PI) * Math.sqrt(9.81 / r);
    const rev = x.last_rev || {}, k = rev.k != null ? rev.k : (x.w != null ? x.w * x.w * r / 9.81 : null);
    const word = k == null || !x.rpm_now ? "стоит" : Math.abs(k - 1) <= 0.05 ? "✓ невесомость наверху" : k < 1 ? `◐ недобор, k ${fmt(k, 2)}` : `◐ перебор, k ${fmt(k, 2)}`;
    return `<div class="small">⟳ №${x.id}: <b>${fmt(x.rpm_now, 1)}</b> об/мин · нужно ${fmt(need, 1)} · ${word}</div>`;
  }).join("");
}
function renderWheel(d, w) {
  const S = P["w" + w], groups = wheelGroups(d, w), macs = groups.flatMap(g => g.macs);
  const gl = groups.map(g => {
    const gs = groupState(d, g.macs);
    return `<div class="card grp"><div class="row small"><b>группа ${g.letter}</b><span class="mut">${gs.icon} ${gs.word} · ${g.macs.length}</span>${g.macs.length > MAX_GROUP ? `<span class="bad">✗ больше ${MAX_GROUP}</span>` : ""}</div>
      <div class="chips">${g.macs.map(m => chipHTML(d, m)).join("")}</div></div>`;
  }).join("") || `<div class="mut small">агентов нет — «состав…»</div>`;
  const gen = S.roles.includes("gen"), abs = S.roles.includes("abs");
  setHTML($("w" + w), `<h2>Колесо ${w} <span class="small mut">${plural(macs.length, "агент", "агента", "агентов")}${groups.length > 1 ? " · " + plural(groups.length, "группа", "группы", "групп") : ""}</span>
      <span class="sp"></span><button class="btn sm" data-act="compose" title="перенести агентов, разбить на подгруппы">состав…</button></h2>
    <div class="fill wbody">
      ${gl}
      <div class="small mut">⚙ управление: нет — появится с мостами DRV8871 (катушка, шина, ток)</div>
      ${spinHTML(d, macs)}
      <div class="layers">
        <span class="lh">1 · роль</span>${optsHTML("w" + w, "roles", ROLES_W, S.roles)}
        <span class="lh ${gen ? "" : "dim"}">2 · генерация</span><div class="${gen ? "" : "dim"}">${optsHTML("w" + w, "ways", WAYS_GEN, S.ways)}</div>
        <span class="lh ${abs ? "" : "dim"}">2 · поглощение</span><div class="${abs ? "" : "dim"}">${optsHTML("w" + w, "abs", WAYS_ABS, S.abs)}</div>
        <span class="lh ${gen ? "" : "dim"}">3 · шум <button class="btn tiny" data-act="noises" title="откуда берётся каждый шум">ⓘ</button></span><div class="${gen ? "" : "dim"}">${optsHTML("w" + w, "noise", NOISES, S.noise)}</div>
      </div>
    </div>`);
}

// ---------- рисунок установки ----------

      if (v.rssi != null && v.rssi < -80) warn.push(`роутер слабо (${v.rssi} дБм)`);
      if (a.loss_pct > 5) warn.push(`потери ${fmt(a.loss_pct, 1)} %`);
      if (gm.pr_s != null) { if (gm.pr_s === 0) bad.push("простых нет"); else if (med && gm.pr_s < 0.6 * med) warn.push("медленнее группы"); }
      else if (run && run.t1 && alive(a.status)) warn.push("нет итогов");
      if (v.temp != null && v.temp >= (v.tmax || P.tmax) - 1 && v.work != null && v.work < 90) warn.push(`греется, работа ${fmt(v.work, 0)} %`);
      const hm = v.heapmin != null ? v.heapmin : v.heap;
      if (hm != null && hm < 40000) (hm < 30000 ? bad : warn).push(`память ${fmt(hm / 1000, 0)} КБ`);
      if (a.reboots) warn.push(`перезагрузок ${a.reboots}`);
      const verdict = bad.length ? { icon: "✗", cls: "bad", word: bad.join(", ") } : warn.length ? { icon: "◐", cls: "warn", word: warn.join(", ") } : { icon: "✓", cls: "ok", word: "в порядке" };
      rows.push({ m, a, v, st, gm, g, hear, med, verdict });
    }
  }
  return rows;
}
function diagHTML(d) {
  const running = diag && diag.state === "running", p = d.program;
  let body = "";
  if (!diag || !P.diagId) body = `<div class="small mut">Ещё не запускалась. Запускать, когда агенты поставлены на колёса и разбиты на подгруппы.</div>`;
  else if (running) {
    const now = p && p.now, t0 = now && (now.t_meas || now.t0), tot = now ? (now.minutes || 0) * 60 : 0, el2 = t0 ? Math.max(0, Date.now() / 1000 - t0) : 0;
    body = `<div><b>▶ идёт диагностика №${diag.id}</b> · ${now && now.t_meas ? `осталось ${fmtDur(Math.max(0, tot - el2))}` : "агенты принимают настройку"}</div>`;
  } else {
    const run = (diag.runs || [])[0];
    if (!run) body = `<div class="warn">◐ диагностика №${diag.id} ${esc(stateWord(diag.state))} — итогов нет</div>`;
    else {
      const rows = diagRows(d), nBad = rows.filter(r => r.verdict.icon === "✗").length, nWarn = rows.filter(r => r.verdict.icon === "◐").length;
      body = `<div class="small">№${diag.id} · ${new Date(run.t0 * 1000).toLocaleString("ru-RU")} · ${fmt((run.t1 - run.t0) / 60, 1)} мин · всего ${fmt(((run.gen || {})["все"] || {}).pr_s, 1)} пр/с ·
        <b class="${nBad ? "bad" : nWarn ? "warn" : "ok"}">${nBad ? `✗ ${nBad} с неполадками` : ""}${nBad && nWarn ? ", " : ""}${nWarn ? `◐ ${nWarn} с замечаниями` : ""}${!nBad && !nWarn ? "✓ все в порядке" : ""}</b>
        ${run.spoiled ? ` · <span class="bad">шаг испорчен: ${esc(run.spoiled_why || "")}</span>` : ""}</div>
        <div style="overflow:auto"><table class="t"><tr><th>агент</th><th>группа</th><th>сейчас</th><th>связь с сервером</th><th>слышит группу</th><th>пр/с</th><th>°C · работа</th><th>память</th><th>датчики</th><th>итог</th><th></th></tr>
        ${rows.map(r => `<tr><td><b>${nameOf(d, r.m)}</b></td><td>${esc(r.g.label)}</td><td><span class="${r.st.cls}">${r.st.icon}</span> ${esc(r.st.word)}</td>
          <td>${r.v.rssi != null ? `${r.v.rssi} дБм` : "—"}${r.a.loss_pct ? ` · потери ${fmt(r.a.loss_pct, 1)} %` : ""}</td>
          <td>${r.hear}</td><td class="num">${r.gm.pr_s != null ? fmt(r.gm.pr_s, 2) : "—"}${r.med ? ` <span class="small mut">(группа ${fmt(r.med, 2)})</span>` : ""}</td>
          <td>${r.v.temp != null ? fmt(r.v.temp, 0) + "°" : "—"}${r.v.work != null ? ` · ${fmt(r.v.work, 0)} %` : ""}</td>
          <td class="num">${r.v.heapmin != null ? fmt(r.v.heapmin / 1000, 0) + " КБ" : r.v.heap != null ? fmt(r.v.heap / 1000, 0) + " КБ" : "—"}</td>
          <td>${sensBadges(r.a).map(b => b === "А" ? "акселерометр" : "магнитометр").join(", ") || "<span class='mut'>нет</span>"}</td>
          <td><span class="${r.verdict.cls}">${r.verdict.icon} ${esc(r.verdict.word)}</span></td><td><button class="btn tiny" data-act="ident" data-mac="${r.m}">◉ найти</button></td></tr>`).join("")}</table></div>`;
    }
  }
  return `<div class="small mut" style="margin-bottom:6px">Каждая подгруппа считает сообща (каскад, ГСЧ чипа), одиночный агент — сам; потом по каждому агенту: связь, кого из своей группы слышит по пульсу, скорость против своей группы, температура, память, датчики.</div>
    <div class="row" style="margin-bottom:8px"><button class="btn go" data-act="diagrun" ${running || (p && p.state === "running") ? "disabled" : ""}>▶ Проверить установку</button>
      <label class="inl">длительность <input data-act="diagmin" type="number" min="0.5" max="10" step="0.5" style="width:3.5em" value="${P.diagMin}"> мин</label></div>${body}`;
}

// ---------- действия ----------
async function ident(mac) {
  try { await postJSON("/api/ident", { mac, secs: 20 }); note(`◉ ${nameOf(D, mac)}: светодиод мигает 20 с`, "ok"); }
  catch (er) { note("✗ " + er.message, "bad"); }
}
async function compose(body, what) {
  try { await postJSON("/api/compose", body); await refresh(); if (what) note("✓ " + what, "ok"); } catch (er) { note("✗ " + er.message, "bad"); }
}
document.addEventListener("click", async e => {
  const o = e.target.closest(".opt");
  if (o) {                                              // слой: отметить / снять вариант
    if (o.classList.contains("dis")) return;
    const box = o.closest(".opts"), sc = box.dataset.scope, key = box.dataset.key, v = o.dataset.v;
    const S = sc === "P" ? P : P[sc], arr = S[key] || [];
    S[key] = arr.includes(v) ? arr.filter(x => x !== v) : arr.concat([v]);
    save(); renderAll();
    return;
  }
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act, mac = t.dataset.mac;
  if (act === "agent") { if (identMode) ident(mac); else openDlg("agent", mac); }
  else if (["compose", "seq", "exper", "diag", "fw", "noises"].includes(act)) openDlg(act);
  else if (act === "report") { const w = window.open("/report", "report", "width=1400,height=900"); if (!w) location.href = "/report"; }
  else if (act === "identmode") { identMode = !identMode; $("bIdent").classList.toggle("sel", identMode); note(identMode ? "◉ режим «найти плату»: нажмите на агента — его светодиод замигает" : "режим «найти плату» выключен", "ok"); }
  else if (act === "ident") ident(mac);
  else if (act === "wheel") compose({ wheels: { [mac]: t.dataset.w } }, `${nameOf(D, mac)}: ${t.dataset.w ? "колесо " + t.dataset.w : "без колеса"}`);
  else if (act === "sub") compose({ sub: { [mac]: t.dataset.s } }, `${nameOf(D, mac)}: группа ${t.dataset.s}`);
  else if (act === "split") {                           // разбить колесо на n групп поровну, по порядку номеров
    const n = +t.dataset.n, macs = wheelMacs(D, t.dataset.w).sort(byId(D)), sub = {}, per = Math.ceil(macs.length / n);
    macs.forEach((m, i) => sub[m] = LETTERS[Math.min(Math.floor(i / per), LETTERS.length - 1)]);
    compose({ sub }, `колесо ${t.dataset.w}: ${n === 1 ? "одна группа" : n + " группы"}`);
  }
  else if (act === "qadd") addCurrent();
  else if (act === "qmatrix") addMatrix();
  else if (act === "qclear") { if (confirm("Убрать все шаги из плана?")) { P.seq = []; save(); renderAll(); } }
  else if (act === "rm") { P.seq.splice(+t.dataset.i, 1); save(); renderAll(); }
  else if (act === "mv") { const i = +t.dataset.i, j = i + (+t.dataset.d); if (j >= 0 && j < P.seq.length) { [P.seq[i], P.seq[j]] = [P.seq[j], P.seq[i]]; save(); renderAll(); } }
  else if (act === "ctl") { P.seq[+t.dataset.i].control = t.checked; save(); renderAll(); }
  else if (act === "rmode") { ribbonMode = t.dataset.m; renderRibbon(D); }
  else if (act === "diagrun") diagStart();
  else if (act === "ota") {
    if (!confirm("Обновить прошивку всех агентов на связи по Wi-Fi? Счёт остановится.")) return;
    try { const r = await postJSON("/api/ota", { targets: "all" }); note(`✓ команда ушла ${r.sent.length} агентам`, "ok"); } catch (er) { note("✗ " + er.message, "bad"); }
  } else if (act === "usb") {
    const ports = ((D.usb || {}).boards || []).filter(b => b.status !== "online").map(b => b.port);
    if (!confirm("Прошить новые платы по USB (сборка 1–3 мин, кабели не отключать)?")) return;
    try { await postJSON("/api/usb", { ports }); note("✓ прошивка по USB началась", "ok"); } catch (er) { note("✗ " + er.message, "bad"); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === "diagmin") { P.diagMin = Math.max(0.5, Math.min(10, +t.value || 1)); save(); }
});

// ---------- запуск ----------
function restJSON() {
  const r = { rest: P.restMode === "fixed" ? P.restMin * 60 : P.restMode === "none" ? 0 : P.restMode, rest_max_s: P.restMax * 60 };
  if (P.restMode === "below") r.rest_below = P.restBelow;
  return r;
}
function programJSON(steps) {
  return { name: `планшетка ${new Date().toLocaleString("ru-RU")}`, baseline_min: P.baseline, repeat: P.repeat, shuffle: P.shuffle,
           settle_s: 10, ...restJSON(), z: 4, confirm: P.confirm, redo: 2, metrics: ["pr_s", "cand_s"], targets: "all",
           steps: steps.map(s => ({ ...s, minutes: P.minutes, quiet: P.quiet, agent: !!P.agentStep,
                                    groups: s.groups.map(g => ({ ...g, cfg: { ...g.cfg, ...(g.cfg.run === 0 ? {} : { tmax: P.tmax, ro: P.agentStep && P.radioOff ? 1 : 0 }) } })) })) };
}
$("bRun").onclick = async () => {
  if (!P.seq.length) { note("✗ план пуст — добавьте шаги (＋ шаг или ⇊ вся матрица)", "bad"); return; }
  if (P.confirm && !P.seq.some(s => s.control)) { note("✗ для проверочных пар нужен хотя бы один контрольный шаг", "bad"); return; }
  const bad = checkSteps(P.seq); if (bad) { note("✗ " + bad, "bad"); return; }
  const n = P.seq.length * P.repeat;
  if (!confirm(`Запустить ${P.seq.length} шагов × ${P.repeat} повторов (${n} шагов по ${P.minutes} мин)${P.shuffle ? ", случайный порядок" : ""}, греться до ${P.tmax} °C${P.agentStep ? ", шаг на агенте" : ""}${P.agentStep && P.radioOff ? ", Wi-Fi выкл где эфир не нужен" : ""}?`)) return;
  try { const r = await postJSON("/api/program/start", { program: programJSON(P.seq) }); note(`✓ программа №${r.id} запущена: ${n} шагов`, "ok"); progT = 0; ribbonMode = "auto"; await refresh(); }
  catch (er) { note("✗ " + er.message, "bad"); }
};
$("bStop").onclick = async () => { try { await postJSON("/api/program/stop", {}); note("✓ программа остановится после шага", "ok"); } catch (e) { note("✗ " + e.message, "bad"); } };
$("bHalt").onclick = async () => {
  if (!confirm("Всё стоп: остановить программу, остановить счёт у всех агентов, катушки выключить?")) return;
  try { await postJSON("/api/program/stop", {}); } catch (e) { /* программы может не быть */ }
  try { const r = await postJSON("/api/compose", { action: "stop", force: true }); note(`■ всё стоп: ${(r.applied || []).map(x => `${x.label} (${x.n})`).join(", ")} · катушки: управляющего агента ещё нет`, "warn"); }
  catch (e) { note("✗ " + e.message, "bad"); }
  progT = 0; await refresh();
};

// ---------- сообщения, верх, опрос ----------
const notes = [];
function note(text, cls) { notes.unshift({ t: Date.now(), text, cls }); notes.length = Math.min(notes.length, 5); renderFoot(); }
function renderFoot() {
  const items = notes.filter(n => Date.now() - n.t < 20000).map(n => `<span class="${n.cls}">${esc(n.text)}</span>`);
  if (D) {
    for (const a of D.agents) { const v = a.values || {}; if (alive(a.status) && v.work != null && v.work < 50 && v.temp >= (v.tmax || 70) - 2) items.push(`<span class="warn">◐ ${nameOf(D, a.mac)} у предела ${fmt(v.temp, 1)} °C (работа ${fmt(v.work, 0)} %)</span>`); }
    const sv = D.static_verdict; if (sv && STATIC_VERDICT[sv.verdict] && !["ok", "nodata", "nobase"].includes(sv.verdict)) { const vv = STATIC_VERDICT[sv.verdict]; items.push(`<span class="${vv.cls}">${vv.icon} статика: ${vv.word}</span>`); }
  }
  setHTML($("foot"), (items.slice(0, 5).join("") || `<span class="mut">сообщений нет</span>`)
    + `<span class="sp"></span><span class="mut">▶ считает · ▼ поглощает · ⏸ стоит · ◇ молчит · ◌ без радио · ✔ сдал итоги · ✗ нет связи · А/М — акселерометр/магнитометр</span>`
    + `<a href="/pult" target="pult">пульт</a><a href="/watch" target="watch">наблюдение</a>`);
}
function renderTop(d) {
  const on = d.agents.filter(a => alive(a.status)).length, quiet = d.agents.filter(a => a.status === "quiet").length;
  $("conn").innerHTML = `<span class="${on ? "ok" : "bad"}">● ${on} на связи</span>${quiet ? `<span class="mut"> · ◇ молчат ${quiet}</span>` : ""}`;
  const p = d.program, n = p && p.now;
  $("exp").innerHTML = p && p.state === "running" && n
    ? `<b>${p.id === P.diagId ? "диагностика" : "программа №" + p.id}</b> · шаг ${n.n}/${n.of}${n.rest ? " · ⏸ отдых" : ` · ${fmtDur(Math.max(0, (n.minutes || 0) * 60 - Math.max(0, Date.now() / 1000 - (n.t_meas || n.t0))))}`}`
    : `<span class="mut">программа не идёт</span>`;
}
function renderAll() {
  if (!D) return;
  renderWheel(D, "1"); renderWheel(D, "2"); renderPic(D); renderNow(D); renderMidRows(); renderRibbon(D); renderTop(D); renderFoot(); renderDlg();
}
async function refresh() {
  D = await getJSON("/api/dash?window=10");
  await loadProg(D);
  await loadDiag();
  renderAll();
}
poll(refresh, 2000);
setInterval(() => { if (D && ((prog && prog.state === "running") || (diag && diag.state === "running"))) { renderNow(D); renderRibbon(D); renderTop(D); if (dlg && dlg.kind === "diag") renderDlg(); } }, 1000);   // таймеры — каждую секунду
</script>
</body>
</html>
