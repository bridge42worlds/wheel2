<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" width="980" height="370" role="img">
<title>Фаза 3. Колесо: шина 3,3 В, две ветки по три блока</title>
<desc>Аккумулятор 2×18650 через DC-DC 3,3 В питает две ветки шины, расходящиеся по ободу в разные стороны. На каждой ветке три блока, блок — агент и два датчика. Концы веток между собой не соединены.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2228}
.h{font-size:15px;font-weight:600}.t{font-size:13px}.s{font-size:12px;fill:#4a535e}
.box{fill:#fff;stroke:#1d2228;stroke-width:1.3}
.p{stroke:#D55E00;stroke-width:2.6;fill:none}.m{stroke:#1d2228;stroke-width:2;fill:none}
</style>
<rect width="980" height="370" fill="#ffffff"/>
<text class="h" x="20" y="28">Фаза 3. Колесо: шина 3,3 В — две ветки по три блока от одного источника</text>
<rect class="box" x="400" y="50" width="180" height="60" rx="6"/>
<text class="h" x="490" y="76" text-anchor="middle">2×18650 → DC-DC</text>
<text class="s" x="490" y="96" text-anchor="middle">LM2596, выход 3,35–3,4 В</text>
<path class="p" d="M470 110 V170 H40"/>
<path class="p" d="M510 110 V170 H940"/>
<path class="m" d="M480 110 V184 H40"/>
<path class="m" d="M500 110 V184 H940"/>
<text class="s" x="40" y="160">ветка А: плюс 3,3 В (сплошная толстая) и GND (тонкая)</text>
<text class="s" x="940" y="160" text-anchor="end">ветка Б</text>
<g>
<line class="p" x1="106" y1="170" x2="106" y2="230"/><line class="m" x1="114" y1="184" x2="114" y2="230"/>
<line class="p" x1="246" y1="170" x2="246" y2="230"/><line class="m" x1="254" y1="184" x2="254" y2="230"/>
<line class="p" x1="386" y1="170" x2="386" y2="230"/><line class="m" x1="394" y1="184" x2="394" y2="230"/>
<line class="p" x1="586" y1="170" x2="586" y2="230"/><line class="m" x1="594" y1="184" x2="594" y2="230"/>
<line class="p" x1="726" y1="170" x2="726" y2="230"/><line class="m" x1="734" y1="184" x2="734" y2="230"/>
<line class="p" x1="866" y1="170" x2="866" y2="230"/><line class="m" x1="874" y1="184" x2="874" y2="230"/>
</g>
<g>
<rect class="box" x="50" y="230" width="120" height="64" rx="6"/><text class="h" x="110" y="257" text-anchor="middle">Блок 1</text><text class="s" x="110" y="277" text-anchor="middle">агент, 2 датчика</text>
<rect class="box" x="190" y="230" width="120" height="64" rx="6"/><text class="h" x="250" y="257" text-anchor="middle">Блок 2</text><text class="s" x="250" y="277" text-anchor="middle">агент, 2 датчика</text>
<rect class="box" x="330" y="230" width="120" height="64" rx="6"/><text class="h" x="390" y="257" text-anchor="middle">Блок 3</text><text class="s" x="390" y="277" text-anchor="middle">агент, 2 датчика</text>
<rect class="box" x="530" y="230" width="120" height="64" rx="6"/><text class="h" x="590" y="257" text-anchor="middle">Блок 4</text><text class="s" x="590" y="277" text-anchor="middle">агент, 2 датчика</text>
<rect class="box" x="670" y="230" width="120" height="64" rx="6"/><text class="h" x="730" y="257" text-anchor="middle">Блок 5</text><text class="s" x="730" y="277" text-anchor="middle">агент, 2 датчика</text>
<rect class="box" x="810" y="230" width="120" height="64" rx="6"/><text class="h" x="870" y="257" text-anchor="middle">Блок 6</text><text class="s" x="870" y="277" text-anchor="middle">агент, 2 датчика</text>
</g>
<text class="t" x="20" y="326">Ветки расходятся от источника по ободу в разные стороны. Концы веток между собой не соединять:</text>
<text class="t" x="20" y="346">замкнутое кольцо внутри катушки — это виток, в нём наводится ток. Обод около 1 м, ветка около 0,5 м.</text>
</svg>
