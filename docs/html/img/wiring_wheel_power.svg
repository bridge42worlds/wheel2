<text class="s" x="554" y="350" text-anchor="end">D0</text><text class="s" x="554" y="372" text-anchor="end">D1</text>
<text class="t" x="462" y="336" text-anchor="middle" style="font-weight:600">№13 · агент катушки</text>
<text class="s" x="462" y="354" text-anchor="middle">XIAO ESP32-S3, роль M</text>
<text class="s" x="462" y="372" text-anchor="middle">катушка + оба INA219</text>
<text class="s" x="430" y="406" text-anchor="middle">D9</text><text class="s" x="490" y="406" text-anchor="middle">D8</text>

<!-- мост и катушка -->
<rect class="box" x="680" y="300" width="130" height="100" rx="6"/>
<text class="s" x="700" y="316" text-anchor="middle">VM</text><text class="s" x="770" y="316" text-anchor="middle">GND</text>
<text class="t" x="742" y="364" text-anchor="middle" style="font-weight:600">DRV8871</text>
<text class="s" x="686" y="350">IN1</text><text class="s" x="686" y="372">IN2</text>
<text class="s" x="804" y="334" text-anchor="end">OUT1</text><text class="s" x="804" y="388" text-anchor="end">OUT2</text>
<line class="sig" x1="560" y1="346" x2="680" y2="346"/>
<line class="sig" x1="560" y1="368" x2="680" y2="368"/>
<path class="m" d="M810 330 H832 a6.25 6.25 0 0 1 0 12.5 a6.25 6.25 0 0 1 0 12.5 a6.25 6.25 0 0 1 0 12.5 a6.25 6.25 0 0 1 0 12.5 H810"/>
<text class="s" x="846" y="318" text-anchor="middle">катушка</text>
<text class="s" x="846" y="400" text-anchor="middle">≈ 5 Ом</text>

<!-- I2C: четыре провода от №13 к обоим модулям -->
<line class="v3" x1="185" y1="196" x2="185" y2="450"/>
<line class="m" x1="225" y1="196" x2="225" y2="450"/>
