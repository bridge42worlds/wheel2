<text class="t" x="245" y="170" text-anchor="middle" style="font-weight:600">INA219 · 0x40</text>
<text class="s" x="185" y="190" text-anchor="middle">VCC</text><text class="s" x="225" y="190" text-anchor="middle">GND</text>
<text class="s" x="265" y="190" text-anchor="middle">SCL</text><text class="s" x="305" y="190" text-anchor="middle">SDA</text>

<line class="p" x1="320" y1="130" x2="360" y2="130"/>
<rect class="box" x="360" y="104" width="80" height="150" rx="6"/>
