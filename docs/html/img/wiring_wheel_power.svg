<text class="h" x="80" y="235" text-anchor="end">−</text>
<line class="p" x1="86" y1="130" x2="100" y2="130"/>
<circle cx="100" cy="130" r="3" fill="#D55E00"/><circle cx="126" cy="130" r="3" fill="#D55E00"/>
