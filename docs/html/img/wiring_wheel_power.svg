<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" role="img">
<title>Колесо 1: питание целиком — катушка и шина, оба тока меряет агент катушки №13</title>
<desc>Два контура со своими аккумуляторами 2×18650. Контур катушки: плюс через выключатель на VIN+ модуля INA219 с адресом 0x40, с VIN− на IN+ DC-DC 5,1 В; с DC-DC — VM моста DRV8871, конденсатор 470 мкФ и через 1N5819 вывод 5V агента катушки №13; D0 и D1 №13 — IN1 и IN2 моста, OUT1 и OUT2 — катушка. Контур шины: плюс через выключатель на VIN+ модуля INA219 с адресом 0x40, с VIN− на IN+ DC-DC 5,1 В, с DC-DC — шина 5,1 В к шести агентам колеса, C1 470 мкФ. Каждый модуль — на своих выводах I2C №13: модуль катушки — D4 на SDA, D5 на SCL; модуль шины — D8 на SDA, D9 на SCL (вторая шина I2C агента); 3V3 на VCC и GND на GND — к обоим. GND модуля катушки — на минус катушки, GND модуля шины — на минус шины: это единственная связь минусов двух контуров. Шину №13 не переключает, только меряет.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2228}
.h{font-size:15px;font-weight:600}.t{font-size:13px}.s{font-size:12px;fill:#4a535e}.c{font-size:11px;font-weight:600;fill:#4a535e;letter-spacing:.08em}
.box{fill:#fff;stroke:#1d2228;stroke-width:1.3}
.p{stroke:#D55E00;stroke-width:2.6;fill:none}.m{stroke:#1d2228;stroke-width:2;fill:none}
.pl{stroke:#1d2228;stroke-width:2.6;fill:none}.d{fill:none;stroke:#1d2228;stroke-width:1.6}
.sig{stroke:#0072B2;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
.v3{stroke:#CC79A7;stroke-width:2;fill:none}
.in{stroke:#4a535e;stroke-width:1.4;fill:none}
</style>
<rect width="900" height="830" fill="#ffffff"/>
<text class="h" x="16" y="28">Колесо 1: питание целиком — катушка и шина, оба тока меряет агент катушки №13</text>
<text class="s" x="16" y="48">Два контура со своими аккумуляторами. №13 ведёт катушку (D0/D1 → мост) и читает оба INA219, каждый на своих выводах:</text>
<text class="s" x="16" y="64">катушка — D4/D5, шина — D8/D9; адрес у обоих 0x40. Шину №13 не включает и не выключает — только меряет.</text>

