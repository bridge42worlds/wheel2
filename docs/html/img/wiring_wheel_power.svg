<circle cx="480" cy="130" r="3.5" fill="#D55E00"/><circle cx="480" cy="230" r="3.5" fill="#1d2228"/>

<line class="p" x1="600" y1="130" x2="600" y2="268"/>
<circle cx="600" cy="130" r="3.5" fill="#D55E00"/>
<polygon class="d" points="590,268 610,268 600,286"/>
<line class="pl" x1="589" y1="287" x2="611" y2="287" style="stroke-width:3.6"/>
<path class="p" d="M600 288 V320 H560"/>
<text class="s" x="584" y="268" text-anchor="end">1N5819,</text>
<text class="s" x="584" y="284" text-anchor="end">полоска к №13</text>

<!-- №13 -->
<rect class="box" x="360" y="300" width="200" height="112" rx="6"/>
