<line class="sig" x1="360" y1="340" x2="265" y2="340"/>
<line class="m" x1="360" y1="362" x2="225" y2="362"/><circle cx="225" cy="362" r="3.5" fill="#1d2228"/>
<line class="v3" x1="360" y1="384" x2="185" y2="384"/><circle cx="185" cy="384" r="3.5" fill="#CC79A7"/>
<text class="s" x="20" y="284">модуль катушки:</text>
<text class="s" x="20" y="300">D4 → SDA, D5 → SCL;</text>
<text class="s" x="20" y="316">3V3 и GND — к обоим</text>
<text class="s" x="20" y="332">модулям, до 30 см</text>

<text class="s" x="506" y="430">модуль шины: D8 → SDA, D9 → SCL —</text>
<text class="s" x="506" y="446">своя шина I²C агента, адрес тот же 0x40</text>

<!-- связь минусов -->
<path class="m" d="M225 430 H145 V600"/>
<circle cx="225" cy="430" r="3.5" fill="#1d2228"/>
<text class="s" x="16" y="404">минусы контуров —</text>
<text class="s" x="16" y="420">вместе только здесь</text>

<!-- ===== контур шины ===== -->
<text class="c" x="16" y="452">КОНТУР ШИНЫ</text>
<rect class="box" x="16" y="464" width="70" height="160" rx="6"/>
<text class="h" x="51" y="540" text-anchor="middle">2×18650</text>
<text class="s" x="51" y="558" text-anchor="middle">шина</text>
<text class="h" x="80" y="495" text-anchor="end">+</text>
<text class="h" x="80" y="605" text-anchor="end">−</text>
<line class="p" x1="86" y1="490" x2="96" y2="490"/>
<circle cx="96" cy="490" r="3" fill="#D55E00"/><circle cx="120" cy="490" r="3" fill="#D55E00"/>
<line class="p" x1="96" y1="490" x2="117" y2="477"/>
<line class="p" x1="120" y1="490" x2="170" y2="490"/>

<rect class="box" x="170" y="450" width="150" height="110" rx="6"/>
<text class="s" x="185" y="466" text-anchor="middle">VCC</text><text class="s" x="225" y="466" text-anchor="middle">GND</text>
<text class="s" x="265" y="466" text-anchor="middle">SCL</text><text class="s" x="305" y="466" text-anchor="middle">SDA</text>
<text class="s" x="176" y="484">VIN+</text><text class="s" x="314" y="484" text-anchor="end">VIN−</text>
<line class="in" x1="170" y1="490" x2="222" y2="490"/>
<rect x="222" y="484" width="46" height="12" fill="#ffffff" stroke="#4a535e" stroke-width="1.4"/>
<line class="in" x1="268" y1="490" x2="320" y2="490"/>
<text class="s" x="245" y="512" text-anchor="middle">шунт 0,1 Ом</text>
<text class="t" x="245" y="530" text-anchor="middle" style="font-weight:600">INA219 · 0x40</text>
<text class="s" x="245" y="548" text-anchor="middle">перемычки не паять</text>

<line class="p" x1="320" y1="490" x2="360" y2="490"/>
<rect class="box" x="360" y="464" width="80" height="160" rx="6"/>
<text class="h" x="400" y="540" text-anchor="middle">DC-DC</text>
<text class="s" x="400" y="558" text-anchor="middle">5,1 В</text>
<text class="s" x="366" y="486">IN+</text><text class="s" x="366" y="596">IN−</text>
<text class="s" x="434" y="486" text-anchor="end">OUT+</text><text class="s" x="434" y="596" text-anchor="end">OUT−</text>
<line class="m" x1="86" y1="600" x2="360" y2="600"/>
<circle cx="145" cy="600" r="3.5" fill="#1d2228"/>

<line class="p" x1="440" y1="490" x2="884" y2="490"/>
<line class="m" x1="440" y1="600" x2="884" y2="600"/>
<text class="s" x="884" y="480" text-anchor="end">шина + 5,1 В</text>
<text class="s" x="884" y="618" text-anchor="end">шина −</text>

<line class="p" x1="480" y1="490" x2="480" y2="532"/>
<line class="pl" x1="468" y1="532" x2="492" y2="532"/>
<path class="pl" d="M468 545 Q480 538 492 545"/>
<line class="m" x1="480" y1="542" x2="480" y2="600"/>
<text class="h" x="496" y="528">+</text><text class="s" x="496" y="570">C1 470 мкФ</text>
<circle cx="480" cy="490" r="3.5" fill="#D55E00"/><circle cx="480" cy="600" r="3.5" fill="#1d2228"/>

<rect class="box" x="580" y="515" width="290" height="62" rx="6"/>
<line class="p" x1="620" y1="490" x2="620" y2="515"/><circle cx="620" cy="490" r="3.5" fill="#D55E00"/>
<line class="m" x1="840" y1="577" x2="840" y2="600"/><circle cx="840" cy="600" r="3.5" fill="#1d2228"/>
<text class="t" x="725" y="538" text-anchor="middle" style="font-weight:600">агенты №6, №11, №3, №5, №12, №20</text>
<text class="s" x="725" y="556" text-anchor="middle">у каждого: + шины → 1N5819 → 5V,</text>
<text class="s" x="725" y="571" text-anchor="middle">GND → − шины; C2, C3 — по шине</text>

<!-- пояснения -->
<text class="t" x="16" y="660">Модуль катушки — на D4 (SDA), D5 (SCL); модуль шины — на свои D8 (SDA), D9 (SCL): у агента две шины I²C.</text>
<text class="t" x="16" y="680">3V3 и GND у XIAO по одному выводу — к обоим модулям, два провода в вывод. Адрес у обоих 0x40, перемычки не паять.</text>
<text class="t" x="16" y="700">GND модуля шины — на минус шины: только так мерится напряжение шины. Это единственная связь минусов</text>
<text class="t" x="16" y="718">двух контуров — больше нигде их не соединять.</text>
<text class="t" x="16" y="738">Модули — рядом с №13 и аккумуляторами, провода I²C до 30 см. Силовые провода VIN+ / VIN− — в клеммы модулей, 18 AWG.</text>
<text class="t" x="16" y="758">У XIAO (USB сверху): D4, D5 — пятый и шестой слева; GND, 3V3 — второй и третий справа; D9, D8 — пятый и шестой справа.</text>

<line class="p" x1="16" y1="802" x2="52" y2="802"/><text class="s" x="60" y="806">плюс</text>
<line class="m" x1="110" y1="802" x2="146" y2="802"/><text class="s" x="154" y="806">минус</text>
<line class="sig" x1="210" y1="802" x2="246" y2="802"/><text class="s" x="254" y="806">сигналы (I²C, D0/D1)</text>
<line class="v3" x1="400" y1="802" x2="436" y2="802"/><text class="s" x="444" y="806">3,3 В модулям</text>
<circle cx="560" cy="802" r="3.5" fill="#1d2228"/><text class="s" x="570" y="806">точка — провода соединены; без точки — пересекаются</text>
</svg>
