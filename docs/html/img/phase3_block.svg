<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img">
<title>Фаза 3. Один блок: агент и два датчика на шине 3,3 В</title>
<desc>Шина плюс 3,3 В и GND. Три двухпроводных тройника: от первого пара питания идёт на датчик 1 (VIN, GND), от второго на агента (3V3, GND), от третьего на датчик 2. Пара данных датчика 1: SDA на D4, SCL на D5 агента. Пара данных датчика 2: SDA на D8, SCL на D9.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2228}
.h{font-size:15px;font-weight:600}.t{font-size:13px}.s{font-size:12px;fill:#4a535e}
.box{fill:#fff;stroke:#1d2228;stroke-width:1.3}
.p{stroke:#D55E00;stroke-width:2.6;fill:none}.m{stroke:#1d2228;stroke-width:2;fill:none}
.sig{stroke:#0072B2;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
</style>
<rect width="980" height="470" fill="#ffffff"/>
<text class="h" x="20" y="28">Фаза 3. Один блок: агент и два датчика, каждый питается от шины своим отводом</text>
<line class="p" x1="40" y1="72" x2="940" y2="72"/>
<line class="m" x1="40" y1="86" x2="940" y2="86"/>
<text class="s" x="40" y="60">шина: плюс 3,3 В</text>
<text class="s" x="40" y="106">шина: GND</text>
<g>
<rect class="box" x="166" y="58" width="48" height="42" rx="4"/><text class="t" x="190" y="84" text-anchor="middle">T2</text>
<rect class="box" x="466" y="58" width="48" height="42" rx="4"/><text class="t" x="490" y="84" text-anchor="middle">T2</text>
<rect class="box" x="766" y="58" width="48" height="42" rx="4"/><text class="t" x="790" y="84" text-anchor="middle">T2</text>
</g>
<g>
<line class="p" x1="184" y1="100" x2="184" y2="190"/><line class="m" x1="196" y1="100" x2="196" y2="190"/>
<line class="p" x1="484" y1="100" x2="484" y2="190"/><line class="m" x1="496" y1="100" x2="496" y2="190"/>
<line class="p" x1="784" y1="100" x2="784" y2="190"/><line class="m" x1="796" y1="100" x2="796" y2="190"/>
</g>
<text class="s" x="210" y="150">пара питания, 22 AWG</text>
<text class="s" x="510" y="150">пара питания, 22 AWG</text>
<text class="s" x="810" y="150">пара питания</text>
<rect class="box" x="80" y="190" width="220" height="140" rx="6"/>
<text class="s" x="178" y="208" text-anchor="end">VIN</text><text class="s" x="202" y="208">GND</text>
<text class="h" x="190" y="256" text-anchor="middle">Датчик 1</text>
<text class="s" x="190" y="276" text-anchor="middle">ICM-20948</text>
<text class="s" x="178" y="322" text-anchor="end">SDA</text><text class="s" x="202" y="322">SCL</text>
<rect class="box" x="380" y="190" width="220" height="140" rx="6"/>
<text class="s" x="478" y="208" text-anchor="end">3V3</text><text class="s" x="502" y="208">GND</text>
