<line class="sig" x1="310" y1="446" x2="350" y2="446"/><text class="s" x="358" y="450">данные I2C (штриховая)</text>
<rect class="box" x="540" y="436" width="24" height="20" rx="3"/><text class="s" x="572" y="450">T2 — тройник на два провода, зажимает плюс и GND сразу</text>
