<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img">
<title>Фаза 3. Что делает агент: от окна датчика до чтения сервером</title>
<desc>Восемь шагов: ожидание с опросом датчика; вход в зону — сброс буфера датчика и тишина; ожидание окна; чтение буфера и магнитометра; хеш и проверка чисел; запись находок в таблицу; залп по общей метке времени в три такта; чтение сервером после баланса.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2228}
.h{font-size:15px;font-weight:600}.t{font-size:13px}.s{font-size:12px;fill:#4a535e}
.box{fill:#fff;stroke:#1d2228;stroke-width:1.3}
.rbox{fill:#f7d9c4;stroke:#D55E00;stroke-width:1.6}
.a{stroke:#1d2228;stroke-width:1.6;fill:none}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2228"/></marker></defs>
<rect width="980" height="330" fill="#ffffff"/>
<text class="h" x="20" y="28">Фаза 3. Что делает агент: шаги 1–6 повторяются для каждого окна, 7–8 — раз в цикл</text>
<rect class="box" x="30" y="56" width="200" height="70" rx="6"/><text class="h" x="130" y="84" text-anchor="middle">1. Ожидание</text><text class="s" x="130" y="106" text-anchor="middle">опрашивает датчик сам</text>
<rect class="box" x="270" y="56" width="200" height="70" rx="6"/><text class="h" x="370" y="84" text-anchor="middle">2. Вход в зону</text><text class="s" x="370" y="106" text-anchor="middle">сброс буфера, тишина на шине</text>
<rect class="box" x="510" y="56" width="200" height="70" rx="6"/><text class="h" x="610" y="84" text-anchor="middle">3. Окно</text><text class="s" x="610" y="106" text-anchor="middle">ждёт: ширина ÷ скорость</text>
<rect class="box" x="750" y="56" width="200" height="70" rx="6"/><text class="h" x="850" y="84" text-anchor="middle">4. Чтение</text><text class="s" x="850" y="106" text-anchor="middle">буфер датчика и магнитометр</text>
<line class="a" x1="230" y1="91" x2="268" y2="91" marker-end="url(#ar)"/>
<line class="a" x1="470" y1="91" x2="508" y2="91" marker-end="url(#ar)"/>
<line class="a" x1="710" y1="91" x2="748" y2="91" marker-end="url(#ar)"/>
<path class="a" d="M850 126 V158 H130 V188" marker-end="url(#ar)"/>
<rect class="box" x="30" y="190" width="200" height="70" rx="6"/><text class="h" x="130" y="218" text-anchor="middle">5. Проверка</text><text class="s" x="130" y="240" text-anchor="middle">хеш, отсев, Миллер — Рабин</text>
<rect class="box" x="270" y="190" width="200" height="70" rx="6"/><text class="h" x="370" y="218" text-anchor="middle">6. Таблица</text><text class="s" x="370" y="240" text-anchor="middle">число, датчик, время, угол</text>
<rect class="rbox" x="510" y="190" width="200" height="70" rx="6"/><text class="h" x="610" y="218" text-anchor="middle">7. Залп по метке</text><text class="s" x="610" y="240" text-anchor="middle">находки, таблица, сверка</text>
<rect class="box" x="750" y="190" width="200" height="70" rx="6"/><text class="h" x="850" y="218" text-anchor="middle">8. Сервер</text><text class="s" x="850" y="240" text-anchor="middle">только после баланса</text>
<line class="a" x1="230" y1="225" x2="268" y2="225" marker-end="url(#ar)"/>
<line class="a" x1="470" y1="225" x2="508" y2="225" marker-end="url(#ar)"/>
<line class="a" x1="710" y1="225" x2="748" y2="225" marker-end="url(#ar)"/>
<text class="s" x="20" y="292">Радио работает только на шагах 7 и 8 (закрашенный шаг — эфир между платами). На шагах 1–6 плата ничего не передаёт.</text>
<text class="s" x="20" y="312">Общую метку времени раздаёт агент моторов на раме в конце каждого залпа.</text>
</svg>
