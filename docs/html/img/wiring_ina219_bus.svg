<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" role="img">
<title>Колесо 1: INA219 в шине агентов — читает №6</title>
<desc>Плюс аккумуляторов 2×18650 через выключатель приходит на VIN+ модуля INA219, через шунт 0,1 Ом выходит с VIN− на IN+ DC-DC 5,1 В. Минус аккумуляторов идёт на IN− DC-DC, к нему же GND модуля. С DC-DC — шина 5,1 В к агентам; C1 470 мкФ плюсом к шине. Агент №6 питается от шины через 1N5819 (полоской к агенту), его GND — на минус шины. От №6 к модулю три провода: 3V3 на VCC, D5 на SCL, D4 на SDA; на тех же D4 и D5 у №6 уже стоит ICM-42688 с адресом 0x68, у INA219 — 0x40. Ниже — вид модуля сверху: винтовая клемма VIN+ и VIN−, шунт R100, перемычки A0 и A1 не паять, гребёнка VCC, GND, SCL, SDA, VIN−, VIN+.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2228}
.h{font-size:15px;font-weight:600}.t{font-size:13px}.s{font-size:12px;fill:#4a535e}
.box{fill:#fff;stroke:#1d2228;stroke-width:1.3}
.p{stroke:#D55E00;stroke-width:2.6;fill:none}.m{stroke:#1d2228;stroke-width:2;fill:none}
.pl{stroke:#1d2228;stroke-width:2.6;fill:none}.d{fill:none;stroke:#1d2228;stroke-width:1.6}
.sig{stroke:#0072B2;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
.v3{stroke:#CC79A7;stroke-width:2;fill:none}
.in{stroke:#4a535e;stroke-width:1.4;fill:none}
.pcb{fill:#eef3ee;stroke:#1d2228;stroke-width:1.3}
</style>
<rect width="760" height="700" fill="#ffffff"/>
<text class="h" x="16" y="28">Колесо 1: INA219 в шине агентов — читает №6</text>
<text class="s" x="16" y="48">Весь ток шины идёт через шунт модуля: аккумуляторы → выключатель → INA219 → DC-DC → шина. Модуль — до DC-DC.</text>

<!-- аккумуляторы -->
<rect class="box" x="16" y="96" width="70" height="150" rx="6"/>
<text class="h" x="51" y="166" text-anchor="middle">2×18650</text>
<text class="s" x="51" y="186" text-anchor="middle">7,4 В</text>
<text class="h" x="80" y="129" text-anchor="end">+</text>
<text class="h" x="80" y="233" text-anchor="end">−</text>

<!-- выключатель -->
<line class="p" x1="86" y1="124" x2="100" y2="124"/>
<circle cx="100" cy="124" r="3" fill="#D55E00"/><circle cx="126" cy="124" r="3" fill="#D55E00"/>
<line class="p" x1="100" y1="124" x2="123" y2="111"/>
<line class="p" x1="126" y1="124" x2="160" y2="124"/>
<text class="s" x="113" y="84" text-anchor="middle">выключатель</text>

<!-- INA219 -->
<rect class="box" x="160" y="84" width="180" height="104" rx="6"/>
<text class="s" x="166" y="114">VIN+</text>
<text class="s" x="334" y="114" text-anchor="end">VIN−</text>
<line class="in" x1="160" y1="124" x2="222" y2="124"/>
<rect x="222" y="118" width="56" height="12" fill="#ffffff" stroke="#4a535e" stroke-width="1.4"/>
<line class="in" x1="278" y1="124" x2="340" y2="124"/>
<text class="s" x="250" y="146" text-anchor="middle">шунт 0,1 Ом (R100)</text>
<text class="h" x="250" y="166" text-anchor="middle">INA219 · 0x40</text>
<text class="s" x="185" y="182" text-anchor="middle">VCC</text>
<text class="s" x="225" y="182" text-anchor="middle">GND</text>
<text class="s" x="265" y="182" text-anchor="middle">SCL</text>
<text class="s" x="305" y="182" text-anchor="middle">SDA</text>

<!-- силовой провод к DC-DC -->
<line class="p" x1="340" y1="124" x2="400" y2="124"/>
<text class="s" x="370" y="114" text-anchor="middle">18 AWG</text>

<!-- DC-DC -->
<rect class="box" x="400" y="96" width="90" height="150" rx="6"/>
<text class="h" x="445" y="166" text-anchor="middle">DC-DC</text>
<text class="s" x="445" y="186" text-anchor="middle">5,1 В</text>
<text class="s" x="406" y="120">IN+</text><text class="s" x="406" y="224">IN−</text>
<text class="s" x="484" y="120" text-anchor="end">OUT+</text><text class="s" x="484" y="224" text-anchor="end">OUT−</text>

<!-- минус аккумуляторов и GND модуля -->
<line class="m" x1="86" y1="228" x2="400" y2="228"/>
<line class="m" x1="225" y1="188" x2="225" y2="228"/>
<circle cx="225" cy="228" r="3.5" fill="#1d2228"/>

<!-- три провода к №6 -->
<line class="v3" x1="185" y1="188" x2="185" y2="300"/>
<line class="sig" x1="265" y1="188" x2="265" y2="300"/>
<line class="sig" x1="305" y1="188" x2="305" y2="300"/>
<text class="s" x="20" y="266">три провода к №6,</text>
<text class="s" x="20" y="282">10–30 см, скрутить</text>

<!-- агент №6 -->
<rect class="box" x="160" y="300" width="220" height="110" rx="6"/>
<text class="s" x="185" y="316" text-anchor="middle">3V3</text>
<text class="s" x="265" y="316" text-anchor="middle">D5</text>
<text class="s" x="305" y="316" text-anchor="middle">D4</text>
<text class="h" x="262" y="346" text-anchor="middle">XIAO ESP32-S3 · №6</text>
<text class="s" x="262" y="368" text-anchor="middle">на D4/D5 уже ICM-42688 (0x68)</text>
<text class="s" x="262" y="386" text-anchor="middle">INA219 — на те же выводы</text>
<text class="s" x="374" y="338" text-anchor="end">5V</text>
<text class="s" x="374" y="396" text-anchor="end">GND</text>

<!-- шина -->
<line class="p" x1="490" y1="124" x2="744" y2="124"/>
<line class="m" x1="490" y1="228" x2="744" y2="228"/>
<text class="s" x="744" y="112" text-anchor="end">шина + 5,1 В → №11, №3, №5, №12, №20</text>
<text class="s" x="744" y="216" text-anchor="end">шина − → те же агенты</text>

<!-- C1 -->
<line class="p" x1="530" y1="124" x2="530" y2="166"/>
<line class="pl" x1="518" y1="166" x2="542" y2="166"/>
<path class="pl" d="M518 179 Q530 172 542 179"/>
<line class="m" x1="530" y1="176" x2="530" y2="228"/>
<text class="h" x="546" y="162">+</text>
<text class="s" x="530" y="248" text-anchor="middle">C1 470 мкФ</text>
<circle cx="530" cy="124" r="3.5" fill="#D55E00"/><circle cx="530" cy="228" r="3.5" fill="#1d2228"/>

<!-- питание №6: диод -->
<line class="p" x1="600" y1="124" x2="600" y2="268"/>
<circle cx="600" cy="124" r="3.5" fill="#D55E00"/>
<polygon class="d" points="590,268 610,268 600,286"/>
<line class="pl" x1="589" y1="287" x2="611" y2="287" style="stroke-width:3.6"/>
<path class="p" d="M600 288 V334 H380"/>
<text class="s" x="584" y="278" text-anchor="end">1N5819,</text>
<text class="s" x="584" y="294" text-anchor="end">полоска к №6</text>
<path class="m" d="M380 392 H660 V228"/>
<circle cx="660" cy="228" r="3.5" fill="#1d2228"/>

<!-- модуль сверху -->
<text class="h" x="16" y="448">Модуль INA219 сверху</text>
<text class="s" x="190" y="448">(подписи сверьте со своим модулем)</text>
<rect class="pcb" x="16" y="462" width="250" height="110" rx="4"/>
<rect x="40" y="470" width="120" height="34" rx="3" fill="#dfe7f0" stroke="#1d2228" stroke-width="1.2"/>
<circle cx="72" cy="487" r="9" fill="#ffffff" stroke="#1d2228" stroke-width="1.2"/>
<line x1="67" y1="492" x2="77" y2="482" stroke="#1d2228" stroke-width="1.6"/>
<circle cx="128" cy="487" r="9" fill="#ffffff" stroke="#1d2228" stroke-width="1.2"/>
<line x1="123" y1="492" x2="133" y2="482" stroke="#1d2228" stroke-width="1.6"/>
<text class="t" x="72" y="522" text-anchor="middle">VIN+</text>
<text class="t" x="128" y="522" text-anchor="middle">VIN−</text>
<rect x="184" y="474" width="52" height="18" fill="#ffffff" stroke="#1d2228" stroke-width="1.2"/>
<text class="s" x="210" y="487" text-anchor="middle">R100</text>
<text class="s" x="210" y="508" text-anchor="middle">шунт</text>
<rect x="190" y="518" width="12" height="8" fill="#ffffff" stroke="#1d2228" stroke-width="1"/>
<rect x="218" y="518" width="12" height="8" fill="#ffffff" stroke="#1d2228" stroke-width="1"/>
<text class="s" x="196" y="538" text-anchor="middle">A0</text><text class="s" x="224" y="538" text-anchor="middle">A1</text>
<g fill="#ffffff" stroke="#1d2228" stroke-width="1.2">
<circle cx="38" cy="558" r="5"/><circle cx="76" cy="558" r="5"/><circle cx="114" cy="558" r="5"/>
<circle cx="152" cy="558" r="5"/><circle cx="190" cy="558" r="5"/><circle cx="228" cy="558" r="5"/>
</g>
<text class="s" x="38" y="588" text-anchor="middle">VCC</text><text class="s" x="76" y="588" text-anchor="middle">GND</text>
<text class="s" x="114" y="588" text-anchor="middle">SCL</text><text class="s" x="152" y="588" text-anchor="middle">SDA</text>
<text class="s" x="190" y="588" text-anchor="middle">VIN−</text><text class="s" x="228" y="588" text-anchor="middle">VIN+</text>

<text class="t" x="290" y="478">Силовые провода (18 AWG) — в винтовую клемму:</text>
<text class="t" x="290" y="496">VIN+ — от выключателя, VIN− — к IN+ DC-DC.</text>
<text class="t" x="290" y="520">VIN+ и VIN− на гребёнке — те же контакты:</text>
<text class="t" x="290" y="538">ток шины через гребёнку не вести.</text>
<text class="t" x="290" y="562">С гребёнки к №6 — VCC, SCL, SDA; GND модуля —</text>
<text class="t" x="290" y="580">на минус аккумуляторов рядом с модулем.</text>

<text class="s" x="16" y="616">VCC модуля — от 3V3 агента, не от 5 В. Перемычки A0 и A1 не паять: адрес 0x40, ICM-42688 — 0x68, друг другу не мешают.</text>
<text class="s" x="16" y="634">Минус аккумуляторов, IN− и OUT− DC-DC и минус шины — одна цепь: у DC-DC вход и выход минус общий.</text>
<text class="s" x="16" y="652">VIN+ и VIN− наоборот — ток покажет с минусом, модуль не пострадает. Колесо 2 — так же: шину читает первый агент на шине.</text>

<line class="p" x1="16" y1="680" x2="52" y2="680"/><text class="s" x="60" y="684">плюс</text>
<line class="m" x1="110" y1="680" x2="146" y2="680"/><text class="s" x="154" y="684">минус</text>
<line class="sig" x1="210" y1="680" x2="246" y2="680"/><text class="s" x="254" y="684">I²C (SDA, SCL)</text>
<line class="v3" x1="364" y1="680" x2="400" y2="680"/><text class="s" x="408" y="684">3,3 В модулю</text>
<circle cx="510" cy="680" r="3.5" fill="#1d2228"/><text class="s" x="520" y="684">точка — провода соединены</text>
</svg>
