<line class="fl" x1="250" y1="644" x2="288" y2="644" marker-end="url(#ar)"/><text class="k" x="269" y="636" text-anchor="middle">нет</text>
<line class="fl" x1="140" y1="676" x2="140" y2="702" marker-end="url(#ar)"/><text class="k" x="150" y="694">да</text>
<rect class="nb" x="290" y="612" width="300" height="64" rx="4" style="stroke:#1d2228;stroke-width:1.3"/>
<text class="k b" x="440" y="632" text-anchor="middle">отклонение без известной причины</text>
