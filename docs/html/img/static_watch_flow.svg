<text class="s" x="30" y="782">в программе: опыт испорчен,</text>
<text class="s" x="30" y="797">повторяется сразу (до redo раз)</text>
<text class="s" x="290" y="782">в программе: ❗︎ тревога, звук и окно;</text>
<text class="s" x="290" y="797">по желанию — повтор опыта (again)</text>
<text class="s" x="630" y="782">толчок сразу у 2 и больше датчиков —</text>
<text class="s" x="630" y="797">помеха снаружи: шаги, дверь, здание</text>
