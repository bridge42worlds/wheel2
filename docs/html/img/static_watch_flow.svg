<text class="k" x="356" y="436">больше чем на 5 мg</text>
<text class="k" x="566" y="322">квантование: доли кратных</text>
<text class="k" x="566" y="339">ушли на 6 или все значения</text>
<text class="k" x="566" y="356">кратны крупному шагу</text>
<text class="k" x="566" y="379">значения не меняются —</text>
<text class="k" x="566" y="396">датчик завис?</text>
<text class="k" x="566" y="419">пропуск отсчётов, зашкал,</text>
<text class="k" x="566" y="436">смена режима датчика</text>
<text class="k" x="776" y="322">линия: бин выше эталона</text>
<text class="k" x="776" y="339">на 6 разбросов</text>
<text class="k" x="776" y="356">линия эталона пропала</text>
<text class="k" x="776" y="379">полоса: широкий шум</text>
<text class="k" x="776" y="396">октавы ушёл на 5</text>
<text class="k" x="776" y="419">форма шума: асимметрия</text>
<text class="k" x="776" y="436">или эксцесс ушли на 5</text>
<text class="s" x="352" y="460">в окне с толчком спектр и форма шума не сравниваются — они от толчка</text>

