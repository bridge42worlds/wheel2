<rect class="nb" x="16" y="486" width="300" height="64" rx="6"/>
<text class="s" x="28" y="506">сразу оценка: шум, мкg/√Гц на 10–100 Гц;</text>
<text class="s" x="28" y="523">гауссов ли шум; ровный ли фон; мелкое ли</text>
