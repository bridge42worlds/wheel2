<text class="k" x="356" y="339">в 4 раза выше обычного</text>
<text class="k" x="356" y="356">или выброс в 8 разбросов</text>
<text class="k" x="356" y="379">выбросы почти каждую</text>
<text class="k" x="356" y="396">секунду — импульсная помеха</text>
