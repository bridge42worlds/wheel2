<text class="k b" x="440" y="666" text-anchor="middle">за весь отрезок (средние окон)?</text>
<line class="fl" x1="590" y1="644" x2="628" y2="644" marker-end="url(#ar)"/><text class="k" x="609" y="636" text-anchor="middle">нет</text>
<line class="fl" x1="440" y1="676" x2="440" y2="702" marker-end="url(#ar)"/><text class="k" x="450" y="694">да</text>
<rect class="nb" x="630" y="612" width="160" height="64" rx="4" style="stroke:#1d2228;stroke-width:1.3"/>
<text class="k b" x="710" y="638" text-anchor="middle">эталон есть</text>
<text class="k b" x="710" y="655" text-anchor="middle">для этого режима?</text>
<line class="fl" x1="790" y1="644" x2="818" y2="644" marker-end="url(#ar)"/><text class="k" x="804" y="636" text-anchor="middle">нет</text>
<line class="fl" x1="710" y1="676" x2="710" y2="702" marker-end="url(#ar)"/><text class="k" x="720" y="694">да</text>
<rect class="nob" x="820" y="612" width="150" height="64" rx="4"/>
<text class="t b" x="895" y="634" text-anchor="middle">◌ нет эталона</text>
<text class="s" x="895" y="651" text-anchor="middle">сравнивать не с чем;</text>
<text class="s" x="895" y="667" text-anchor="middle">толчки, пропуски видны</text>
