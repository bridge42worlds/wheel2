<rect class="rep" x="562" y="276" width="198" height="26" rx="4"/><text class="k b" x="661" y="294" text-anchor="middle">↻ прибор</text>
<rect class="chk" x="772" y="276" width="198" height="26" rx="4"/><text class="k b" x="871" y="294" text-anchor="middle">⚠︎ отклонение</text>
