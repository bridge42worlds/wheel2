<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 812" width="1000" height="812" role="img">
<title>Статика: каждое окно 10 с против эталона шума</title>
<desc>Датчик роли S (ICM-42688 или ADXL355) меряет 1000 раз в секунду, усредняет по два отсчёта и шлёт оси x, y, z 500 раз в секунду пакетами по 140 отсчётов со сквозными номерами, поэтому пропуск виден сразу. Сервер режет поток на окна по 10 с: 5000 отсчётов на ось и десять секунд со средним, разбросом и крайними значениями. По каждому окну и оси считается спектр Уэлча (8 отрезков по 1024 отсчёта, 2 с, шаг частоты 0,49 Гц, окно Ханна, перекрытие наполовину), мощность в октавах от 1–2 до 128–250 Гц, форма шума (асимметрия и эксцесс), квантование (доли значений, кратных 2, 4 … 256), среднее, а по секундам — разброс и выбросы. Эталон шума — те же показатели за 1–120 минут (кнопки 1, 3, 5 мин), пока основные группы стоят, только из чистых окон, не меньше шести: среднее и разброс в каждом бине спектра, уровни полос, форма шума, доли кратных, среднее и обычный разброс секунды; привязан к режиму датчика. Сразу оценивается: шум в мкg/√Гц на 10–100 Гц, гауссов ли шум, ровный ли фон, мелкое ли квантование, стояли ли группы. Каждое окно сравнивается с эталоном, найденное делится на три класса. Помеха: толчок — разброс секунды в 4 раза выше обычного или выброс в 8 обычных разбросов; выбросы почти каждую секунду — импульсная помеха; сдвиг — среднее ушло больше чем на 5 мg. Прибор: квантование ушло на 6 разбросов или все значения кратны крупному шагу; значения не меняются; пропуск отсчётов, зашкал, смена режима датчика. Отклонение: линия — бин спектра выше эталона на 6 разбросов; линия эталона пропала; полоса — широкий шум октавы ушёл на 5 разбросов; форма шума ушла на 5. Линия у известной частоты (сеть 50 Гц и гармоники, маяки роутера 102,4 мс, пинг CSI работающих агентов, телеметрия, пакеты отсчётов, обороты колеса; выше половины частоты отсчётов — с заворотом) помечается и тревогой не считается. Вывод по отрезку — опыту программы, сессии или последним двум минутам: есть помеха или сбой прибора — повторить (в программе опыт испорчен и повторяется сразу); иначе отклонение без известной причины держится два окна подряд или видно за весь отрезок по средним окон — проверить (в программе тревога и повтор опыта); иначе есть эталон для этого режима — продолжать; эталона нет — нет эталона, сравнивать не с чем. Обозначения: красная пунктирная рамка и знак ↻ — повторить, оранжевая толстая рамка и знак ⚠ — проверить, зелёная рамка и знак ✓ — продолжать, серая точечная рамка и знак ◌ — нет эталона, синяя штриховая рамка и знак ◐ — известные источники.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2228"/></marker>
</defs>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2228}
.h{font-size:15px;font-weight:600}.t{font-size:13px}.s{font-size:12px;fill:#4a535e}.k{font-size:12px}.b{font-weight:600}
.box{fill:#fff;stroke:#1d2228;stroke-width:1.3}.nb{fill:#fff;stroke:#4a535e;stroke-width:1}
.rep{fill:#fff;stroke:#D55E00;stroke-width:2;stroke-dasharray:6 4}
.chk{fill:#fff;stroke:#E69F00;stroke-width:3.2}
.ok{fill:#fff;stroke:#009E73;stroke-width:2.2}
.nob{fill:#fff;stroke:#4a535e;stroke-width:1.6;stroke-dasharray:2 3}
.kn{fill:#fff;stroke:#0072B2;stroke-width:1.6;stroke-dasharray:8 3 2 3}
.fl{stroke:#1d2228;stroke-width:1.6;fill:none}
</style>
<rect width="1000" height="812" fill="#ffffff"/>
<text class="h" x="16" y="28">Статика: каждое окно 10 с против эталона шума</text>
<text class="s" x="16" y="48">Датчик роли S только меряет и шлёт оси; спектр, эталон, тревоги и вывод считает сервер (server/static_watch.py).</text>

<!-- датчик, окно, показатели -->
<rect class="box" x="16" y="66" width="206" height="150" rx="6"/>
<text class="t b" x="28" y="88">◆ датчик роли S</text>
<text class="k" x="28" y="110">ICM-42688 или ADXL355</text>
<text class="k" x="28" y="127">1000 Гц, среднее по 2 →</text>
<text class="k" x="28" y="144">500 Гц, оси x, y, z</text>
<text class="s" x="28" y="164">пакеты по 140 отсчётов,</text>
<text class="s" x="28" y="181">номера сквозные:</text>
<text class="s" x="28" y="198">пропуск виден сразу</text>
<line class="fl" x1="222" y1="140" x2="240" y2="140" marker-end="url(#ar)"/>
<rect class="box" x="242" y="66" width="168" height="150" rx="6"/>
<text class="t b" x="254" y="88">окно 10 с</text>
<text class="k" x="254" y="110">5000 отсчётов</text>
<text class="k" x="254" y="127">на каждую ось</text>
<text class="s" x="254" y="147">и по каждой из 10 секунд:</text>
<text class="s" x="254" y="164">среднее, разброс,</text>
<text class="s" x="254" y="181">крайние значения —</text>
<text class="s" x="254" y="198">графики и толчки</text>
<line class="fl" x1="410" y1="140" x2="432" y2="140" marker-end="url(#ar)"/>
<rect class="box" x="434" y="66" width="550" height="150" rx="6"/>
<text class="t b" x="446" y="88">что считается по каждому окну и оси</text>
<text class="k" x="446" y="110"><tspan class="b">спектр</tspan> — Уэлч: 8 отрезков по 1024 отсчёта (2 с, шаг частоты 0,49 Гц),</text>
<text class="s" x="446" y="126">окно Ханна, перекрытие наполовину</text>
<text class="k" x="446" y="146"><tspan class="b">полосы</tspan> — мощность в октавах 1–2, 2–4 … 128–250 Гц, дБ</text>
<text class="k" x="446" y="164"><tspan class="b">форма шума</tspan> — асимметрия и эксцесс (у гауссова шума оба около нуля)</text>
<text class="k" x="446" y="182"><tspan class="b">квантование</tspan> — доли значений, кратных 2, 4 … 256 (у живого шума ½, ¼ …)</text>
<text class="k" x="446" y="200"><tspan class="b">среднее</tspan> — наклон, сдвиг; <tspan class="b">по секундам</tspan> — разброс и выбросы</text>

<!-- эталон -->
<rect class="box" x="16" y="240" width="300" height="230" rx="6"/>
<text class="t b" x="28" y="262">◆ эталон шума</text>
<text class="k" x="28" y="284">те же показатели за 1–120 мин</text>
<text class="k" x="28" y="301">(кнопки 1, 3, 5 мин), пока основные</text>
<text class="k" x="28" y="318">группы стоят; только чистые окна —</text>
<text class="k" x="28" y="335">без толчков и пропусков, не меньше 6</text>
<text class="s" x="28" y="358">хранит: среднее и разброс в каждом</text>
<text class="s" x="28" y="375">бине спектра, уровни полос, форму</text>
<text class="s" x="28" y="392">шума, доли кратных, среднее, обычный</text>
<text class="s" x="28" y="409">разброс секунды</text>
<text class="k" x="28" y="432">привязан к режиму датчика (предел,</text>
<text class="k" x="28" y="449">усреднение): сменили — переписать</text>
<line class="fl" x1="316" y1="340" x2="338" y2="340" marker-end="url(#ar)"/>
<line class="fl" x1="166" y1="470" x2="166" y2="484" marker-end="url(#ar)"/>
<line class="fl" x1="700" y1="216" x2="700" y2="238" marker-end="url(#ar)"/>

<!-- сравнение -->
