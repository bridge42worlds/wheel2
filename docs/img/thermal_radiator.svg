<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" width="1000" height="545" role="img">
<title>Радиаторы агента в трубке катушки</title>
<desc>Схема крепления радиаторов у каждого агента на ободе, два разреза, масштаб приблизительный. Слева — разрез вдоль трубки по её оси: силиконовая трубка 19 × 23 мм под обмоткой катушки (тороид по ободу Ø900 мм); внутри — плата XIAO ESP32-S3 обратной стороной вверх, чип под платой. На обратной стороне — двусторонний термоскотч 10 мм, на нём алюминиевая проставка 20 × 10 × 8 мм (Al 6061, около 4 г), на ней на своём заводском скотче два алюминиевых радиатора 10 × 10 × 10 мм с решёткой рёбер. Тепло идёт от чипа через плату, скотч и проставку к рёбрам. В стенке трубки над ними окно около 11 × 22 мм, рёбра выходят над трубкой на 9–11,5 мм. Витки провода катушки идут вокруг трубки; над радиаторами провод ложится в каналы решётки между рёбрами, медь касается рёбер и тоже уносит тепло. Антенна — отдельным проводом наружу. Справа — разрез поперёк трубки через канал решётки: стенка трубки с окном 11 мм вверху, плата поперёк трубки, на ней скотч, проставка, скотч и основание радиатора; рёбра — за каналом; виток провода обходит трубку и поверх основания радиатора проходит по каналу; по кромкам рёбер, где лежит провод, — полоска каптона, чтобы острые кромки не содрали лак и витки не замкнулись через алюминий. Внизу пояснения: без пути для тепла плата в трубке перегрелась бы даже в простое — на столе тепловое сопротивление до воздуха 65–70 К/Вт при 0,45–0,5 Вт; проставка растекает тепло на оба радиатора и добавляет меньше 0,3 К/Вт; два слоя скотча при ~0,3 Вт на радиатор стоят около 1 °C, паста не нужна; каждый радиатор — отдельный кусок алюминия, кольца вокруг трубки нет, полю он не мешает; скотч при нагреве держит слабо, но радиаторы прижаты обмоткой. Обозначения: голубая заливка — алюминий, жёлтая — термоскотч, зелёная — плата, оранжевые кружки и линия — провод катушки, лиловая полоска — каптон, серая штриховка — силикон, синий пунктир — антенна.</desc>
