<text class="s" x="16" y="470">Без пути для тепла плата в трубке перегрелась бы даже в простое: на столе тепловое сопротивление до воздуха 65–70 К/Вт при 0,45–0,5 Вт.</text>
<text class="s" x="16" y="487">Проставка поднимает радиаторы и растекает тепло чипа на оба (добавляет &lt; 0,3 К/Вт); два слоя скотча при ~0,3 Вт на радиатор — около 1 °C, паста не нужна.</text>
<text class="s" x="16" y="504">Каптон (полиимид, до ~260 °C, пробой — киловольты): кромки не сдирают лак, витки не замыкаются через алюминий. Каждый радиатор — отдельный кусок:</text>
<text class="s" x="16" y="521">кольца вокруг трубки нет, полю не мешает. Скотч при нагреве держит слабо, но радиаторы прижаты обмоткой; переставленный — только на новый скотч.</text>
