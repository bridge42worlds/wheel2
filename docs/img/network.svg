<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img">
<title>Сеть опыта: агенты, телефон, роутер опыта, ноутбук-сервер и порты</title>
<desc>Своя сеть Wi-Fi 2,4 ГГц только для установки. Агенты XIAO ESP32-S3 — колесо 1 (№3, №5, №6, №11, №12, №20 на шине и агент катушки №13), колесо 2 (№14–№19), рама (агент моторов №10 и статика №8) — подключены по Wi-Fi 2,4 ГГц к роутеру опыта GL.iNet GL-MT300N-V2 «Mango»: канал 6 постоянно, WPA2, своё имя и пароль, порт WAN пустой — у сети опыта нет интернета. Между собой агенты говорят по ESP-NOW на том же канале 6, мимо роутера: пульс соседей, кадры группы и рассеяния. Если основная сеть не пускает 40 секунд, агент уходит на запасную — второй роутер; на основную пробует вернуться через 2 минуты, затем раз в 10 минут, когда стоит; в телеметрии net 0 или 1. Телефон №9 — по Wi-Fi к тому же роутеру, или кабелем USB к ноутбуку через adb reverse tcp:8090. Роутер соединён с ноутбуком кабелем: порт LAN роутера, кабель Cat6 3 метра, адаптер USB 3.0 — RJ45 у ноутбука. Ноутбук — сервер server/monitor.py: принимает UDP 5005, отдаёт HTTP на TCP 8090, рассылает маяк на UDP 5006 раз в 2 секунды, шлёт команды на UDP 5007. В интернет ноутбук ходит по своему Wi-Fi, это не сеть опыта. Потоки: UDP 5005 — от агентов к серверу телеметрия и данные (tel, grp, nbr, prm, acc, imu, imc, imr, mag); UDP 5006 — от сервера всем широковещательно маяк «W2SRV 5005»; UDP 5007 — от сервера агенту команды CFG, MOT, OTA, подтверждение номером cid в телеметрии; TCP 8090 — браузер открывает экран и /api; телефон шлёт POST /api/ingest; агент по подписанной команде OTA скачивает образ /fw/prime_lab.bin. Имён сетей, адресов и паролей на схеме нет: они только в secrets/wifi.ini на ноутбуке.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2228}
.h{font-size:15px;font-weight:600}.t{font-size:13px}.s{font-size:12px;fill:#4a535e}.b{font-weight:600}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12px;fill:#1d2228}
.box{fill:#fff;stroke:#1d2228;stroke-width:1.3}.nb{fill:#fff;stroke:#4a535e;stroke-width:1}
.grp{fill:#fff;stroke:#4a535e;stroke-width:1.2;stroke-dasharray:5 4}
.wifi{stroke:#0072B2;stroke-width:2.6;fill:none;stroke-dasharray:8 5}
.eth{stroke:#1d2228;stroke-width:4.5;fill:none}
.bak{stroke:#E69F00;stroke-width:2.8;fill:none;stroke-dasharray:1.5 5;stroke-linecap:round}
.now{stroke:#009E73;stroke-width:2.4;fill:none;stroke-dasharray:10 4 2 4}
.usb{stroke:#CC79A7;stroke-width:2.4;fill:none}
.inet{stroke:#4a535e;stroke-width:2;fill:none;stroke-dasharray:3 3}
.ic{stroke:#0072B2;stroke-width:2.2;fill:none;stroke-linecap:round}
.row{fill:#f3f5f7;stroke:none}
</style>
<rect width="1000" height="760" fill="#ffffff"/>
<text class="h" x="16" y="28">Сеть опыта: кто с кем говорит и по каким портам</text>
<text class="s" x="16" y="48">Своя сеть 2,4 ГГц только для установки: агенты и телефон — по Wi‑Fi к роутеру опыта, ноутбук-сервер — к роутеру кабелем.</text>
<text class="s" x="16" y="64">Имён сетей, адресов и паролей здесь нет: они только в secrets/wifi.ini на ноутбуке (вне git) и вшиваются в прошивку при сборке.</text>

<!-- агенты -->
<rect class="grp" x="16" y="84" width="300" height="262" rx="8"/>
<text class="t b" x="28" y="104">агенты XIAO ESP32‑S3</text>
<text class="s" x="200" y="104">прошивка prime_lab</text>
<rect class="box" x="48" y="116" width="256" height="66" rx="6"/>
<text class="t b" x="58" y="136">колесо 1</text>
<text class="s" x="58" y="154">№3, №5, №6, №11, №12, №20 — на шине</text>
<text class="s" x="58" y="172">№13 — агент катушки</text>
<rect class="box" x="48" y="192" width="256" height="48" rx="6"/>
<text class="t b" x="58" y="212">колесо 2</text>
<text class="s" x="58" y="230">№14–№19 на шине</text>
<rect class="box" x="48" y="250" width="256" height="48" rx="6"/>
<text class="t b" x="58" y="270">рама</text>
<text class="s" x="58" y="288">№10 — моторы · №8 — статика</text>
<!-- ESP-NOW между агентами -->
<path class="now" d="M34 149 V274"/>
<path class="now" d="M34 149 H48 M34 216 H48 M34 274 H48"/>
<text class="s" x="28" y="320">ESP‑NOW между агентами — канал 6,</text>
<text class="s" x="28" y="336">мимо роутера: пульс, кадры группы</text>

<!-- Wi-Fi агентов к роутеру -->
<path class="wifi" d="M316 200 H380"/>
<text class="s" x="324" y="192">Wi‑Fi</text>
<text class="s" x="324" y="218">2,4 ГГц</text>

<!-- роутер опыта -->
<path class="ic" d="M462 92 a26 26 0 0 1 36 0 M468 99 a17 17 0 0 1 24 0 M474 106 a8 8 0 0 1 12 0"/>
<circle cx="480" cy="111" r="2.8" fill="#0072B2"/>
<rect class="box" x="380" y="120" width="200" height="160" rx="6"/>
<text class="t b" x="392" y="142">роутер опыта</text>
<text class="s" x="392" y="160">GL.iNet GL‑MT300N‑V2 «Mango»</text>
<text class="s" x="392" y="178">питание micro‑USB 5 В</text>
<text class="s" x="392" y="200">2,4 ГГц · канал 6, постоянно</text>
<text class="s" x="392" y="218">WPA2 · своё имя и пароль</text>
<text class="s" x="392" y="240">порт WAN пустой:</text>
<text class="s" x="392" y="258">у сети опыта нет интернета</text>

<!-- кабель к ноутбуку -->
<path class="eth" d="M580 200 H710"/>
<text class="s" x="588" y="190">порт LAN</text>
<text class="s" x="588" y="222">кабель Cat6 3 м</text>
<text class="s" x="588" y="240">→ USB 3.0‑RJ45</text>

<!-- ноутбук-сервер -->
<rect class="box" x="710" y="120" width="274" height="226" rx="6"/>
<text class="t b" x="722" y="142">ноутбук — сервер</text>
<text class="mono" x="722" y="162">server/monitor.py</text>
<text class="s" x="722" y="186">принимает</text><text class="mono" x="820" y="186">UDP 5005</text><text class="s" x="890" y="186">(--udp)</text>
<text class="s" x="722" y="206">HTTP</text><text class="mono" x="820" y="206">TCP 8090</text><text class="s" x="890" y="206">(--http)</text>
<text class="s" x="722" y="226">маяк →</text><text class="mono" x="820" y="226">UDP 5006</text><text class="s" x="890" y="226">раз в 2 с</text>
<text class="s" x="722" y="246">команды →</text><text class="mono" x="820" y="246">UDP 5007</text>
<text class="s" x="722" y="272">маяк — во все сети ноутбука;</text>
<text class="s" x="722" y="290">экран «Установка» — в браузере</text>
<text class="s" x="722" y="308">по HTTP 8090</text>

<!-- интернет ноутбука -->
<path class="inet" d="M900 346 V404"/>
<text class="s" x="892" y="372" text-anchor="end">свой Wi‑Fi ноутбука —</text>
<text class="s" x="892" y="388" text-anchor="end">не сеть опыта</text>
<rect class="nb" x="830" y="404" width="154" height="40" rx="20"/>
<text class="t" x="907" y="429" text-anchor="middle">интернет</text>

<!-- телефон -->
<path class="wifi" d="M480 330 V280"/>
<text class="s" x="488" y="304">Wi‑Fi</text>
<rect class="box" x="380" y="330" width="200" height="94" rx="6"/>
<text class="t b" x="392" y="350">телефон №9 (статика)</text>
<text class="s" x="392" y="368">приложение phone/: пакеты</text>
<text class="s" x="392" y="386">строками, 4 раза в секунду,</text>
<text class="mono" x="392" y="404">POST /api/ingest</text>
<path class="usb" d="M580 396 H650 V330 H710"/>
<text class="s" x="590" y="420">или кабель USB:</text>
<text class="mono" x="590" y="438">adb reverse tcp:8090</text>
<text class="s" x="590" y="456">сервер — раз в 15 с</text>

<!-- запасная сеть -->
<path class="bak" d="M160 346 V384"/>
<text class="s" x="170" y="370">запасная Wi‑Fi</text>
<rect class="box" x="16" y="384" width="300" height="92" rx="6"/>
<text class="t b" x="28" y="404">второй роутер — запасная сеть</text>
<text class="s" x="28" y="422">основная не пускает 40 с → агент уходит сюда;</text>
<text class="s" x="28" y="440">назад пробует через 2 мин, потом раз в 10 мин,</text>
<text class="s" x="28" y="458">когда стоит. В телеметрии net: 0 / 1</text>

<!-- потоки -->
<text class="t b" x="16" y="506">Потоки</text>
<text class="s" x="16" y="528">порт</text><text class="s" x="120" y="528">кто → кому</text><text class="s" x="330" y="528">что</text>
<rect class="row" x="10" y="536" width="980" height="24"/>
<text class="mono" x="16" y="553">UDP 5005</text><text class="t" x="120" y="553">агенты → сервер</text>
<text class="t" x="330" y="553">телеметрия и данные: tel, grp, nbr, prm (простые), acc, imu, imc, imr, mag</text>
<text class="mono" x="16" y="577">UDP 5006</text><text class="t" x="120" y="577">сервер → все, раз в 2 с</text>
<text class="t" x="330" y="577">маяк «W2SRV 5005» широковещательно: отправитель — сервер, 5005 — порт телеметрии</text>
<rect class="row" x="10" y="584" width="980" height="24"/>
<text class="mono" x="16" y="601">UDP 5007</text><text class="t" x="120" y="601">сервер → агент</text>
<text class="t" x="330" y="601">команды CFG, MOT, OTA; агент подтверждает номером cid в телеметрии</text>
<text class="mono" x="16" y="625">TCP 8090</text><text class="t" x="120" y="625">браузер → сервер</text>
<text class="t" x="330" y="625">экран «Установка» и /api</text>
<rect class="row" x="10" y="632" width="980" height="24"/>
<text class="mono" x="16" y="649">TCP 8090</text><text class="t" x="120" y="649">телефон → сервер</text>
<text class="t" x="330" y="649">POST /api/ingest — те же пакеты, что агенты шлют по UDP</text>
<text class="mono" x="16" y="673">TCP 8090</text><text class="t" x="120" y="673">агент ← сервер</text>
<text class="t" x="330" y="673">образ прошивки /fw/prime_lab.bin — по команде OTA, подписанной ключом secrets/ota.key</text>
<rect class="row" x="10" y="680" width="980" height="24"/>
<text class="mono" x="16" y="697">ESP‑NOW</text><text class="t" x="120" y="697">агент ↔ агент</text>
<text class="t" x="330" y="697">пульс соседей, кадры группы и рассеяния — тот же канал 6, роутер не нужен</text>

<!-- обозначения -->
<path class="wifi" d="M16 736 H56"/><text class="s" x="64" y="740">Wi‑Fi сети опыта</text>
<path class="eth" d="M186 736 H226"/><text class="s" x="234" y="740">кабель Ethernet</text>
<path class="bak" d="M352 736 H392"/><text class="s" x="400" y="740">запасная сеть</text>
<path class="now" d="M504 736 H544"/><text class="s" x="552" y="740">ESP‑NOW</text>
<path class="usb" d="M628 736 H668"/><text class="s" x="676" y="740">кабель USB</text>
<path class="inet" d="M770 736 H810"/><text class="s" x="818" y="740">свой Wi‑Fi ноутбука</text>
</svg>
