<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img">
<title>Как агент ищет простое: шум → кандидат → отсев делителями → Миллер — Рабин → простое → проверка на сервере</title>
<desc>Конвейер поиска простого на агенте. Пять шагов слева направо. Первый — шум: источники по маске src — ГСЧ чипа, CSI, АЦП, дрожание RC, обратный шум, датчики обода; один ГСЧ идёт в число как есть, смесь — блоками SHA-256. Второй — кандидат: bits бит, по умолчанию 256; старший бит ставится в 1 — длина ровно N бит, младший в 1 — число нечётное. Третий — отсев делителями: кандидат делится на нечётные простые меньше td, по умолчанию 1000; делится — отказ. Четвёртый — Миллер — Рабин по базам 2, 3, 5, 7 и далее, первые nb, по умолчанию 8; нашлась база-свидетель — число точно составное, отказ; all = 1 — каждого кандидата проверяют все базы. Отказы — красно-оранжевым пунктиром вниз и назад ко второму шагу: следующий кандидат из новых байтов шума. Пятый — прошло все базы: вероятно простое; плюс один в счётчике телеметрии tel; при pl = 1 само число уходит на сервер пакетами prm — синяя стрелка вниз. Под шагами: при dc = 1 работа делится на два ядра — ядро связи набирает шум и отсеивает, через очередь кандидаты идут ядру счёта, оно только проверяет Миллером — Рабином; при dc = 0 всё на одном ядре. Внизу справа — сервер, primecheck: перепроверяет присланные простые своим Миллером — Рабином пачками, до 6 процессов; 32-битные — ещё и точно, так считаются ложные простые. Внизу слева — как считается: 32 бита — свой код на 64-битном умножении, длиннее — mbedtls с аппаратным ускорителем чипа; по умолчанию 256 бит, 8 баз, отсев до 1000; счётчики накопительные с начала настройки.</desc>
<defs>
<marker id="mD" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2228"/></marker>
<marker id="mV" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D55E00"/></marker>
<marker id="mB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/></marker>
</defs>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2228}
.h{font-size:15px;font-weight:600}.t{font-size:13px}.q{font-size:12px}.s{font-size:12px;fill:#4a535e}.b{font-weight:600}
.box{fill:#fff;stroke:#1d2228;stroke-width:1.3}.nb{fill:#fff;stroke:#4a535e;stroke-width:1}
.ok{fill:#fff;stroke:#009E73;stroke-width:3}
.go{stroke:#1d2228;stroke-width:2.4;fill:none}
.no{stroke:#D55E00;stroke-width:2.4;fill:none;stroke-dasharray:7 4}
.tel{stroke:#0072B2;stroke-width:2.6;fill:none}
.br{stroke:#4a535e;stroke-width:1.4;fill:none}
</style>
<rect width="1000" height="590" fill="#ffffff"/>
<text class="h" x="16" y="28">Как агент ищет простое: от шума до проверенного числа</text>
<text class="s" x="16" y="48">Эгоистичный режим — каждый агент сам. В группе те же шаги делят между собой агенты колеса (групповой режим).</text>
<text class="s" x="16" y="64">В скобках — параметр настройки и его значение по умолчанию.</text>

<!-- агент -->
<rect class="nb" x="16" y="78" width="968" height="318" rx="8"/>
<text class="t b" x="28" y="100">Агент · прошивка prime_lab</text>

<rect class="box" x="24" y="116" width="166" height="136" rx="6"/>
<text class="t b" x="36" y="138">① шум</text>
<text class="q" x="36" y="158">источники src:</text>
<text class="q" x="36" y="174">ГСЧ, CSI, АЦП, RC,</text>
<text class="q" x="36" y="190">обратный, датчики</text>
<text class="s" x="36" y="212">один ГСЧ — как есть;</text>
<text class="s" x="36" y="228">смесь — SHA-256</text>

<rect class="box" x="220" y="116" width="166" height="136" rx="6"/>
<text class="t b" x="232" y="138">② кандидат</text>
<text class="q" x="232" y="158">bits бит (256)</text>
<text class="q" x="232" y="178">старший бит = 1:</text>
<text class="s" x="232" y="194">длина ровно N бит</text>
<text class="q" x="232" y="214">младший бит = 1:</text>
<text class="s" x="232" y="230">число нечётное</text>

<rect class="box" x="416" y="116" width="166" height="136" rx="6"/>
<text class="t b" x="428" y="138">③ отсев делителями</text>
<text class="q" x="428" y="158">делим на нечётные</text>
<text class="q" x="428" y="174">простые меньше td</text>
<text class="q" x="428" y="190">(1000)</text>
<text class="s" x="428" y="212">быстро отбрасывает</text>
<text class="s" x="428" y="228">большинство</text>

<rect class="box" x="612" y="116" width="166" height="136" rx="6"/>
<text class="t b" x="624" y="138">④ Миллер — Рабин</text>
<text class="q" x="624" y="158">базы 2, 3, 5, 7, …</text>
<text class="q" x="624" y="174">первые nb (8)</text>
<text class="s" x="624" y="196">база-свидетель —</text>
<text class="s" x="624" y="212">точно составное;</text>
<text class="s" x="624" y="228">all = 1 — все базы</text>

<rect class="ok" x="808" y="116" width="166" height="136" rx="6"/>
<text class="t b" x="820" y="138">⑤ ✓ простое</text>
<text class="q" x="820" y="158">прошло все nb баз:</text>
<text class="q" x="820" y="174">вероятно простое</text>
<text class="s" x="820" y="196">+1 в счётчике tel;</text>
<text class="s" x="820" y="212">pl = 1 — само число</text>
<text class="s" x="820" y="228">на сервер</text>

<line class="go" x1="190" y1="160" x2="218" y2="160" marker-end="url(#mD)"/>
<line class="go" x1="386" y1="160" x2="414" y2="160" marker-end="url(#mD)"/>
<line class="go" x1="582" y1="160" x2="610" y2="160" marker-end="url(#mD)"/>
<line class="go" x1="778" y1="160" x2="806" y2="160" marker-end="url(#mD)"/>

<!-- отказы -->
<path class="no" d="M499 252 V292"/>
<path class="no" d="M695 252 V292 H303 V256" marker-end="url(#mV)"/>
<text class="q b" x="507" y="276">делится</text>
<text class="q b" x="703" y="276">составное</text>
<text class="q" x="318" y="312">отказ → следующий кандидат из новых байтов шума</text>

<!-- два ядра -->
<path class="br" d="M24 334 V344 H582 V334"/>
<text class="q" x="303" y="362" text-anchor="middle"><tspan class="b">dc = 1:</tspan> ядро связи — шум и отсев</text>
<path class="br" d="M612 334 V344 H778 V334"/>
<text class="q" x="695" y="362" text-anchor="middle">ядро счёта —</text>
<text class="q" x="695" y="378" text-anchor="middle">только проверка</text>
<text class="s" x="597" y="362" text-anchor="middle">⇢</text>
<text class="s" x="303" y="380" text-anchor="middle">кандидаты — ядру счёта через очередь; dc = 0 — всё на одном ядре</text>

<!-- на сервер -->
<line class="tel" x1="891" y1="252" x2="891" y2="426" marker-end="url(#mB)"/>
<text class="q" x="899" y="292">пакеты prm</text>
<text class="s" x="899" y="308">(журнал pl)</text>

<rect class="box" x="560" y="428" width="414" height="104" rx="6"/>
<text class="t b" x="572" y="450">⑥ сервер перепроверяет · primecheck</text>
<text class="q" x="572" y="472">свой Миллер — Рабин, пачками, до 6 процессов —</text>
<text class="q" x="572" y="488">приёмник телеметрии проверки не ждёт;</text>
<text class="q" x="572" y="508">32 бита — ещё и точно: так считаются</text>
<text class="q" x="572" y="524"><tspan class="b">ложные простые</tspan></text>

<rect class="nb" x="16" y="428" width="520" height="104" rx="6"/>
<text class="t b" x="28" y="450">Как считается</text>
<text class="q" x="28" y="472">32 бита — свой код на 64-битном умножении;</text>
<text class="q" x="28" y="488">длиннее — mbedtls с аппаратным ускорителем чипа</text>
<text class="q" x="28" y="508">по умолчанию: 256 бит, 8 баз, отсев до 1000</text>
<text class="s" x="28" y="524">счётчики — накопительно с начала настройки</text>

<!-- условные знаки -->
<line class="go" x1="16" y1="566" x2="52" y2="566" marker-end="url(#mD)"/><text class="q" x="60" y="570">дальше</text>
<line class="no" x1="130" y1="566" x2="166" y2="566" marker-end="url(#mV)"/><text class="q" x="174" y="570">отказ</text>
<line class="tel" x1="240" y1="566" x2="276" y2="566" marker-end="url(#mB)"/><text class="q" x="284" y="570">на сервер</text>
<rect class="ok" x="376" y="558" width="30" height="16" rx="3"/><text class="q" x="414" y="570">найдено простое</text>
</svg>
