<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1110" width="960" height="1110" role="img">
<title>Колесо 1, агент №20: магнитометр MLX90393 — подключение по I²C</title>
<desc>Агент №20 — XIAO ESP32-S3 на ободе колеса 1. Плюс шины 5,1 В через диод 1N5819 (полоска к агенту) идёт на вывод 5V агента, минус шины — на вывод GND агента. От агента к модулю MLX90393 четыре провода: GND агента (тот же вывод, куда пришёл минус шины) — на GND модуля; 3V3 — на VCC; D4 (GPIO5) — на SDA; D5 (GPIO6) — на SCL. На модуле, по схеме из паспорта Melexis: VCC идёт на выводы микросхемы VDD (15) и VDD_IO (8), у каждого конденсатор 100 нФ на GND (C1 у VDD, C2 у VDD_IO); GND — на VSS (13); SDA — на вывод 5, SCL — на вывод 3, у каждого подтяжка 10 кОм к VCC (R1, R2); CS (вывод 2) — к VCC, это включает I²C; A0 (12) и A1 (11) — на GND, адрес 0x0C; выводы N/C (4, 9, 10, 14, 16) паспорт советует соединить с GND. CS (2), MISO (6), INT (1) и INT/TRG (7) выведены на гребёнку и к агенту не подключаются; CS на модуле соединён с VCC (если нет — перемычка CS→VCC). Добавить по желанию: керамику 100 нФ и 10 мкФ между VCC и GND у выводов модуля. Если шина работает только на 100 кГц или растут ошибки — резисторы 4,7 кОм от SDA и от SCL к 3V3 у агента. Ниже — адрес и что ждёт прошивка, сборка и проверка по шагам, где ставить датчик.</desc>
