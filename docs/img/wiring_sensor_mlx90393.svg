<text class="s" x="786" y="394">3 SCL</text>
<text class="s" x="914" y="424" text-anchor="end">VSS 13</text>
<text class="s" x="786" y="454">2 CS</text>
<text class="s" x="786" y="489">6 MISO</text>
<text class="s" x="786" y="524">1 INT</text>
<text class="s" x="786" y="559">7 INT/TRG</text>
<text class="h" x="868" y="470" text-anchor="middle">MLX90393</text>
<text class="s" x="868" y="504" text-anchor="middle">QFN-16</text>
<text class="s" x="820" y="592" text-anchor="middle">12 A0</text>
<text class="s" x="880" y="592" text-anchor="middle">11 A1</text>
<path class="m" d="M820 600 V616 M880 600 V616"/>
<path class="d" d="M810 616 H830 M814 621 H826 M818 626 H822 M870 616 H890 M874 621 H886 M878 626 H882"/>
<text class="s" x="612" y="584">N/C: 4, 9, 10, 14, 16 → GND</text>
<text class="s" x="612" y="600">(совет паспорта)</text>
<text class="s" x="806" y="620" text-anchor="end">A0, A1 → GND:</text>
<text class="s b" x="806" y="636" text-anchor="end">адрес 0x0C</text>
<text class="s" x="612" y="656">номиналы на вашей плате могут быть другими</text>

<!-- адрес и прошивка -->
<rect class="box" x="16" y="478" width="374" height="206" rx="6"/>
<text class="t b" x="28" y="500">Адрес и что ждёт прошивка</text>
<text class="s" x="28" y="520">A1 · A0 → адрес (7 бит), паспорт, вариант чипа -011:</text>
<text class="s b" x="28" y="538">GND · GND → 0x0C — ваш модуль</text>
<text class="s" x="28" y="556">GND · VCC → 0x0D;  VCC · GND → 0x0E;  VCC · VCC → 0x0F</text>
<text class="s" x="28" y="576">Ищет 0x0C–0x13, 0x18–0x1B (варианты -011/-012/-014),</text>
<text class="s" x="28" y="592">берёт первый ответивший.</text>
<text class="s" x="28" y="610">Wire.begin(5, 6, 400000): GPIO5 = D4 = SDA,</text>
<text class="s" x="28" y="626">GPIO6 = D5 = SCL; не нашёлся — ещё раз на 100 кГц.</text>
<text class="s" x="28" y="644">20 замеров в секунду: запуск, через 30 мс чтение;</text>
<text class="s" x="28" y="660">усиление (0–7) подбирает сам. INT и TRG не нужны —</text>
<text class="s" x="28" y="676">прошивка спрашивает датчик по шине.</text>

<!-- сборка и проверка -->
<text class="t b" x="16" y="712">Сборка и проверка — по шагам</text>
<text class="s" x="16" y="734">1. Аккумуляторы шины вынуть, USB отключить. Четыре провода — как</text>
<text class="s" x="30" y="750">можно короче (до 20–30 см), скрутить вместе.</text>
<text class="s" x="16" y="770">2. До пайки, на модуле (красный щуп на VCC): VCC–SDA и VCC–SCL</text>
<text class="s" x="30" y="786">2–10 кОм — подтяжки есть; обрыв — 4,7 кОм к 3V3 у агента.</text>
<text class="s" x="16" y="806">3. 3V3 → VCC, GND → GND, D4 → SDA, D5 → SCL. Не 5V: предел микросхемы</text>
<text class="s" x="30" y="822">4 В. Паять флюсом, не пастой; после пайки отмыть спиртом.</text>
<text class="s" x="16" y="842">4. Прозвонка без питания: каждый провод звенит со своим выводом;</text>
<text class="s" x="30" y="858">SDA–GND, SCL–GND, SDA–SCL не звенят; VCC–GND — лишь короткий</text>
<text class="s" x="30" y="874">писк (заряд конденсаторов), долгий звон — замыкание.</text>
<text class="s" x="16" y="894">5. A0, A1, если выведены на гребёнку, — к GND, не к VCC.</text>
<text class="s" x="16" y="914">6. Включить. На модуле VCC–GND 3,2–3,4 В; CS–GND столько же (если 0 В —</text>
<text class="s" x="30" y="930">соединить CS с VCC модуля); SDA и SCL в покое — около 3,3 В.</text>
<text class="s" x="16" y="950">7. Журнал по USB при старте: «RIM i2c: 0x0c», «RIM MLX90393 at 0x0c»,</text>
<text class="s" x="30" y="966">«RIM bus 400 kHz» — адрес 0x0C, значит A0 = A1 = 0.</text>
<text class="s" x="16" y="986">8. Телеметрия: sens 2, i2c [12], mag addr 12 (= 0x0C), err 0 и не растёт.</text>
<text class="s" x="30" y="1002">«Поле вживую»: фон 40–80 мкТл, при поле катушки — около 1,2 мТл.</text>
<text class="s" x="16" y="1022">9. «RIM bus 100 kHz» или растёт err — добавить 4,7 кОм, укоротить провода.</text>

<!-- где ставить -->
<text class="t b" x="490" y="712">Где и как ставить датчик</text>
<text class="s" x="490" y="734">• Меряет поле катушки вдоль трубки. Плату — плоско вдоль трубки:</text>
<text class="s" x="502" y="750">поле в плоскости платы, оси x, y (шум 1,2 мкТл; у z — 1,7).</text>
<text class="s" x="490" y="770">• Закрепить неподвижно (термоклей, стяжка): от положения зависят</text>
<text class="s" x="502" y="786">фон и направление «+», которые запоминает сервер.</text>
<text class="s" x="490" y="806">• Подальше от DC-DC и от проводов катушки: в 1 см от провода</text>
<text class="s" x="502" y="822">с током 0,9 А — около 18 мкТл. Провода катушки — парой.</text>
<text class="s" x="490" y="842">• Рядом ничего стального: винты, шайбы, стойки — латунь, пластик.</text>
<text class="s" x="502" y="858">Конденсаторы тоже чуть магнитны (никель в керамике, сталь</text>
<text class="s" x="502" y="874">в ножках): SMD у выводов VCC/GND, не над микросхемой.</text>
<text class="s" x="490" y="894">• Провода у модуля не гнуть и не тянуть: прихватить к трубке</text>
<text class="s" x="502" y="910">в 1–2 см от платы — пайка не треснет от вибрации обода.</text>
<text class="s" x="490" y="930">• У XIAO (USB сверху): D4, D5 — пятый и шестой слева;</text>
<text class="s" x="502" y="946">5V, GND, 3V3 — первый, второй, третий справа.</text>
<text class="s" x="490" y="966">• Есть стабилизатор (выводы VIN и 3Vo, как у Adafruit) —</text>
<text class="s" x="502" y="982">3V3 агента на VIN, 3Vo не подключать.</text>
<text class="s" x="490" y="1002">• На вашей плате может быть подписано: VCC — VIN, 3V3, 3.3V;</text>
<text class="s" x="502" y="1018">SCL — SCK, SCLK; SDA — SDI, MOSI; MISO — SDO, MIS; TRG — TRIG,</text>
<text class="s" x="502" y="1034">TR; CS — SENB. Два GND и два 3.3V (G у Adafruit) — те же выводы.</text>

<!-- обозначения -->
<line class="p" x1="16" y1="1060" x2="52" y2="1060"/><text class="s" x="60" y="1064">плюс</text>
<line class="m" x1="110" y1="1060" x2="146" y2="1060"/><text class="s" x="154" y="1064">минус, GND</text>
<line class="sig" x1="236" y1="1060" x2="272" y2="1060"/><text class="s" x="280" y="1064">сигналы I²C (SDA, SCL)</text>
<line class="v3" x1="420" y1="1060" x2="456" y2="1060"/><text class="s" x="464" y="1064">3,3 В (VCC), подписано у провода</text>
