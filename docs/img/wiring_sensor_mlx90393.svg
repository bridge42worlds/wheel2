<rect width="960" height="1110" fill="#ffffff"/>
<text class="h" x="16" y="28">Колесо 1, агент №20: магнитометр MLX90393 — подключение по I²C</text>
<text class="s" x="16" y="48">Четыре провода от агента: 3V3 → VCC, GND → GND, D4 → SDA, D5 → SCL. Адрес 0x0C (A0 = A1 = GND), 400 кГц, 20 замеров в секунду.</text>
<text class="s" x="16" y="64">Агент питается от шины колеса через 1N5819, как все агенты обода. MISO, INT, TRG не подключать; CS — к VCC модуля.</text>

