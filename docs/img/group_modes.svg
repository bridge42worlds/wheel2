<rect width="1000" height="936" fill="#ffffff"/>
<text class="h" x="16" y="28">Групповой режим: как агенты делят работу над простыми</text>
<text class="s" x="16" y="48">Значки и линии — как на основном экране: ● эгоистичный, ⋈ каскад, ⇢ эстафета, ① одно число на всех.</text>
<text class="s" x="16" y="64">Во всех групповых способах число складывается из кусочков шума всех агентов; различается, кто и как его проверяет.</text>

<!-- 1. эгоистичный -->
<rect class="nb" x="16" y="80" width="476" height="384" rx="6"/>
<text class="h" x="30" y="106">● эгоистичный — каждый сам</text>
<text class="s" x="30" y="124">не группа (mode 0): эталон для сравнения</text>
<text class="s" x="254" y="160" text-anchor="middle">общего нет — только пульс «я жив» раз в секунду (пунктир)</text>
<line class="pu" x1="112" y1="196" x2="170" y2="196"/><line class="pu" x1="222" y1="196" x2="280" y2="196"/><line class="pu" x1="332" y1="196" x2="390" y2="196"/>
<g>
<circle class="ag" cx="86" cy="196" r="24"/><text class="n" x="86" y="202" text-anchor="middle">1</text>
<circle class="ag" cx="196" cy="196" r="24"/><text class="n" x="196" y="202" text-anchor="middle">2</text>
<circle class="ag" cx="306" cy="196" r="24"/><text class="n" x="306" y="202" text-anchor="middle">3</text>
<circle class="ag" cx="416" cy="196" r="24"/><text class="n" x="416" y="202" text-anchor="middle">4</text>
</g>
<g>
<line class="num" x1="86" y1="220" x2="86" y2="232"/><line class="num" x1="196" y1="220" x2="196" y2="232"/><line class="num" x1="306" y1="220" x2="306" y2="232"/><line class="num" x1="416" y1="220" x2="416" y2="232"/>
<rect class="cell" x="36" y="232" width="100" height="96" rx="8"/><rect class="cell" x="146" y="232" width="100" height="96" rx="8"/>
<rect class="cell" x="256" y="232" width="100" height="96" rx="8"/><rect class="cell" x="366" y="232" width="100" height="96" rx="8"/>
</g>
<g class="s" text-anchor="middle">
<text class="s" x="86" y="254" text-anchor="middle">свой шум</text><text class="s" x="86" y="272" text-anchor="middle">↓ число</text><text class="s" x="86" y="290" text-anchor="middle">↓ отсев</text><text class="s" x="86" y="308" text-anchor="middle">↓ проверка</text>
<text class="s" x="196" y="254" text-anchor="middle">свой шум</text><text class="s" x="196" y="272" text-anchor="middle">↓ число</text><text class="s" x="196" y="290" text-anchor="middle">↓ отсев</text><text class="s" x="196" y="308" text-anchor="middle">↓ проверка</text>
<text class="s" x="306" y="254" text-anchor="middle">свой шум</text><text class="s" x="306" y="272" text-anchor="middle">↓ число</text><text class="s" x="306" y="290" text-anchor="middle">↓ отсев</text><text class="s" x="306" y="308" text-anchor="middle">↓ проверка</text>
<text class="s" x="416" y="254" text-anchor="middle">свой шум</text><text class="s" x="416" y="272" text-anchor="middle">↓ число</text><text class="s" x="416" y="290" text-anchor="middle">↓ отсев</text><text class="s" x="416" y="308" text-anchor="middle">↓ проверка</text>
</g>
<text class="t" x="30" y="362">Каждый агент сам: шум из своих источников → число →</text>
<text class="t" x="30" y="382">отсев делителями → Миллер — Рабин всеми базами.</text>
<text class="t" x="30" y="402">Простое поглотителям объявляет тоже сам.</text>
<text class="s" x="30" y="436">Группа сравнивается с «каждый сам» при тех же настройках.</text>

<!-- 2. каскад -->
<rect class="nb" x="508" y="80" width="476" height="384" rx="6"/>
<text class="h" x="522" y="106">⋈ каскад — gv 2, основной</text>
<text class="s" x="522" y="124">проверяют все сразу, каждый свои числа</text>
<path class="pr" d="M 596 184 Q 643 140 668 180" marker-end="url(#mo)"/>
<text class="s" x="700" y="156">простое → сверка у следующего</text>
<rect class="bus" x="536" y="262" width="420" height="24"/>
