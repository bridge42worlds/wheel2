<circle class="ag" cx="798" cy="204" r="24"/><text class="n" x="798" y="210" text-anchor="middle">3</text>
<circle class="ag" cx="908" cy="204" r="24"/><text class="n" x="908" y="210" text-anchor="middle">4</text>
</g>
<text class="t b" x="546" y="186">✓</text><text class="t b" x="656" y="186">✓</text><text class="t b" x="766" y="186">✓</text><text class="t b" x="876" y="186">✓</text>
<text class="s" x="746" y="306" text-anchor="middle">⇄ шина: кусочки шума от всех ко всем (PCS)</text>
<text class="s" x="522" y="334">у агента 1 свои числа: по кусочку от каждого, порядок случайный</text>
<rect class="seg" x="522" y="344" width="56" height="24"/><rect class="seg" x="578" y="344" width="56" height="24"/>
<rect class="seg" x="634" y="344" width="56" height="24"/><rect class="seg" x="690" y="344" width="56" height="24"/>
<text class="s" x="550" y="361" text-anchor="middle">от 3</text><text class="s" x="606" y="361" text-anchor="middle">от 1</text>
<text class="s" x="662" y="361" text-anchor="middle">от 4</text><text class="s" x="718" y="361" text-anchor="middle">от 2</text>
<text class="t" x="756" y="361">→ отсев → проверка ✓</text>
<text class="t" x="522" y="400">1. REQ — всем одним кадром, каждый отвечает набором PCS</text>
<text class="t" x="522" y="420">2. числа из кусочков всех, отсев, проверка всеми базами</text>
<text class="t" x="522" y="440">3. простое — следующему на сверку; ход не передаётся</text>

<!-- 3. эстафета -->
<rect class="nb" x="16" y="480" width="476" height="384" rx="6"/>
<text class="h" x="30" y="506">⇢ эстафета — gv 1</text>
<text class="s" x="30" y="524">ход у одного, остальные дают ему шум; ход по кругу</text>
<path class="num" d="M 174.1 612.0 A 74 74 0 0 1 220.0 657.9" style="stroke-width:4" marker-end="url(#mg)"/>
<path class="num" d="M 220.0 706.1 A 74 74 0 0 1 174.1 752.0" marker-end="url(#mg)"/>
<path class="num" d="M 125.9 752.0 A 74 74 0 0 1 80.0 706.1" marker-end="url(#mg)"/>
<path class="num" d="M 80.0 657.9 A 74 74 0 0 1 125.9 612.0" marker-end="url(#mg)"/>
<path class="pr" d="M 179.7 590.7 A 96 96 0 0 1 241.3 652.3" marker-end="url(#mo)"/>
<line class="pcs" x1="207" y1="665" x2="171" y2="629" marker-end="url(#mb)"/>
<line class="pcs" x1="150" y1="732" x2="150" y2="636" marker-end="url(#mb)"/>
<line class="pcs" x1="93" y1="665" x2="129" y2="629" marker-end="url(#mb)"/>
<circle class="halo" cx="150" cy="608" r="31"/>
<g>
<circle class="ag" cx="150" cy="608" r="24"/><text class="n" x="150" y="614" text-anchor="middle">1</text>
<circle class="ag" cx="224" cy="682" r="24"/><text class="n" x="224" y="688" text-anchor="middle">2</text>
<circle class="ag" cx="150" cy="756" r="24"/><text class="n" x="150" y="762" text-anchor="middle">3</text>
<circle class="ag" cx="76" cy="682" r="24"/><text class="n" x="76" y="688" text-anchor="middle">4</text>
</g>
<text class="t b" x="112" y="598" text-anchor="end">✓ ход у №1</text>
<text class="s" x="236" y="604">простое → сверка</text>
<text class="t b" x="270" y="650">Ход проверяющего:</text>
<text class="s" x="270" y="670">1. REQ всем одним кадром —</text>
<text class="s" x="284" y="686">наборы кусочков PCS ему</text>
<text class="s" x="270" y="706">2. числа из кусочков всех,</text>
<text class="s" x="284" y="722">отсев, проверка всеми базами</text>
<text class="s" x="270" y="742">3. нашёл rk простых — TURN</text>
<text class="s" x="284" y="758">следующему: ход, запас чисел</text>
<text class="s" x="284" y="774">и простое на сверку</text>
<text class="s" x="270" y="794">4. тот подтверждает приём,</text>
<text class="s" x="284" y="810">сверяет и проверяет свои</text>
<text class="t" x="30" y="842">Один поток счёта на всю группу; эфир почти свободен.</text>

<!-- 4. одно число на всех -->
<rect class="nb" x="508" y="480" width="476" height="384" rx="6"/>
<text class="h" x="522" y="506">① одно число на всех — gv 0</text>
<text class="s" x="522" y="524">каждое число проверяют все, базы поделены по кругу</text>
