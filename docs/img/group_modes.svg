<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 936" width="1000" height="936" role="img">
<title>Групповой режим: как агенты делят работу над простыми</title>
<desc>Четыре способа совместной работы генераторов, нарисованные так же, как на основном экране. Эгоистичный (значок круг, не группа): у каждого агента своя ячейка — свой шум, своё число, свой отсев и своя проверка; общий только пульс «я жив» раз в секунду, пунктиром. Каскад (gv 2, основной): четыре агента над двусторонней шиной; от каждого к шине — пунктир кусочков шума в обе стороны: кусочки идут от всех ко всем. Все проверяют сразу, у каждого галочка; у агента 1 своё число из кусочков от агентов 3, 1, 4, 2 в случайном порядке, потом отсев и проверка. Найденное простое точечной стрелкой уходит следующему по порядку на сверку одной другой базой; ход не передаётся. Шаги: просьба REQ всем одним кадром, каждый отвечает набором кусочков PCS; числа из кусочков всех, отсев, проверка всеми базами; простое — следующему на сверку. Эстафета (gv 1): четыре агента по кольцу, стрелки хода по часовой стрелке; ход (ореол и галочка) у агента 1, остальные трое шлют ему кусочки пунктиром. Нашёл rk простых — сообщение TURN следующему: ход, запас чисел и простое на сверку (точечная стрелка снаружи кольца); тот подтверждает приём, сверяет и проверяет свои числа. Один поток счёта на группу, эфир почти свободен. Одно число на всех (gv 0): в середине общее число цикла со значком ①, вокруг четыре агента, к каждому две спицы — сплошная стрелка числа и итога NXT от середины и тонкая стрелка ответа RES к середине. Агент 1 — мастер. Базы поделены по кругу: при 8 базах у агентов 1–4 базы 2 и 11, 3 и 13, 5 и 17, 7 и 19. Цикл: итог и число всем, новому мастеру — и запас чисел; каждый проверяет своими базами и отвечает мастеру; нашли свидетеля — число составное, мастер — нашедший; никто — простое, мастер — следующий; запас пуст — все шлют кусочки новому мастеру. Ответы обязаны сходиться — проверка целостности. Легенда: агент-генератор с номером; ореол и галочка — проверяет сейчас или мастер; пунктир — кусочки шума PCS; сплошная стрелка — число и ход NXT, TURN; точечная стрелка — простое на сверку; тонкая стрелка — ответ мастеру RES; редкий пунктир — пульс; полоса из двух встречных линий — шина каскада.</desc>
