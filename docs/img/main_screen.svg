<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770" role="img">
<title>Основной экран «Установка»: что где</title>
<desc>Раскладка основного экрана, одно окно без прокрутки. Вверху шапка в одну строку: слева «☰ Колесо-2» — меню, связь «● N из M на связи», значки режимов, ♨ у предела, ❗ тревога статики, звук, часы; справа «✎ Эксперимент…», «▶ Запустить N опытов», «⏹ Стоп после опыта» и «■ Всё стоп». Ниже слева — схема установки вживую. В левом верхнем углу схемы — мини-карточка: программа, опыт N из M, фаза словом и обратный отсчёт, полоска фаз старт, подготовка, проверка, исполнение, итоги, отдых, по строке на колесо — режим словом и значком. В правом верхнем углу схемы — «ⓘ как читать» и «⚙ Настройка». Два колеса крупно: внутри обода — откуда шум, дорожки источников к агентам; в середине колеса — сумма простых и темп, обороты, поле; снаружи — куда уходит, по способу: шина, кольцо, спицы, волны; над колесом — имя и сколько на связи. Дуга сверху между колёсами — простые генераторов к поглотителям другого колеса, дуга снизу — обратный шум. Между колёсами — измерители статики, расстояние между колёсами в миллиметрах, агент моторов. В нижних углах — агенты катушек, кнопки поля выкл, плюс, минус и остаток аккумуляторов в процентах. Внизу посередине всплывают сообщения и тают через 12 секунд, ниже — свободные платы. Справа колонка, её можно свернуть: статика — вывод крупно, датчики друг под другом с живым графиком за 10 секунд, эталон; таблица опытов значками; строка эксперимента. Под экраном — окна из меню.</desc>
