.rim{fill:none;stroke:#8a929b;stroke-width:9}
.lane{stroke:#4a535e;stroke-width:1.4;fill:none;stroke-dasharray:3 3}
.arcG{stroke:#009E73;stroke-width:2.4;fill:none;stroke-dasharray:1 5;stroke-linecap:round}
.arcB{stroke:#0072B2;stroke-width:2.4;fill:none;stroke-dasharray:8 4}
.spark{stroke:#0072B2;stroke-width:1.4;fill:none}
</style>
<rect width="1000" height="770" fill="#ffffff"/>
<text class="h" x="16" y="28">Основной экран «Установка»: что где</text>
<text class="s" x="16" y="48">Одно окно без прокрутки (1280×800 и больше). Наведение — окошко с подробностями, нажатие — окно; на планшете первое касание —</text>
<text class="s" x="16" y="64">окошко, второе — действие. Цвет никогда не единственный признак: у каждого состояния значок и слово.</text>

