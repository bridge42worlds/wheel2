<text class="h" x="16" y="28">Как работает установка: кто что делает и кто кому что шлёт</text>
<text class="s" x="16" y="48">Функциональная схема (провода и питание — на схемах подключения). Все платы — XIAO ESP32-S3 с прошивкой prime_lab;</text>
<text class="s" x="16" y="64">роль задаёт сервер: ▶ генерация, ▼ поглощение, ◆ статика (S), ⚙ моторы или катушка (M).</text>

