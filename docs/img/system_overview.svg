<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1010" width="1000" height="1010" role="img">
<title>Как работает установка «Колесо-2»: кто что делает и кто кому что шлёт</title>
<desc>Функциональная схема установки, не проводка. Вверху — установка на раме. Слева колесо 1: обод — труба с обмоткой катушки, на ободе шесть агентов на шине 5,1 В: №3, №5, №11, №12, №20 и №6; места на ободе условны. У №6 датчик обода ICM-42688 — обороты и k; у №20 магнитометр MLX90393 — поле катушки. В середине колеса — мотор M1 на оси; внутри колеса агенты говорят между собой по ESP-NOW: группа и пульс. Под колесом 1 — агент катушки №13 (роль M): мост DRV8871 питает обмотку обода. Справа колесо 2 с агентами №14–№19 и мотором M2; агента катушки колеса 2 пока нет. Дуга ESP-NOW между колёсами: простые генераторов уходят поглотителям другого колеса, обратно — обратный шум. Между колёсами, неподвижно на раме: №8 — статика, роль S, акселерометр ADXL355, 500 Гц, по центру оси; №9 — телефон, акселерометр и магнитометр; ниже — №10, агент моторов, роль M: два моста DRV8871 от 12 В, провода к моторам M1 и M2. Под установкой — сеть опыта: свой роутер Wi-Fi 2,4 ГГц; все платы и телефон по Wi-Fi, ноутбук-сервер — кабелем. Между сетью и сервером шесть потоков. Вниз к серверу: телеметрия агентов по UDP 5005 — пакеты tel, grp, nbr, imu, mag, acc; телефон — HTTP POST /api/ingest, те же пакеты строками. Вверх к агентам: команды по UDP 5007 — CFG (настройка), MOT (моторы и катушка), OTA, IDENT; маяк сервера всем по UDP 5006 — строка «W2SRV 5005» раз в 2 секунды, по нему агенты находят сервер; образ прошивки по HTTP 8090 — /fw/prime_lab.bin, агент скачивает его по команде OTA. Справа — планшет: основной экран «Установка» в браузере, http://сервер:8090/, страница и /api в обе стороны. Сервер — ноутбук, server/monitor.py, Python 3 без сторонних библиотек, статика — numpy, запуск tools/monitor.cmd. Его части: приём UDP 5005, пакеты как есть в data/raw; простые — primecheck перепроверяет, считает ложные; статика — static_watch: спектр, эталон, тревога; программа — опыты, контроль, итоги; моторы и катушки — motors и coils шлют MOT раз в секунду; калибровка колёс — analysis и rimcal: масштаб гироскопа, радиус, k, тахометр; маяк UDP 5006; команды UDP 5007; HTTP 8090: экран, /api, /api/ingest, /fw. Всё пишется в data/. Условные знаки: телеметрия — синяя сплошная; команды — красно-оранжевый пунктир; маяк — оранжевый штрихпунктир; прошивка — сиреневые длинные штрихи; ESP-NOW — зелёные точки; HTTP планшета — серая толстая; провода к моторам и катушке — чёрная толстая.</desc>
