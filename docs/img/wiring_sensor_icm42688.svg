<text class="h" x="16" y="28">Колесо 1, агент №6: датчик обода ICM-42688-P — подключение по I²C</text>
<text class="s" x="16" y="48">Фиолетовый модуль: четыре провода к агенту — 3V3, GND, D4 (SDA), D5 (SCL) — и три перемычки на выводах модуля:</text>
<text class="s" x="16" y="64">SDO/AD0 → GND (адрес 0x68), CS → VCC (режим I²C), INT2/FSYNC → GND (по паспорту); INT1 свободен. Та же схема — для роли S.</text>

