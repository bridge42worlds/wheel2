<text class="t b" x="967" y="362" text-anchor="middle" transform="rotate(-90 967 362)">ICM-42688-P</text>

<!-- пояснения под схемой -->
<text class="s" x="16" y="590">VCC модуля — только от 3V3 агента, не от 5V. Без стабилизатора на</text>
<text class="s" x="16" y="606">модуле 5 В сожгут чип (предел VDD и VDDIO — 4 В), а со стабилизатором —</text>
<text class="s" x="16" y="622">5 В попадут на CS: он перемычкой на VCC, а по паспорту CS — на VDDIO (3,3 В).</text>
<text class="s" x="16" y="638">Подтяжки SDA, SCL уже на модуле: R1, R2 к 3,3 В модуля — два резистора</text>
<text class="s" x="16" y="654">у выводов SDA и SCL (надпись 472 или 103, бывает без надписи); нет их —</text>
<text class="s" x="16" y="670">4,7 кОм от SDA и SCL к VCC. При слабых подтяжках прошивка сама</text>
<text class="s" x="16" y="686">переходит на 100 кГц.</text>
<text class="s" x="530" y="590">Надписи на вашей плате могут быть другими:</text>
<text class="s" x="530" y="606">SDO/AD0 — SAO, SA0, ADO; SCL — SCK; SDA — SDI;</text>
<text class="s" x="530" y="622">CS — NCS; INT2 — FSY, FSYNC; VCC — VIN, 3V3. И порядок</text>
<text class="s" x="530" y="638">выводов другой — паять по надписям, не по месту.</text>
<text class="s" x="530" y="654">Нет на плате вывода INT2/FSYNC — эту перемычку пропустить.</text>

<rect class="nb" x="16" y="702" width="476" height="254" rx="6"/>
<text class="t b" x="28" y="724">Адрес и что ждёт прошивка</text>
<text class="s" x="28" y="744">I²C 400 кГц: D4 = GPIO5 = SDA, D5 = GPIO6 = SCL,</text>
<text class="s" x="28" y="762">в прошивке Wire.begin(5, 6, 400000)</text>
<text class="s" x="28" y="780">адрес 0x68 (1101000): SDO/AD0 на GND; на 3,3 В было бы 0x69</text>
<text class="s" x="28" y="798">WHO_AM_I (регистр 0x75) = 0x47 — другой код прошивка не берёт</text>
<text class="s" x="28" y="816">0x7E в списке шины — общий адрес I3C, ICM отвечает и на него: норма</text>
<text class="s" x="28" y="834">обод: ±16 g, ±2000 °/с, 200 Гц, полоса 40 Гц, малый шум</text>
<text class="s" x="28" y="852">роль S (статика): та же схема — только ускорение, 1000 Гц, FIFO</text>
<text class="s" x="28" y="870">если шину читает №6 (запасной вариант) — INA219 шины (0x40)</text>
<text class="s" x="28" y="888">на те же D4/D5, параллельно</text>
<text class="s" x="28" y="906">INT1 прошивка не использует; INT2/FSYNC — на GND по паспорту</text>
<text class="s" x="28" y="924">(табл. 9). На уже работающем №6 перепаивать не обязательно:</text>
<text class="s" x="28" y="942">после включения вывод 9 — выход INT2 с открытым стоком</text>

<rect class="nb" x="508" y="702" width="482" height="254" rx="6"/>
<text class="t b" x="520" y="724">Механика: обод, до ~8 g</text>
<text class="s" x="520" y="744">модуль — плашмя и жёстко (винт или клей), не висит на проводах</text>
<text class="s" x="520" y="762">4 провода до 15 см скрутить; концы у пайки — в термоусадку</text>
<text class="s" x="520" y="780">провода привязать к ободу в 1–2 см от пайки: вибрация не ломает её</text>
<text class="s" x="520" y="798">перемычки AD0–GND, CS–VCC, INT2–GND — коротко, у выводов модуля</text>
<text class="s" x="520" y="816">как повёрнута плата — не важно: ось колеса прошивка находит сама</text>
<text class="s" x="520" y="834">добавочные конденсаторы — керамика, ногами прямо на VCC и GND</text>
<text class="s" x="520" y="852">предел по паспорту — 20 000 g (без питания, 0,2 мс): 8 g не страшны</text>

<text class="t b" x="16" y="986">Пайка и проверка</text>
<text class="t" x="16" y="1008">1. Шину выключить, №6 отключить от USB. Паять флюсом, не пастой; после пайки отмыть спиртом.</text>
<text class="t" x="16" y="1028">2. Перемычки на модуле: SDO/AD0 → GND, CS → VCC, INT2/FSYNC → GND — коротким проводом или каплей припоя, если выводы рядом.</text>
<text class="t" x="16" y="1048">3. Провода к №6: VCC ← 3V3, GND ← GND, SDA ← D4, SCL ← D5. INT1 — не подключать.</text>
<text class="t" x="16" y="1068">4. Прозвонка без питания: AD0–GND, CS–VCC и INT2–GND звенят; SDA–SCL, SDA–GND, SCL–GND не звенят;</text>
<text class="t" x="34" y="1088">VCC–GND не звенит (короткий писк — заряжаются конденсаторы, это нормально).</text>
<text class="t" x="16" y="1108">5. С питанием, мультиметр на выводах модуля: VCC–GND 3,2–3,3 В; CS 3,3 В; AD0 и INT2 0 В; SDA и SCL в покое около 3,3 В.</text>
<text class="t" x="16" y="1128">6. Журнал при старте: «RIM i2c: 0x68 0x7e» (с INA219 — 0x40 0x68 0x7e) и «RIM ICM-42688 at 0x68 who=0x47 cfg=0f 07 07 44».</text>
<text class="t" x="16" y="1148">7. Телеметрия №6 — те же числа десятичными: "i2c":[104,126], "imu":{"addr":104,"who":71,"cfg":[15,7,7,68],"err":0}; в покое |a| ≈ 1,00 g.</text>
<text class="t" x="16" y="1168">8. «nothing answers» — нет питания или GND, SDA/SCL перепутаны, CS не на 3,3 В. Адрес скачет 0x68/0x69, «RIM no sensors» — AD0 висит.</text>
<text class="t" x="16" y="1188">9. Роль S: в журнале «SACC ICM-42688 at 0x68 who=0x47». Растёт "err" — пайка или провода: перепаять, провода укоротить.</text>

