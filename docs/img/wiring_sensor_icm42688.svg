<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1242" width="1000" height="1242" role="img">
<title>Колесо 1, агент №6: датчик обода ICM-42688-P — подключение по I²C</title>
<desc>Агент №6 колеса 1 — плата XIAO ESP32-S3 на ободе. Питание агента: плюс шины колеса 5,1 В через диод 1N5819 (полоской к агенту) на вывод 5V, минус шины — на вывод GND. От агента к фиолетовому модулю ICM-42688-P четыре провода: 3V3 агента на VCC модуля (только 3,3 В, не 5 В), GND агента на GND модуля, D4 (GPIO5) на SDA, D5 (GPIO6) на SCL; шина I2C 400 кГц. На выводах модуля три перемычки: SDO/AD0 на GND — адрес 0x68; CS на VCC — режим I2C, по паспорту вывод CS — на VDDIO; INT2/FSYNC на GND — так велит паспорт, если FSYNC не используется. INT1 не подключается. По желанию между VCC и GND у самых выводов модуля добавить керамику 0,1 мкФ и 10 мкФ. Внутри модуля, уже есть: от VCC — стабилизатор 3,3 В, если он стоит на плате, его общий вывод на GND; от 3,3 В питаются вывод 8 VDD и вывод 5 VDDIO чипа; конденсаторы C1 0,1 мкФ и C2 2,2 мкФ у VDD и C3 10 нФ у VDDIO — между 3,3 В и GND; резисторы подтяжки R1 от SDA и R2 от SCL к 3,3 В модуля, 4,7–10 кОм. Выводы модуля идут на выводы чипа: SDO/AD0 на 1, GND на 6, CS на 12, SDA на 14, SCL на 13, INT1 на 4, INT2/FSYNC на 9. Прошивка ищет датчик на 0x68 и 0x69 и ждёт WHO_AM_I 0x47; отклик на 0x7E — общий адрес I3C, это нормально.</desc>
