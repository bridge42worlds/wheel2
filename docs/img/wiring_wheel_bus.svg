<line class="m" x1="605" y1="196" x2="605" y2="330"/>
<text class="h" x="620" y="183">+</text>
<text class="t b" x="620" y="216">C2</text>
<text class="s" x="620" y="231">470</text><text class="s" x="620" y="245">мкФ</text>
<circle cx="605" cy="70" r="3.5" fill="#D55E00"/><circle cx="605" cy="330" r="3.5" fill="#1d2228"/>
<line class="p" x1="680" y1="70" x2="680" y2="120"/>
<polygon class="d" points="670,120 690,120 680,138"/>
<line class="pl" x1="669" y1="139" x2="691" y2="139" style="stroke-width:3.6"/>
