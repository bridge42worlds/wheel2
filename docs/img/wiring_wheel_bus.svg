<circle cx="680" cy="70" r="3.5" fill="#D55E00"/>
<rect class="box" x="649" y="180" width="62" height="70" rx="5"/>
<text class="s" x="655" y="194">5V</text><text class="s" x="655" y="244">GND</text>
<text class="t" x="680" y="219" text-anchor="middle">агент 4</text>
<line class="m" x1="680" y1="250" x2="680" y2="330"/>
<circle cx="680" cy="330" r="3.5" fill="#1d2228"/>
<line class="p" x1="755" y1="70" x2="755" y2="120"/>
<polygon class="d" points="745,120 765,120 755,138"/>
<line class="pl" x1="744" y1="139" x2="766" y2="139" style="stroke-width:3.6"/>
<line class="p" x1="755" y1="140" x2="755" y2="180"/>
<circle cx="755" cy="70" r="3.5" fill="#D55E00"/>
<rect class="box" x="724" y="180" width="62" height="70" rx="5"/>
<text class="s" x="730" y="194">5V</text><text class="s" x="730" y="244">GND</text>
<text class="t" x="755" y="219" text-anchor="middle">агент 5</text>
<line class="m" x1="755" y1="250" x2="755" y2="330"/>
<circle cx="755" cy="330" r="3.5" fill="#1d2228"/>
<line class="p" x1="830" y1="70" x2="830" y2="186"/>
<line class="pl" x1="818" y1="186" x2="842" y2="186"/>
<path class="pl" d="M818 199 Q830 192 842 199"/>
<line class="m" x1="830" y1="196" x2="830" y2="330"/>
<text class="h" x="845" y="183">+</text>
<text class="t b" x="845" y="216">C3</text>
<text class="s" x="845" y="231">470</text><text class="s" x="845" y="245">мкФ</text>
<circle cx="830" cy="70" r="3.5" fill="#D55E00"/><circle cx="830" cy="330" r="3.5" fill="#1d2228"/>
<line class="p" x1="905" y1="70" x2="905" y2="120"/>
<polygon class="d" points="895,120 915,120 905,138"/>
<line class="pl" x1="894" y1="139" x2="916" y2="139" style="stroke-width:3.6"/>
<line class="p" x1="905" y1="140" x2="905" y2="180"/>
<circle cx="905" cy="70" r="3.5" fill="#D55E00"/>
<rect class="box" x="874" y="180" width="62" height="70" rx="5"/>
<text class="s" x="880" y="194">5V</text><text class="s" x="880" y="244">GND</text>
<text class="t" x="905" y="219" text-anchor="middle">агент 6</text>
<line class="m" x1="905" y1="250" x2="905" y2="330"/>
<circle cx="905" cy="330" r="3.5" fill="#1d2228"/>
<text class="s" x="20" y="380">Диод 1N5819 — полоской (на символе — черта) к выводу 5V агента.</text>
<text class="s" x="20" y="398">C1–C3 — электролиты 470 мкФ, плюсом к шине +: C1 у DC-DC, C2 посередине шины, C3 в конце, перед последним агентом. Полоса на банке — минус.</text>
<text class="s" x="20" y="416">Плюс и минус шины ведите рядом, скрученной парой; кольцом вокруг катушки шину не замыкать.</text>
<text class="s" x="20" y="434">Платы подключать при выключенном питании.</text>
<line class="p" x1="20" y1="460" x2="56" y2="460"/><text class="s" x="64" y="464">плюс</text>
<line class="m" x1="130" y1="460" x2="166" y2="460"/><text class="s" x="174" y="464">минус</text>
<circle cx="250" cy="460" r="3.5" fill="#1d2228"/><text class="s" x="260" y="464">точка — провода соединены</text>
</svg>
