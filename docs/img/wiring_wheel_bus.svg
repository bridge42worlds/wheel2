<line class="m" x1="455" y1="250" x2="455" y2="330"/>
<circle cx="455" cy="330" r="3.5" fill="#1d2228"/>
<line class="p" x1="530" y1="70" x2="530" y2="120"/>
<polygon class="d" points="520,120 540,120 530,138"/>
<line class="pl" x1="519" y1="139" x2="541" y2="139" style="stroke-width:3.6"/>
<line class="p" x1="530" y1="140" x2="530" y2="180"/>
<circle cx="530" cy="70" r="3.5" fill="#D55E00"/>
<rect class="box" x="499" y="180" width="62" height="70" rx="5"/>
<text class="s" x="505" y="194">5V</text><text class="s" x="505" y="244">GND</text>
