<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img">
<title>Колесо 1: INA219 в контуре катушки — читает №13</title>
<desc>Плюс аккумуляторов катушки 2×18650 через выключатель приходит на VIN+ модуля INA219, через шунт 0,1 Ом выходит с VIN− на IN+ DC-DC 5,1 В. Минус аккумуляторов идёт на IN− DC-DC, к нему же GND модуля. С DC-DC плюс идёт на VM моста DRV8871, конденсатор 470 мкФ плюсом к нему, и через 1N5819 полоской на 5V агента катушки №13. Минус — на GND моста; GND №13 — на GND моста со стороны входов. D0 и D1 №13 — на IN1 и IN2 моста, OUT1 и OUT2 — на катушку. От №13 к модулю три провода: 3V3 на VCC, D5 на SCL, D4 на SDA.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2228}
.h{font-size:15px;font-weight:600}.t{font-size:13px}.s{font-size:12px;fill:#4a535e}
.box{fill:#fff;stroke:#1d2228;stroke-width:1.3}
.p{stroke:#D55E00;stroke-width:2.6;fill:none}.m{stroke:#1d2228;stroke-width:2;fill:none}
.pl{stroke:#1d2228;stroke-width:2.6;fill:none}.d{fill:none;stroke:#1d2228;stroke-width:1.6}
.sig{stroke:#0072B2;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
.v3{stroke:#CC79A7;stroke-width:2;fill:none}
.in{stroke:#4a535e;stroke-width:1.4;fill:none}
</style>
<rect width="760" height="560" fill="#ffffff"/>
<text class="h" x="16" y="28">Колесо 1: INA219 в контуре катушки — читает №13</text>
<text class="s" x="16" y="48">Ток катушки и агента №13 идёт через шунт: аккумуляторы → выключатель → INA219 → DC-DC 5,1 В → мост и №13.</text>

<!-- аккумуляторы -->
<rect class="box" x="16" y="96" width="70" height="150" rx="6"/>
<text class="h" x="51" y="166" text-anchor="middle">2×18650</text>
<text class="s" x="51" y="186" text-anchor="middle">7,4 В</text>
<text class="h" x="80" y="129" text-anchor="end">+</text>
<text class="h" x="80" y="233" text-anchor="end">−</text>

<!-- выключатель -->
<line class="p" x1="86" y1="124" x2="100" y2="124"/>
<circle cx="100" cy="124" r="3" fill="#D55E00"/><circle cx="126" cy="124" r="3" fill="#D55E00"/>
<line class="p" x1="100" y1="124" x2="123" y2="111"/>
<line class="p" x1="126" y1="124" x2="160" y2="124"/>
<text class="s" x="113" y="84" text-anchor="middle">выключатель</text>

<!-- INA219 -->
<rect class="box" x="160" y="84" width="180" height="104" rx="6"/>
<text class="s" x="166" y="114">VIN+</text>
<text class="s" x="334" y="114" text-anchor="end">VIN−</text>
<line class="in" x1="160" y1="124" x2="222" y2="124"/>
<rect x="222" y="118" width="56" height="12" fill="#ffffff" stroke="#4a535e" stroke-width="1.4"/>
<line class="in" x1="278" y1="124" x2="340" y2="124"/>
<text class="s" x="250" y="146" text-anchor="middle">шунт 0,1 Ом (R100)</text>
<text class="h" x="250" y="166" text-anchor="middle">INA219 · 0x40</text>
<text class="s" x="185" y="182" text-anchor="middle">VCC</text>
<text class="s" x="225" y="182" text-anchor="middle">GND</text>
<text class="s" x="265" y="182" text-anchor="middle">SCL</text>
<text class="s" x="305" y="182" text-anchor="middle">SDA</text>

<line class="p" x1="340" y1="124" x2="400" y2="124"/>
<text class="s" x="370" y="114" text-anchor="middle">18 AWG</text>

<!-- DC-DC -->
<rect class="box" x="400" y="96" width="90" height="150" rx="6"/>
<text class="h" x="445" y="166" text-anchor="middle">DC-DC</text>
<text class="s" x="445" y="186" text-anchor="middle">5,1 В</text>
<text class="s" x="406" y="120">IN+</text><text class="s" x="406" y="224">IN−</text>
<text class="s" x="484" y="120" text-anchor="end">OUT+</text><text class="s" x="484" y="224" text-anchor="end">OUT−</text>

<!-- минус аккумуляторов и GND модуля -->
<line class="m" x1="86" y1="228" x2="400" y2="228"/>
<line class="m" x1="225" y1="188" x2="225" y2="228"/>
<circle cx="225" cy="228" r="3.5" fill="#1d2228"/>

<!-- три провода к №13 -->
<line class="v3" x1="185" y1="188" x2="185" y2="300"/>
<line class="sig" x1="265" y1="188" x2="265" y2="300"/>
<line class="sig" x1="305" y1="188" x2="305" y2="300"/>
<text class="s" x="20" y="266">три провода к №13,</text>
<text class="s" x="20" y="282">10–30 см, скрутить</text>

<!-- агент катушки №13 -->
<rect class="box" x="160" y="300" width="220" height="110" rx="6"/>
<text class="s" x="185" y="316" text-anchor="middle">3V3</text>
<text class="s" x="265" y="316" text-anchor="middle">D5</text>
<text class="s" x="305" y="316" text-anchor="middle">D4</text>
<text class="h" x="258" y="346" text-anchor="middle">XIAO ESP32-S3 · №13</text>
<text class="s" x="258" y="368" text-anchor="middle">D4/D5 свободны —</text>
<text class="s" x="258" y="386" text-anchor="middle">на них только INA219</text>
<text class="s" x="374" y="338" text-anchor="end">5V</text>
<text class="s" x="374" y="360" text-anchor="end">D0</text>
<text class="s" x="374" y="378" text-anchor="end">D1</text>
<text class="s" x="374" y="396" text-anchor="end">GND</text>

<!-- плюс 5,1 В: конденсатор, диод, мост -->
<path class="p" d="M490 124 H620 V300"/>
<line class="m" x1="490" y1="228" x2="680" y2="228"/>
<path class="m" d="M680 228 V300"/>
<circle cx="680" cy="228" r="3.5" fill="#1d2228"/>

<line class="p" x1="515" y1="124" x2="515" y2="166"/>
<line class="pl" x1="503" y1="166" x2="527" y2="166"/>
<path class="pl" d="M503 179 Q515 172 527 179"/>
<line class="m" x1="515" y1="176" x2="515" y2="228"/>
<text class="h" x="529" y="162">+</text>
<text class="s" x="530" y="194">470 мкФ</text>
<circle cx="515" cy="124" r="3.5" fill="#D55E00"/><circle cx="515" cy="228" r="3.5" fill="#1d2228"/>

<line class="p" x1="592" y1="124" x2="592" y2="268"/>
<circle cx="592" cy="124" r="3.5" fill="#D55E00"/>
<polygon class="d" points="582,268 602,268 592,286"/>
<line class="pl" x1="581" y1="287" x2="603" y2="287" style="stroke-width:3.6"/>
<path class="p" d="M592 288 V334 H380"/>
<text class="s" x="576" y="278" text-anchor="end">1N5819,</text>
<text class="s" x="576" y="294" text-anchor="end">полоска к №13</text>

<!-- мост DRV8871 -->
<rect class="box" x="600" y="300" width="100" height="110" rx="6"/>
<text class="s" x="620" y="316" text-anchor="middle">VM</text>
<text class="s" x="680" y="316" text-anchor="middle">GND</text>
<text class="t" x="662" y="342" text-anchor="middle" style="font-weight:600">DRV8871</text>
<text class="s" x="606" y="360">IN1</text>
<text class="s" x="606" y="378">IN2</text>
<text class="s" x="606" y="396">GND</text>
<text class="s" x="694" y="364" text-anchor="end">OUT1</text>
<text class="s" x="694" y="394" text-anchor="end">OUT2</text>
<line class="sig" x1="380" y1="356" x2="600" y2="356"/>
<line class="sig" x1="380" y1="374" x2="600" y2="374"/>
<line class="m" x1="380" y1="392" x2="600" y2="392"/>

<!-- катушка -->
<path class="m" d="M700 360 H722 a5 5 0 0 1 0 10 a5 5 0 0 1 0 10 a5 5 0 0 1 0 10 H700"/>
<text class="s" x="730" y="350" text-anchor="middle">катушка</text>

<text class="s" x="16" y="444">Модуль — как на схеме шины: силовые провода — в клемму VIN+ / VIN−, к №13 — VCC, SCL, SDA,</text>
<text class="s" x="16" y="462">GND модуля — на минус аккумуляторов рядом с модулем.</text>
<text class="s" x="16" y="480">Через шунт идёт ток катушки и №13: при катушке 5 Ом (0,9 А на 4,5 В) на входе около 0,7 А — предел модуля 3,2 А.</text>
<text class="s" x="16" y="498">D0/D1 → IN1/IN2 и катушка — по схеме катушки. 470 мкФ — вплотную к VM и GND моста.</text>

<line class="p" x1="16" y1="532" x2="52" y2="532"/><text class="s" x="60" y="536">плюс</text>
<line class="m" x1="110" y1="532" x2="146" y2="532"/><text class="s" x="154" y="536">минус</text>
<line class="sig" x1="210" y1="532" x2="246" y2="532"/><text class="s" x="254" y="536">сигналы (I²C, D0/D1)</text>
<line class="v3" x1="400" y1="532" x2="436" y2="532"/><text class="s" x="444" y="536">3,3 В модулю</text>
<circle cx="546" cy="532" r="3.5" fill="#1d2228"/><text class="s" x="556" y="536">точка — провода соединены</text>
</svg>
