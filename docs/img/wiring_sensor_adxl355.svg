<text class="h" x="16" y="28">Статика №8: точный акселерометр ADXL355 — подключение по I²C</text>
<text class="s" x="16" y="48">№8 (роль S) стоит на раме между колёсами, по центру оси, питается от повербанка через USB-C. Датчик — на 3V3, GND, D4, D5;</text>
<text class="s" x="16" y="64">выводы SCLK и ASEL модуля — на GND: так датчик говорит по I²C с адресом 0x1D. Конденсаторы у выводов датчика уже стоят на модуле.</text>

