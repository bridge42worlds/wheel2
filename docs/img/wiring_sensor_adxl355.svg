<line class="in" x1="572" y1="1060" x2="608" y2="1060"/><text class="s" x="616" y="1064">дорожка на модуле</text>
<rect class="opt" x="740" y="1054" width="18" height="8"/><text class="s" x="766" y="1064">пунктир у детали — может не быть</text>
<circle cx="20" cy="1080" r="3.5" fill="#1d2228"/><text class="s" x="30" y="1084">точка — провода соединены; без точки — пересекаются</text>
<use href="#gn" x="360" y="1074"/><text class="s" x="374" y="1084">земля модуля (GND)</text>
<text class="s" x="510" y="1084">×  — не подключать</text>
<text class="s" x="640" y="1084"><tspan class="b">C9</tspan> — по желанию; C1–C8 — на модуле; R1, R2 — шаг 5</text>
