<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" width="1000" height="1100" role="img">
<title>Статика №8: точный акселерометр ADXL355 — подключение по I²C</title>
<desc>Агент №8 — плата XIAO ESP32-S3 в роли S, стоит на раме между колёсами по центру оси. Рабочее питание — повербанк, кабель USB-A → USB-C в разъём агента; вывод 5V агента ничем не занят. Проверка перед установкой — от кабеля USB компьютера: журнал платы виден только по USB. От агента к модулю ADXL355 четыре провода: 3V3 агента на VCC модуля, GND агента на GND модуля, D4 (GPIO5) на SDA модуля — это вывод 3 датчика MOSI/SDA, D5 (GPIO6) на SCL модуля — вывод 1 датчика CS/SCL. Вывод модуля SCLK (вывод 2 датчика SCLK/VSSIO) соединён с GND — так датчик работает по I2C. Вывод модуля ASEL (вывод 4 датчика MISO/ASEL) соединён с GND — адрес 0x1D. По желанию добавить конденсатор C9, керамика 10 мкФ, между VCC и GND вплотную к выводам модуля. Уже есть на модуле, по паспорту ADI, рисунок 59: VCC идёт на выводы датчика 11 VSUPPLY и 5 VDDIO, GND — на 9 VSS, 6 VSSIO и 7 RESERVED (его по паспорту можно и не подключать). У вывода 11 VSUPPLY — C1 0,1 мкФ и C2 1 мкФ на 9 VSS; у вывода 5 VDDIO — C3 0,1 мкФ и C4 1 мкФ на 6 VSSIO. Выводы 10 V1P8ANA и 8 V1P8DIG — выходы стабилизаторов 1,8 В внутри датчика: у 10 — C5 0,1 мкФ и C6 1 мкФ на 9 VSS, у 8 — C7 0,1 мкФ и C8 1 мкФ на 6 VSSIO; больше никуда их не подключать. Подтяжки R1 от SDA к VCC и R2 от SCL к VCC, 4,7–10 кОм, есть не на всех модулях. Выводы INT1 (12), INT2 (13) и DRDY (14) не подключать; второй VDD и второй GND на разъёме модуля, если есть, не нужны; NC не подключать. Прошивка ищет ADXL355 на адресах 0x1D и 0x53, шина 400 кГц.</desc>
