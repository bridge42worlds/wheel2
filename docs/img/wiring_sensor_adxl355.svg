<text class="n" x="170" y="330">C5</text><text class="n" x="130" y="330">C6</text>
<text class="n" x="170" y="420">C7</text><text class="n" x="130" y="420">C8</text>
<text class="n" x="140" y="358" text-anchor="middle">на 9 VSS</text>
<text class="n" x="140" y="448" text-anchor="middle">на 6 VSSIO</text>
<text class="s" x="32" y="310">1,8 В</text><text class="s" x="32" y="400">1,8 В</text>
<text class="n" x="32" y="464">C1 C3 C5 C7 — 0,1 мкФ</text>
<text class="n" x="32" y="478">C2 C4 C6 C8 — 1 мкФ</text>
<text class="n" x="32" y="494">R1 R2 — подтяжки I²C</text>
<text class="n" x="32" y="508">4,7–10 кОм, не на всех</text>
<use href="#gn" x="39" y="517"/><text class="n" x="52" y="525">— GND модуля</text>
<text class="n b" x="32" y="543">V1P8: только C5–C8!</text>

<text class="s" x="16" y="586">На вашей плате может быть подписано: SDA = MOSI, SCL = CS, ASEL = MISO (SDO), VCC = VDD;</text>
<text class="s" x="16" y="602">порядок выводов — другой. SCLK → GND — режим I²C, ASEL → GND — адрес 0x1D.</text>
<text class="s" x="16" y="618">Второй VDD и второй GND на разъёме (если есть) — не нужны; NC — не подключать.</text>

<!-- что ждёт прошивка -->
<rect class="box" x="16" y="652" width="464" height="190" rx="6"/>
<text class="c" x="28" y="674">ЧТО ЖДЁТ ПРОШИВКА (РОЛЬ S)</text>
<text class="s" x="28" y="696">Шина: D4 — SDA, D5 — SCL, 400 кГц: Wire.begin(5, 6, 400000)</text>
<text class="s" x="28" y="714"><tspan class="b">Адрес 0x1D</tspan> — ASEL на GND; 0x53 — ASEL на 3V3 (тоже найдёт)</text>
<text class="s" x="28" y="732">Опознание: регистры 0x00–0x02 = 0xAD, 0x1D, 0xED</text>
<text class="s" x="28" y="750">±2 g; 20 разрядов → int16: 16000 на g, ступень 62,5 мкg</text>
<text class="s" x="28" y="768">Выдача 1000/avg Гц (avg 2 → 500 Гц), фильтр датчика — четверть</text>
<text class="s" x="28" y="786">FIFO датчика на 32 тройки x y z, агент забирает раз в 10 мс</text>
<text class="s" x="28" y="804">Регистры обратно: FILTER 03, RANGE 01, POWER_CTL 00</text>
<text class="s" x="28" y="822">Шум: паспорт 25 мкg/√Гц, замер на столе 21.10 — 15–20</text>

<!-- пайка и проверка -->
<text class="c" x="500" y="674">ПАЙКА И ПРОВЕРКА</text>
<text class="s" x="500" y="696">1. Питание отключить. Провода 5–10 см, скрутить вместе:</text>
<text class="s" x="516" y="712">3V3 → VCC, GND → GND, D4 → SDA, D5 → SCL. У XIAO (USB сверху)</text>
<text class="s" x="516" y="728">D4, D5 — пятый и шестой слева; GND, 3V3 — второй и третий справа.</text>
<text class="s" x="500" y="748">2. На модуле SCLK → GND (без этого I²C у датчика не включится),</text>
<text class="s" x="516" y="764">ASEL → GND (адрес 0x1D). Висеть не оставлять — адрес прыгает.</text>
<text class="s" x="500" y="784">3. INT1, INT2, DRDY, NC, V1P8ANA, V1P8DIG — ничего не паять.</text>
<text class="s" x="516" y="800">По желанию — C9 10 мкФ на выводы VCC и GND модуля, вплотную.</text>
<text class="s" x="500" y="820">4. Без питания: VCC–GND и 3V3–GND не звенят; SDA и SCL не звенят</text>
<text class="s" x="516" y="836">ни с GND, ни между собой; SCLK–GND и ASEL–GND звенят.</text>
<text class="s" x="500" y="856">5. Подтяжки: щуп + на VCC модуля, щуп − на SDA, потом на SCL:</text>
<text class="s" x="516" y="872">4,7–10 кОм — есть R1, R2; больше 100 кОм — припаять по 4,7 кОм</text>
<text class="s" x="516" y="888">от SDA и от SCL к VCC. Щупы наоборот — ложные кОм через диоды.</text>
<text class="s" x="500" y="908">6. Кабель USB-C от компьютера: VCC–GND модуля около 3,3 В;</text>
<text class="s" x="516" y="924">SDA, SCL 3,3 В; на C5–C8, если достать щупом, около 1,8 В — датчик жив.</text>
<text class="s" x="500" y="944">7. Журнал по USB (tools/serial_capture.py): «SACC ADXL355 at 0x1d»,</text>
<text class="s" x="516" y="960">«cfg ok: filter 03 range 01 power 00». На повербанке его не видно.</text>
<text class="s" x="500" y="980">8. Панель: «точный акселерометр ADXL355», 500 Гц, |a| ≈ 1,00 g,</text>
<text class="s" x="516" y="996">z ≈ +1 g, x и y около 0; ошибок шины и переполнений FIFO нет.</text>
<text class="s" x="500" y="1016">9. Отключить компьютер, повербанк в USB-C, закрепить (см. «Крепление»),</text>
<text class="s" x="516" y="1032">10 мин прогрева, записать эталон заново «◆ эталон 5 мин».</text>

<!-- крепление -->
<text class="c" x="16" y="866">КРЕПЛЕНИЕ</text>
<text class="s" x="16" y="886">Модуль — жёстко и ровно на раме (винты М2–М3 или тонкий</text>
<text class="s" x="16" y="902">плотный скотч), чипом вверх: z смотрит вверх. Провода прихватить</text>
<text class="s" x="16" y="918">стяжкой: на проводах плата звенит (21.10 — линия 132–136 Гц).</text>
<text class="s" x="16" y="934">Повербанк — рядом, но не касается модуля и его площадки;</text>
<text class="s" x="16" y="950">кабель USB тоже закрепить, чтобы не тянул агента.</text>

