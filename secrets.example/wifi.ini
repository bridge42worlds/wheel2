# Образец. Скопируйте папку secrets.example в secrets (она не попадает в git) и впишите свою сеть.
# tools/gen_secrets.py при сборке прошивки переносит эти данные в secrets_gen.h; пароль никогда не печатается.
# Ключ подписи прошивок по Wi-Fi (secrets/ota.key) создаётся сам при первой сборке.
ssid=имя_вашей_сети
password=пароль_вашей_сети
# server= — адрес компьютера с сервером; пусто — агенты находят сервер сами по маяку
server=
